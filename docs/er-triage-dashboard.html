<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS — Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
</style>
</head>
<body>
  <h1>PRVS — Enhancement Request Triage</h1>
  <div class="sub">2026-08-06 &middot; nightly headless pass &middot; HEAD 362137d / index.html v1.491 &middot; 30 open items: 4 bugs + 26 Needed. Bugs are listed with LOE = size of the FIX (they are defects, not enhancements); see the "Bugs -- fix first" group.</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <input id="q" placeholder="Search ERs…">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 {id:"09084bc5",by:"Lynn",date:"08-04",cat:"BUG - large (data loss)",loe:"L",theme:"Bugs -- fix first",
  desc:"When an RO is closed and then reopened, all fields, parts, pictures and documents should be repopulated.",
  verdict:"CONFIRMED BUG, severity LARGE - permanent data loss. Both cash-out paths write the cashiered table through a 24-column allowlist that OMITS photo_library, planned_dropoff_date, pickup_date, key_status, keypad_code, keep_plugged_in and urgent_update (js/ro-crud.js L666-693; archive_cashiered_ros L48-107), then hard-delete the repair_orders row. cashiered_child_archives mirrors only 7 CHILD tables and has no photo/doc mirror, so reactivateRO (closed-ros.html L853-875) cannot restore what was never archived. Fix both archive paths AND the reactivate insert; needs a cashiered migration."},
 {id:"225a2535",by:"Brandon",date:"08-05",cat:"BUG - data-integrity",loe:"S",theme:"Bugs -- fix first",
  desc:"Insurance information entered in the dash transfers between different customers; scans must stay in their own profile.",
  verdict:"CONFIRMED BUG, severity data-integrity. window._lastEstimateScan is set per scan (js/insurance.js L118), keyed only by mode, and closeEditModal deliberately KEEPS it (js/ro-crud.js L1188-1193). Scan RO A, close without saving, open RO B: renderCustomInsuranceFields auto-fills A's values into B (L43-51) and saving B merges A's extracted data (index.html L6617-6619) into B's insurance_scans row. Fix: key the cache to the RO id, or clear it when the edit modal opens."},
 {id:"d4d0eeba",by:"Brandon",date:"07-22",cat:"BUG - small (nav)",loe:"S",theme:"Bugs -- fix first",
  desc:"Fix tracking when clicking a repair order in my list, or clicking the link in the Messages portion.",
  verdict:"CONFIRMED BUG, severity small (navigation, no data risk), two paths. Work list: scrollToROInBoard (index.html L4201) only matches already-rendered data-ro-index cards, else toasts (L4216, whose Clear Filters action re-renders but never then scrolls). Messages: js/qr.js handleDeepLink (L198) returns silently when the RO is not in currentFilteredData (L203). Canonical for 9031e101 and 1bc33dd6 - ONE fix closes all three: clear filters, re-render, scroll, highlight."},
 {id:"d94a418a",by:"Brandon",date:"07-27",cat:"BUG - data-display",loe:"S",theme:"Bugs -- fix first",
  desc:"RO STATUS text should be formatted exactly as typed; the latter portion currently shows near the top.",
  verdict:"CONFIRMED BUG, severity data-display (render only, no data loss). js/render.js L553 draws the card RO Status box via split-newline then map(escapeHtml) then reverse(), reversing EVERY line, so a multi-line note renders bottom-line-first. Entry boundaries are already lost upstream (js/ro-crud.js joins entries with a newline). L563 does the same to Customer Comm. Fix: reuse the S159 history-modal entry regex to split by entry, not by line, in both boxes."},
 {id:"5925fc01",by:"Lynn",date:"04-09",cat:"Notif/Digest",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Notify the right team on every RO update; daily comprehensive list of all in-progress jobs with to-dos scraped from status notes.",
  verdict:"PARTIAL at HEAD 362137d. The daily in-progress digest ships as supabase/functions/send-manager-report, and single-event notifies exist (service_added_notify js/work-orders.js L293; urgent_update_notify js/ro-crud.js L370). Still absent: notify-on-every-RO-update and to-do scraping from status notes - grep for ro_tasks / task_tracker / customer_task returns zero hits. Anchor of this theme; pairs with af14b3cb."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",cat:"Task-Tracking",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Per-customer task tracker with a daily reminder; each task stays on the list until marked complete.",
  verdict:"Confirmed still absent at HEAD 362137d: js/shop-tasks.js is a non-customer shop checklist with no ro_id link and no reminder column, and grep for ro_tasks / customer_task / task_tracker returns zero hits. Needs a per-RO tasks table, an add/complete UI and a daily open-task reminder. Pairs with 5925fc01."},
 {id:"5fec3eca",by:"Sofia",date:"07-15",cat:"Notif/Email",loe:"S",theme:"Notifications & Task-Tracking",
  desc:"Show the customer's address on the emailed copy of the authorization form.",
  verdict:"Confirmed still absent at HEAD 362137d: the raf_copy branch of supabase/functions/send-quote-email (L387) destructures to / cc / customerName / roId / signedDate / rv / services / workType / phone / customerType / serviceDesc / warrantyDesc / promisedDate / signatureDataUrl with no customerAddress. The address appears only in the lead_staff_notify branch (L549, HTML L674, text L748). Small: add customerAddress to the raf_copy payload and both templates."},
 {id:"14f35f95",by:"Lynn",date:"04-09",cat:"Parts",loe:"XL",theme:"Parts & Inventory",
  desc:"In-house parts inventory: order a box of 25, use 5, remaining 20 go to stock - listed as available, priced, and searchable.",
  verdict:"Confirmed still absent at HEAD 362137d: grep for inventory / on_hand / in_stock / stock_qty across js, supabase/migrations and supabase/functions returns zero code hits. Parts remain per-RO line items only (js/parts.js). New subsystem needed: inventory table, receive/consume/adjust flows, a searchable priced stock view, and links from the parts-request path. Largest item on the board."},
 {id:"b19975d4",by:"Lynn",date:"04-09",cat:"Parts",loe:"L",theme:"Parts & Inventory",
  desc:"Track a part that needs to be returned to the supplier or warrantied by the supplier.",
  verdict:"Partial infra only at HEAD 362137d: js/config.js PART_STATUSES (L200) includes Returned and js/parts.js has a Return Deadline input (pf_returnDeadline L226), but grep for rma / return_reason / supplier_credit returns zero hits - no RMA number, return reason, supplier credit or reverse-direction flow. Equals GH#24 Shop Ops Phase 2. Canonical for the declined duplicate 86bbaf50."},
 {id:"8d885331",by:"Lynn",date:"04-09",cat:"Parts",loe:"S",theme:"Parts & Inventory",
  desc:"Rework the field order on the parts-entry / ordering screen (move fields around).",
  verdict:"Parts-entry form exists and is unchanged at HEAD 362137d: js/parts.js pf_supplier L181, pf_partName L190, pf_serviceSilo L208, pf_returnDeadline L226. The ask is only to reorder those fields, which is quick once Lynn supplies the target layout or a mockup. BLOCKED on detail, not on effort."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",cat:"RO Archive",loe:"M",theme:"RO Fields & Status",
  desc:"A way to archive customers or units that only exist because we quoted them and never moved forward.",
  verdict:"Confirmed still absent at HEAD 362137d: the only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase L658), and a case-insensitive grep for archived / abandoned in js/render.js and js/config.js returns zero hits - no soft-archive flag, status or board filter for quoted-but-never-progressed units. Needs a flag, a board filter and an un-archive path. Pairs with 972af03c."},
 {id:"0e172b2c",by:"Sofia",date:"07-16",cat:"Account merge",loe:"M",theme:"RO Fields & Status",
  desc:"Merge duplicate customer accounts created under different spellings (Hubert vs Huebert), with a verify step.",
  verdict:"Partial at HEAD 362137d: js/duplicates.js has an RO-level merge/delete engine (getBaseROId L35, findDuplicateGroups L40, executeDupeMerge wired L116, photo_library merge L183-193) but it groups strictly on the PRVS-XXXX-XXXX base RO id (L44), so two ROs created under different spellings of one customer are never detected. Needs name/phone account dedup plus a verify-which-is-correct merge step. The one-off cleanup for this case is 3f254929."},
 {id:"972af03c",by:"Lynn",date:"07-17",cat:"RO Status",loe:"S",theme:"RO Fields & Status",
  desc:"Add status CANCELED - keep the record, do not delete it, so the notes survive.",
  verdict:"Confirmed still absent at HEAD 362137d: no Canceled / Cancelled RO status - js/config.js STATUS_PROGRESS_MAP (L151-164), js/render.js statusColorMap (L727-739) and ALL_STATUSES (L741-745) all end at Delivered/Cashed Out, and a case-insensitive grep for cancel in js/config.js returns zero hits. Small: add the status plus color/priority maps, exclude it from the on-lot and queue counts, keep the record for notes. Canonical for duplicate eb00a68d; pairs with 3e746c18."},
 {id:"3e746c18",by:"Lynn",date:"08-03",cat:"RO Status",loe:"S",theme:"RO Fields & Status",
  desc:"Add an RO status of TOTALED OUT.",
  verdict:"Valid and confirmed absent at HEAD 362137d: a case-insensitive grep for totaled / totalled across js/config.js and js/render.js returns zero hits, and STATUS_PROGRESS_MAP (L151-164) plus statusColorMap (L727-739) / ALL_STATUSES (L741-745) end at Delivered/Cashed Out. A distinct status value from 972af03c's Canceled, so kept as its own item, but ONE build should add both terminal statuses and exclude them from the queue / on-lot counts (js/render.js L656-658, L718-721)."},
 {id:"50175fce",by:"Lynn",date:"07-27",cat:"Urgent update",loe:"S",theme:"RO Fields & Status",
  desc:"Move the urgent-update input to the bottom of the tile instead of only inside Edit RO.",
  verdict:"Valid and confirmed absent at HEAD 362137d: urgent_update is writable only from the New/Edit RO forms (js/ro-crud.js L414 create, L491 edit) and the card banner is read-only - js/render.js L324 even titles it change it via Edit RO. Small: add an inline edit-in-place control at the tile bottom reusing the existing editField / notify path so it still fires urgent_update_notify (js/ro-crud.js L370). Follow-on to ER a7d1474e."},
 {id:"ac8265c8",by:"Lynn",date:"08-05",cat:"RO Fields",loe:"S",theme:"RO Fields & Status",
  desc:"Add mileage to the RO.",
  verdict:"NEW ER, valid and confirmed absent at HEAD 362137d: a case-insensitive grep for mileage / odometer across every *.js, *.html and *.sql in the repo returns zero hits, so the RO records rv / vin but never the unit's mileage. Small: one repair_orders.mileage column plus the New/Edit RO inputs (js/ro-crud.js create L409-415 / edit L486-491) and an optional card or key-info readout. Consider bundling with 3e746c18 and 972af03c as one RO-fields build."},
 {id:"9aab7550",by:"Brandon",date:"07-21",cat:"Messages",loe:"S",theme:"Messages UX",
  desc:"Highlight new messages that have not been checked yet so they are more clearly visible.",
  verdict:"Still only partial on messages.html v1.23 at HEAD 362137d. S166 added a MANUAL Mark-unread button (L708, markConversationUnread L1980), which helps, but the visual treatment is unchanged: a single 8px gold .unread-dot (CSS L469) applied at L1319 only when last_direction is inbound AND status is open (L1313), with no row-level highlight. Small: add a bold/tinted unread row treatment."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",cat:"Messages",loe:"S",theme:"Messages UX",
  desc:"Rescale the list of conversations so the text is easier to read.",
  verdict:"Confirmed still absent on messages.html v1.23 at HEAD 362137d: the page uses fixed rem font sizes with no user text-size control - grep for font-scale / fontScale / textSize across js, html and css returns zero hits. Small: add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",cat:"Messages",loe:"S",theme:"Messages UX",
  desc:"Add a small button to clear the name faster in the messaging search bar.",
  verdict:"Confirmed still absent on messages.html v1.23 at HEAD 362137d: convoSearch (L604) is a plain text input with no clear affordance, and the field is reset only programmatically (L1151, L1170). Small: add a clear (x) button that empties the messaging conversation search and re-runs the filter (input handler L2421)."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",cat:"Messages",loe:"S",theme:"Messages UX",
  desc:"Remove the redundant 'Added to every send' block at the bottom of every chat.",
  verdict:"Valid, still present on desktop at HEAD 362137d: js/messaging.js refreshSignaturePreview writes Added to every send: into #msgSigPreview (element L350, text L374) on both surfaces. messages.html hides it only inside the max-width 760px mobile media query (rule L565, query opens L552), so desktop messages.html and the RO-card composer still show it. Small: remove it or collapse it behind a toggle in all viewports; the signature itself keeps sending."},
 {id:"ca0f7ed9",by:"Brandon",date:"08-03",cat:"Messages",loe:"S",theme:"Messages UX",
  desc:"Auto-populate the lead info section in Messages when the customer is already in the dashboard.",
  verdict:"Confirmed still absent on messages.html v1.23 at HEAD 362137d: renderLeadInfo (L1389) reads ONLY the conversation's own columns (c.rv L1395, c.service_type L1396), so an existing dashboard customer shows No RV or service type captured yet. selectConversation computes the phone-matched live ROs as linked (L1727) for renderContactInfo (L1740) but calls renderLeadInfo(c) without them (L1744). S168/v1.23 improved the create-RO handoff, not this panel. Small: pass linked and fall back to the RO's rv / repair_type."},
 {id:"29654af7",by:"Lynn",date:"07-06",cat:"Navigation",loe:"S",theme:"Board & Navigation UX",
  desc:"A button that takes you back to the top of the page (and to the search bar) after scrolling to the bottom.",
  verdict:"Confirmed still absent at HEAD 362137d: grep for backToTop / back-to-top / scroll-to-top / scrollToTop across index.html, js and css returns nothing, and the board has only targeted scrollIntoView calls. Small: add a scroll-triggered back-to-top / jump-to-search control, ideally present in the sidebar layout too. Canonical for duplicate 2b78696c."},
 {id:"d1844e46",by:"Lynn",date:"07-16",cat:"Sorting",loe:"S",theme:"Board & Navigation UX",
  desc:"Sort the dash by promised date then oldest on lot, keeping PRVS Shop Operations pinned to the top.",
  verdict:"Confirmed still absent at HEAD 362137d: js/render.js renderBoard sorts on the single blended calculatePriority score (L30-39) with the shop-ops pin at L35-37, and grep for sortBy / sortSelect / sortMode finds nothing in index.html or js/render.js, so there is no selectable strict promised-date-then-oldest-on-lot order. Small: add the strict sort option while keeping the shop pin. Related to 1aeb3f58, which delivered only the promised-date chip."},
 {id:"d432863a",by:"Brandon",date:"07-21",cat:"Branding",loe:"S",theme:"Board & Navigation UX",
  desc:"Make the browser tab icon the Patriots logo so the dashboard stands out among open tabs.",
  verdict:"Confirmed still absent at HEAD 362137d: grep for favicon / rel=icon / apple-touch-icon across all repo *.html files returns zero hits, so every tab shows the generic browser icon. Small: add a Patriots-logo favicon plus apple-touch-icon to each page head (logo.png already ships in the repo but needs resizing to icon dimensions)."},
 {id:"2f752d40",by:"Jason",date:"07-21",cat:"Work Orders",loe:"S",theme:"Work Orders",
  desc:"Auto-populate the work-order dollar amount from total hours at the posted labor rate of $195/hr.",
  verdict:"Confirmed still absent at HEAD 362137d: js/work-orders.js has independent manual inputs woFormDollar (L360) and woFormEstHours (L365), read separately on save (L649-650), and grep for LABOR_RATE / laborRate / labor_rate in the module returns zero hits (js/insurance.js laborRate is the per-claim INSURANCE rate; solar.html's is the solar quote rate). Small: auto-populate dollar_value = effective hours x 195, respecting the dollarLocked gate (L324)."},
 {id:"e06d747e",by:"Riley",date:"04-10",cat:"Time Clock",loe:"S",theme:"Time Clock & Check-In",
  desc:"Tech check-in float for ease of access.",
  verdict:"Confirmed still absent at HEAD 362137d: no floating or sticky tech check-in control in index.html or checkin.html, and js/render.js compact-col-actions (L228-235) offers edit / parts / WO / notify / message / schedule only, with no check-in button. Underspecified: scope the target page and the exact behavior with the submitter. Pairs with 6bb61db2."},
 {id:"6bb61db2",by:"Riley",date:"07-22",cat:"Time Clock",loe:"S",theme:"Time Clock & Check-In",
  desc:"Check in / check out button at the bottom of the compact view, plus a live indicator of which unit you are clocked into.",
  verdict:"Confirmed still absent at HEAD 362137d: js/render.js compact-col-actions (L228-235) has edit / parts / WO / notify / message / schedule but no check-in-out button, and grep for clocked in / clocked into / activeTimeLog across index.html, js/render.js and js/time-tracking.js returns nothing. Small: add a compact check-in/out action plus a login-time active time_log banner shown across views. Pairs with e06d747e."},
 {id:"0448de62",by:"Sofia",date:"06-11",cat:"Auth form",loe:"L",theme:"Messaging & E-Sign",
  desc:"Send an authorization form remotely for e-signature.",
  verdict:"Confirmed still absent at HEAD 362137d: signing is kiosk-only (customer-checkin.html on-device signature pad) and the raf_copy branch of supabase/functions/send-quote-email (L386) only emails a copy after signing; grep for signing_token / remote_sign / signature_request / signing_link across js, supabase and the HTML pages returns nothing. Needs a tokenized public signing page, a delivery path and signed-form storage. Pairs naturally with the SMS channel."},
 {id:"ed1b873e",by:"Roland",date:"06-07",cat:"Auth/Cost",loe:"XL",theme:"Auth & Cost",
  desc:"Replace Google-email auth (about $25/mo each, nearing $500/mo total; most staff do not use the email) with database-specific auth.",
  verdict:"Confirmed still Google-based at HEAD 362137d: js/auth.js imports GOOGLE_CONFIG from js/config.js (L69), initialises gapi with it (L203-204) and signs in via google.accounts One Tap (promptOneTapWithReason L483, renderButton fallback L541) plus signInWithIdToken; the kiosk uses the same path. Swapping to Supabase password / magic-link or shared role accounts drops roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Scope with Roland."},
 {id:"47428f75",by:"Lynn",date:"08-03",cat:"Time Off",loe:"S",theme:"Time Off",
  desc:"Update the vacation / sick / personal calendar.",
  verdict:"UNDERSPECIFIED - no stated defect or target. time-off.html already has all three types (L270-272), a color-coded month calendar (cal-chip L138-142), stats tiles (L233-244), per-row Edit (L752 / editRequest L864, ER ee50d11c) and exact partial-day windows (modalStartTime L368, modalEndTime L372). Filed Needed rather than Done because the ask maps to no gap without Lynn's detail; if it restates ee50d11c it is already delivered. Scope with the submitter."},
];

const ORDER={XL:0,L:1,M:2,S:3};
let activeFilter="all", query="";

function renderStats(){
  const c={XL:0,L:0,M:0,S:0};
  ERS.forEach(e=>c[e.loe]++);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Open ERs (all Needed)</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--xl)">${c.XL}</div><div class="l">XL — new subsystem</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--l)">${c.L}</div><div class="l">L — multi-session</div></div>`+
    `<div class="stat"><div class="n" style="color:#7fb0ff">${c.M}</div><div class="l">M — ½–1 session</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--s)">${c.S}</div><div class="l">S — under 2h*</div></div>`;
}
function renderList(){
  const list=document.getElementById('list'); list.innerHTML="";
  const q=query.toLowerCase();
  const shown=ERS.filter(e=>{
    if(activeFilter!=="all"&&e.loe!==activeFilter) return false;
    if(q){const blob=(e.id+e.by+e.cat+e.desc+e.verdict+e.theme).toLowerCase(); if(!blob.includes(q)) return false;}
    return true;
  });
  const themes=[...new Set(shown.map(e=>e.theme))];
  themes.forEach(th=>{
    const h=document.createElement('div'); h.className="theme"; h.textContent=th; list.appendChild(h);
    shown.filter(e=>e.theme===th).sort((a,b)=>ORDER[a.loe]-ORDER[b.loe]).forEach(e=>{
      const d=document.createElement('div'); d.className="er b-"+e.loe;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p>
        <span class="tag t-${e.loe}">LOE ${e.loe}</span></div>
        <div class="meta">${e.id} · ${e.by} · ${e.date} · ${e.cat}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
  if(!shown.length) list.innerHTML='<div class="sub">No ERs match.</div>';
}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); activeFilter=p.dataset.f; renderList();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; renderList();});
renderStats(); renderList();
</script>
</body>
</html>
