<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS — Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
</style>
</head>
<body>
  <h1>PRVS — Enhancement Request Triage</h1>
  <div class="sub">2026-07-28 - headless nightly runner - vs index.html v1.483 / messages.html v1.16 - 22 open Needed ERs (also open, not shown here: 3 bugs, 1 data fix - see docs/ER_TRIAGE_2026-07-28.md)</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <input id="q" placeholder="Search ERs…">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 {id:"14f35f95",by:"Lynn",date:"04-09",cat:"Parts",loe:"XL",theme:"Parts & Inventory",
  desc:"In-house parts inventory: order a box of 25, use 5, remaining 20 go to stock - listed as available, priced, and searchable.",
  verdict:"Confirmed still absent on v1.483: grep for inventory / on_hand / in_stock / stock_qty across js, supabase/migrations and supabase/functions returns zero hits; parts remain per-RO line items only (js/parts.js). New subsystem: inventory table, receive/consume/adjust flows, searchable priced stock view, links from the parts-request path. Largest item on the board."},
 {id:"b19975d4",by:"Lynn",date:"04-09",cat:"Parts",loe:"L",theme:"Parts & Inventory",
  desc:"Track a part that needs to be returned to the supplier or warrantied by the supplier.",
  verdict:"Partial infra only: js/config.js PART_STATUSES (L200) includes 'Returned' and js/parts.js has a Return Deadline input (L226, read L343), but grep for rma / return_reason / supplier_credit finds no RMA number, return reason, supplier credit or reverse-direction flow. Equals GH#24 Shop Ops Phase 2. Canonical for declined dup 86bbaf50."},
 {id:"8d885331",by:"Lynn",date:"04-09",cat:"Parts",loe:"S",theme:"Parts & Inventory",
  desc:"Rework the field order on the parts-entry / ordering screen (move fields around).",
  verdict:"All fields exist and are unchanged: js/parts.js pf_supplier L181, pf_partName L190, pf_qty L200, pf_status L204, pf_serviceSilo L208, pf_returnDeadline L226. The ask is only to reorder them, which is quick once Lynn supplies the target layout or a mockup. BLOCKED on detail, not on effort."},
 {id:"ed1b873e",by:"Roland",date:"06-07",cat:"Auth/Cost",loe:"XL",theme:"Auth & cost",
  desc:"Replace Google-email auth (about $25/mo each, roughly $500/mo total; most staff never use the email) with database-specific auth.",
  verdict:"Confirmed still Google-based on v1.483: js/auth.js imports GOOGLE_CONFIG from js/config.js (L69), initialises gapi with it (L203-204) and signs in via google.accounts One Tap plus signInWithIdToken (L44-48); the check-in kiosk uses the same path. Swapping to Supabase password / magic-link or shared role accounts would drop roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Roland wants to scope this together."},
 {id:"5925fc01",by:"Lynn",date:"04-09",cat:"Notif/Digest",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Notify the right team on every RO update; daily comprehensive list of all in-progress jobs with to-dos scraped from status notes.",
  verdict:"PARTIAL, re-verified on v1.483. The daily in-progress digest half is served by supabase/functions/send-manager-report, and single-event notifies exist (service_added_notify js/work-orders.js L293, urgent_update_notify js/ro-crud.js L370). Still absent: notify-on-every-RO-update and to-do scraping from status notes. Anchor of the initiative; pairs with af14b3cb."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",cat:"Task-Tracking",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Per-customer task tracker with a daily reminder; each task stays on the list until marked complete.",
  verdict:"Confirmed still absent on v1.483: js/shop-tasks.js is a non-customer shop checklist with no ro_id / customer link and no reminder column, and grep for ro_tasks / customer_task / task_tracker across supabase/migrations and js returns nothing. Needs a per-RO tasks table, add/complete UI and a daily open-task reminder. Pairs with 5925fc01."},
 {id:"5fec3eca",by:"Sofia",date:"07-15",cat:"Notif/Email",loe:"S",theme:"Notifications & Task-Tracking",
  desc:"Show the customer's address on the emailed copy of the authorization form.",
  verdict:"Confirmed still absent on v1.483: the raf_copy branch of supabase/functions/send-quote-email (L386) destructures 14 fields at L387 with no customerAddress; the address appears only in the lead_staff_notify branch (L549, HTML L674, text L748). Small: add customerAddress to the raf_copy payload and both templates."},
 {id:"0448de62",by:"Sofia",date:"06-11",cat:"Auth form",loe:"L",theme:"Messaging & e-sign",
  desc:"Send an authorization form remotely for e-signature.",
  verdict:"Confirmed still absent on v1.483: signing is kiosk-only (customer-checkin.html on-device signature pad) and the raf_copy branch of send-quote-email (L386) only emails a copy after signing; grep for signing_token / esign / remote_sign across js and supabase returns nothing. Needs a tokenized public signing page, a delivery path and signed-form storage. Now pairs naturally with the Textly SMS channel."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",cat:"RO status",loe:"M",theme:"RO fields & status",
  desc:"Archive customers or units that only exist because we quoted them and never moved forward.",
  verdict:"Confirmed still absent on v1.483: the only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase L658, archived_at L692 into cashiered_child_archives); there is no archived / abandoned flag, status or board filter for quoted-but-never-progressed units. Needs a soft-archive flag, a board filter and an un-archive path. Pairs with 972af03c."},
 {id:"0e172b2c",by:"Sofia",date:"07-16",cat:"Dedupe",loe:"M",theme:"RO fields & status",
  desc:"Merge duplicate customer accounts created under different spellings (Hubert vs Huebert), with a verify-which-is-correct step.",
  verdict:"Partial: js/duplicates.js has an RO-level merge/delete engine (getBaseROId L35, findDuplicateGroups L40, openDuplicateManager L51, executeDupeMerge) but it groups strictly on the PRVS-XXXX-XXXX base RO id (L36, L44), so two ROs created under different spellings of the same customer are never detected. Needs name/phone account dedup plus a verify-which-is-correct merge step. The one-off cleanup for the reported case is 3f254929."},
 {id:"972af03c",by:"Lynn",date:"07-17",cat:"RO status",loe:"S",theme:"RO fields & status",
  desc:"Add a CANCELED status - keep the record, do not delete it, so the notes survive.",
  verdict:"Confirmed still absent on v1.483: js/config.js STATUS_PROGRESS_MAP (L151-164) and js/render.js ALL_STATUSES (L741-745) both end at Delivered/Cashed Out, and a case-insensitive grep for 'cancel' in those two files returns nothing. Small: add a Canceled status plus color/priority maps, exclude it from on-lot and queue counts, and keep the record for notes. Pairs with 5fbfa299."},
 {id:"50175fce",by:"Lynn",date:"07-27",cat:"RO fields",loe:"S",theme:"RO fields & status",
  desc:"NEW: move the urgent-update INPUT onto the tile itself (bottom) instead of only inside Edit RO.",
  verdict:"NEW, valid and confirmed absent on v1.483: urgent_update is writable only from the New/Edit RO forms (index.html textarea L6702, editUrgentUpdate L6169; js/ro-crud.js L414 create, L467/L491 edit) and the card banner is read-only - js/render.js L324 even titles it 'change it via Edit RO'. Small: add an inline edit-in-place control at the bottom of the tile reusing the existing editField / notify path so it still fires urgent_update_notify. Follow-on to delivered ER a7d1474e."},
 {id:"9aab7550",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX",
  desc:"Highlight new / unchecked messages more clearly in the conversation list.",
  verdict:"Partial, re-verified on messages.html v1.16: a small gold .unread-dot renders per conversation (CSS L303, markup L955) but only when last_direction is 'inbound' AND status is 'open' (L949), and there is no row-level highlight. Small: add a stronger unread treatment (bold row / tinted background) and widen the condition so a closed-then-reopened thread also flags."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX",
  desc:"Let the conversation list text be rescaled so it is easier to read.",
  verdict:"Confirmed still absent on messages.html v1.16: the page uses fixed rem font sizes with no user text-size control - grep for font-scale / fontScale / textSize / zoom returns nothing. Small: add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX",
  desc:"Add a small clear button to empty the name field in the messaging search bar faster.",
  verdict:"Confirmed still absent on messages.html v1.16: convoSearch (L438) is a plain text input with no clear affordance - it is reset only programmatically (L862, L880). Small: add a clear (x) button that empties the search and re-runs the filter (L919 filter read, L1889 input handler)."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX",
  desc:"Remove the redundant 'Added to every send' signature preview at the bottom of every chat.",
  verdict:"Valid, still present on desktop: js/messaging.js refreshSignaturePreview writes 'Added to every send:' into #msgSigPreview (L222, text set L246) on both surfaces. messages.html hides it only inside the max-width:760px mobile media query (L399), so desktop messages.html and the RO-card composer still show it. Small: remove it or collapse it behind a toggle in all viewports; the signature itself keeps sending."},
 {id:"29654af7",by:"Lynn",date:"07-06",cat:"Navigation",loe:"S",theme:"Board & Navigation UX",
  desc:"Button that jumps back to the top of the page / the search bar once you have scrolled to the bottom.",
  verdict:"Confirmed still absent on v1.483: grep for backToTop / back-to-top / window.scrollTo across index.html, js and css returns nothing - only targeted scrollIntoView calls exist. Small: add a scroll-triggered back-to-top / jump-to-search control, ideally present in the sidebar layout too (css/sidebar-layout.css). CANONICAL for new duplicate 2b78696c - Lynn re-raised the same ask on 07-27, which is a signal it is worth doing now."},
 {id:"d1844e46",by:"Lynn",date:"07-16",cat:"Board sort",loe:"S",theme:"Board & Navigation UX",
  desc:"Sort the dash by promised date then oldest on lot, keeping PRVS Shop Operations pinned to the top.",
  verdict:"Confirmed still absent on v1.483: js/render.js renderBoard sorts on the single blended calculatePriority score (L31-39) with the shop-ops pin at L35-37; grep for sortBy / sortSelect / sortMode returns nothing, so there is no selectable strict promised-date-then-oldest-on-lot order. Small: add the strict sort option while keeping the shop pin. Related to 1aeb3f58, which delivered only the promised-date chip."},
 {id:"d432863a",by:"Brandon",date:"07-21",cat:"Branding",loe:"S",theme:"Board & Navigation UX",
  desc:"Make the browser tab icon the Patriots logo so the dashboard stands out among open tabs.",
  verdict:"Confirmed still absent on v1.483: grep for favicon / rel=icon / apple-touch-icon across all repo HTML files returns nothing, so every tab shows the generic browser icon. Small: add a Patriots-logo favicon plus apple-touch-icon to each page head."},
 {id:"e06d747e",by:"Riley",date:"04-10",cat:"Time Clock",loe:"S",theme:"Time clock",
  desc:"Tech check-in 'float' for ease of access.",
  verdict:"Confirmed still absent on v1.483: no floating or sticky tech check-in control in index.html or checkin.html, and js/render.js compact-col-actions (L228-235) offers edit / parts / WO / notify / message / schedule only, with no check-in button. UNDERSPECIFIED: scope the target page and behavior with the submitter. Pairs with 6bb61db2."},
 {id:"6bb61db2",by:"Riley",date:"07-22",cat:"Time Clock",loe:"S",theme:"Time clock",
  desc:"Check-in / check-out button on the compact view, plus a live reminder at login of which unit you are clocked into.",
  verdict:"Confirmed still absent on v1.483: js/render.js compact-col-actions (L228-235) has edit / parts / WO / notify / message / schedule but no check-in-out button, and grep for a persistent 'clocked into' / active time_log indicator across index.html and js returns nothing. Small: add a compact check-in/out action plus a login-time active-time_log banner shown across views. Pairs with e06d747e."},
 {id:"2f752d40",by:"Jason",date:"07-21",cat:"Work Orders",loe:"S",theme:"Work Orders",
  desc:"Auto-populate the work-order dollar amount from total task hours at the posted $195/hr labor rate.",
  verdict:"Confirmed still absent on v1.483: js/work-orders.js has independent manual inputs woFormDollar (L360) and woFormEstHours (L365), read separately on save (L649-650), with no labor-rate arithmetic anywhere (grep for LABOR_RATE or 195 in the module returns nothing). Small: auto-populate dollar_value = effective hours x $195/hr (task est_hours rollup when present, else the WO-level figure), with an editable override that respects the existing dollarLocked readonly gate (L324)."},
];

const ORDER={XL:0,L:1,M:2,S:3};
let activeFilter="all", query="";

function renderStats(){
  const c={XL:0,L:0,M:0,S:0};
  ERS.forEach(e=>c[e.loe]++);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Open ERs (all Needed)</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--xl)">${c.XL}</div><div class="l">XL — new subsystem</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--l)">${c.L}</div><div class="l">L — multi-session</div></div>`+
    `<div class="stat"><div class="n" style="color:#7fb0ff">${c.M}</div><div class="l">M — ½–1 session</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--s)">${c.S}</div><div class="l">S — under 2h*</div></div>`;
}
function renderList(){
  const list=document.getElementById('list'); list.innerHTML="";
  const q=query.toLowerCase();
  const shown=ERS.filter(e=>{
    if(activeFilter!=="all"&&e.loe!==activeFilter) return false;
    if(q){const blob=(e.id+e.by+e.cat+e.desc+e.verdict+e.theme).toLowerCase(); if(!blob.includes(q)) return false;}
    return true;
  });
  const themes=[...new Set(shown.map(e=>e.theme))];
  themes.forEach(th=>{
    const h=document.createElement('div'); h.className="theme"; h.textContent=th; list.appendChild(h);
    shown.filter(e=>e.theme===th).sort((a,b)=>ORDER[a.loe]-ORDER[b.loe]).forEach(e=>{
      const d=document.createElement('div'); d.className="er b-"+e.loe;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p>
        <span class="tag t-${e.loe}">LOE ${e.loe}</span></div>
        <div class="meta">${e.id} · ${e.by} · ${e.date} · ${e.cat}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
  if(!shown.length) list.innerHTML='<div class="sub">No ERs match.</div>';
}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); activeFilter=p.dataset.f; renderList();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; renderList();});
renderStats(); renderList();
</script>
</body>
</html>
