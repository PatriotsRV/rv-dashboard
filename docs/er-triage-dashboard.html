<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS - Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e; --bug:#f43f5e; --data:#a78bfa; --dup:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
  .b-BUG{border-left-color:var(--bug)} .t-BUG{background:rgba(244,63,94,.18);color:var(--bug)}
  .b-DATA{border-left-color:var(--data)} .t-DATA{background:rgba(167,139,250,.18);color:var(--data)}
  .b-DUP{border-left-color:var(--dup)} .t-DUP{background:rgba(100,116,139,.22);color:#9fb2c8}
</style>
</head>
<body>
  <h1>PRVS - Enhancement Request Triage</h1>
  <div class="sub">2026-10-03 | nightly runner, incremental pass (1 new ER: 604225ae) | vs index.html v1.511 (HEAD 71fd5d6) | all 37 unreviewed ERs, grouped by theme | report: docs/ER_TRIAGE_2026-10-03.md</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="BUG">Bugs</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <span class="pill" data-f="DATA">Data</span>
    <span class="pill" data-f="DUP">Dup</span>
    <input id="q" placeholder="Search ERs...">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 // ---- PARTS ----
 {id:"604225ae",by:"Lynn",date:"10-02",loe:"M",theme:"1 | Parts",
  desc:"NEW: After submitting a parts request there is nothing trackable on the RO to see the open request.",
  verdict:"Prefer needed over done (partial infra). submitPartsRequest (js/parts.js L632-764) writes a ro_status note, a Sourcing parts row (skipped for estimate-only) and the chip, but no request record: chip opens manager-only openPartsStatusModal (L766-770, techs get a toast), openPartsRequestDetails (index.html L6061) has zero callers, note buried in RO Status. Build an Open Parts Requests list on the RO for all roles. Pairs with 1fe2707e/c15727a3."},
 {id:"1fe2707e",by:"Lynn",date:"09-16",loe:"M",theme:"1 | Parts",
  desc:"Estimate-only sourced parts need a requester 'approved' step that notifies the parts manager to order.",
  verdict:"No approval step between sourcing and ordered; parts_status CHECK lacks an approved value; setPartsStatus (js/parts.js) has no gate or notify. Migration + Approve action gated to requester + parts_manager notify."},
 {id:"c15727a3",by:"Lynn",date:"09-16",loe:"S",theme:"1 | Parts",
  desc:"Notify requester when parts status changes to Received.",
  verdict:"setPartsStatus notifies on no transition; only manual Parts-Ordered and ETA emails exist. Hook notify inside setPartsStatus to cover all 3 received paths; requires ro.requestedByEmail."},
 {id:"2af47890",by:"Brandon",date:"08-25",loe:"S",theme:"1 | Parts",
  desc:"Clicking Received stamps today's date as date received.",
  verdict:"DB trigger trg_stamp_date_received stamps; client markPartReceived never sets dateReceived so a later savePartForm edit can wipe it. Client fix."},
 {id:"1e434aff",by:"Brandon",date:"08-25",loe:"S",theme:"1 | Parts",
  desc:"Show the received date in the parts status list.",
  verdict:"Manage Parts table has no receipt-date column (js/parts.js renderPartsRows). Render dateReceived beside the Received tick; depends on 2af47890."},
 {id:"8d885331",by:"Lynn",date:"04-09",loe:"S",theme:"1 | Parts",
  desc:"Reorder the parts-entry form fields.",
  verdict:"Field reorder. BLOCKED on Lynn supplying the target layout, not on effort."},
 {id:"b19975d4",by:"Lynn",date:"04-09",loe:"L",theme:"1 | Parts",
  desc:"Parts returned to supplier / warrantied by supplier.",
  verdict:"Partial infra only ('Returned' status + return-deadline input); no RMA/reason/credit flow. Merge into GH#24 Phase 2 Parts Returns."},
 {id:"14f35f95",by:"Lynn",date:"04-09",loe:"XL",theme:"1 | Parts",
  desc:"Parts stock inventory (order 25, use 5, 20 searchable in-house).",
  verdict:"Parts are per-RO line items only. New subsystem: inventory table + receive/consume/adjust + search. Needs own spec + Roland go/no-go."},
 // ---- RO FIELDS/STATUS ----
 {id:"972af03c",by:"Lynn",date:"07-17",loe:"S",theme:"2 | RO fields/status - ship as ONE batch (both DB CHECK twins)",
  desc:"Add status CANCELED - keep record + notes, never delete.",
  verdict:"Absent. Canonical for Canceled (eb00a68d, 611589ba folded in). Exclude from on-lot and queue counts."},
 {id:"44419de9",by:"Lynn",date:"08-12",loe:"S",theme:"2 | RO fields/status - ship as ONE batch (both DB CHECK twins)",
  desc:"New statuses: Need Estimate / Awaiting Estimate / Estimate Declined / Job Declined-Close.",
  verdict:"None exist. Each status add hits hardcoded UI spots + BOTH CHECK constraints (repair_orders + cashiered)."},
 {id:"3e746c18",by:"Lynn",date:"08-03",loe:"S",theme:"2 | RO fields/status - ship as ONE batch (both DB CHECK twins)",
  desc:"Add status TOTALED OUT.",
  verdict:"Absent. Terminal value; build with Canceled."},
 {id:"b4db201b",by:"Lynn",date:"09-11",loe:"S",theme:"2 | RO fields/status - ship as ONE batch (both DB CHECK twins)",
  desc:"Status NO SHOW - close with no dollar amount and no review sent.",
  verdict:"Behavior exists via Closed - No Charge (no review fired); the No Show label is absent. Add with the status batch."},
 {id:"d1844e46",by:"Lynn",date:"07-16",loe:"S",theme:"2 | RO fields/status - ship as ONE batch (both DB CHECK twins)",
  desc:"Sort board by promised date then oldest-on-lot, Shop Ops pinned top.",
  verdict:"Board sorts on one blended calculatePriority score (js/render.js); no selectable sort mode. Add sort-mode control."},
 {id:"611589ba",by:"Lynn",date:"08-24",loe:"DUP",theme:"2 | RO fields/status - ship as ONE batch (both DB CHECK twins)",
  desc:"Need Closed and Canceled statuses.",
  verdict:"DUPLICATE of 972af03c (Canceled) + 44419de9 (Job Declined/Close). Recommend declined with pointer."},
 // ---- RO CARD DISPLAY & FIELDS ----
 {id:"929072dc",by:"Lynn",date:"09-09",loe:"S",theme:"3 | RO Card Display & Fields",
  desc:"Promised and drop dates closer to customer name, large bold.",
  verdict:"Key-dates row renders below badges/parts chips; hoist under .customer-name and raise size/weight. Superset of 6ff111e7."},
 {id:"6ff111e7",by:"Lynn",date:"08-27",loe:"S",theme:"3 | RO Card Display & Fields",
  desc:"Drop date font bigger and a more visible color.",
  verdict:"Drop chip still 0.72rem/700 (smallest key date). Ship with 929072dc."},
 {id:"5dc697e2",by:"Brandon",date:"09-15",loe:"S",theme:"3 | RO Card Display & Fields",
  desc:"Restore RO dollar totals on the front of the card.",
  verdict:"No regression: Condensed preset hides the $ chip (tileVisibility.dollarValue false). Show it by default."},
 {id:"5c3b14eb",by:"Brandon",date:"09-16",loe:"S",theme:"3 | RO Card Display & Fields",
  desc:"Click the dollar amount on the card to edit it directly.",
  verdict:"Chip is plain div; edits only via Edit RO. Caution: WO rollup clobbers manual edits. Pair with 5dc697e2."},
 {id:"154e15a3",by:"Bobby",date:"09-09",loe:"S",theme:"3 | RO Card Display & Fields",
  desc:"Recognize dashed phone numbers and auto-add dashes on input.",
  verdict:"Matching already digit-normalised; formatting absent. Add shared input mask."},
 {id:"a195e4ab",by:"Brandon",date:"08-20",loe:"M",theme:"3 | RO Card Display & Fields",
  desc:"Track checks received on an RO (multiple, with amounts/dates).",
  verdict:"Only single-value hybrid Customer Pay block. Needs a small payments-list design."},
 {id:"98a2f2f5",by:"Lynn",date:"09-14",loe:"M",theme:"3 | RO Card Display & Fields",
  desc:"Veteran parts discount checkbox near name/address, always visible.",
  verdict:"No veteran/discount feature. Boolean column + cashiered twin + archive fn + New/Edit checkbox + card chip. Ask Lynn if it must price parts."},
 // ---- NOTIFICATIONS & TASK-TRACKING ----
 {id:"a03677e6",by:"Brandon",date:"08-07",loe:"S",theme:"4 | Notifications & Task-Tracking",
  desc:"Move machine lines (NOTIFICATION SENT, replies) out of RO Status Updates.",
  verdict:"Machine lines write as ro_status notes. Roland reversed a similar retarget in v1.491 - confirm target first."},
 {id:"d7493a3c",by:"Brandon",date:"09-15",loe:"S",theme:"4 | Notifications & Task-Tracking",
  desc:"Remove NOTIFICATION SENT / Customer reply lines from RO Status Updates.",
  verdict:"Written by process-scheduled-notifications for inbound_message_notify. Suppress or retarget; twin of a03677e6."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",loe:"L",theme:"4 | Notifications & Task-Tracking",
  desc:"Per-RO TO-DO list w/ daily reminder; items persist until completed.",
  verdict:"Absent: shop_tasks has no ro_id. Needs per-RO tasks table + UI + reminder. ece91cba supplies the spec."},
 {id:"5925fc01",by:"Lynn",date:"04-09",loe:"L",theme:"4 | Notifications & Task-Tracking",
  desc:"Notify team on every RO update + daily digest with scraped to-dos.",
  verdict:"PARTIAL: digest ships as send-manager-report. Remainder overlaps af14b3cb - design together."},
 // ---- WORK ORDERS ----
 {id:"2f752d40",by:"Jason",date:"07-21",loe:"S",theme:"5 | Work Orders",
  desc:"WO dollar amount auto-populates from total hours x $195 labor rate.",
  verdict:"No LABOR_RATE constant; dollars/hours independent. Add constant + editable auto-fill."},
 {id:"4354157b",by:"Bobby",date:"09-14",loe:"M",theme:"5 | Work Orders",
  desc:"Add sublet line to service silo.",
  verdict:"'sublet' zero hits. Ask Bobby: vendor line on silo WO vs a 9th Sublet silo."},
 {id:"109c094f",by:"Bobby",date:"09-25",loe:"DUP",theme:"5 | Work Orders",
  desc:"Add a Sublet line in the service silo.",
  verdict:"DUPLICATE of 4354157b. Recommend declined with pointer."},
 // ---- CHECK-IN ----
 {id:"6bb61db2",by:"Riley",date:"07-22",loe:"S",theme:"6 | Check-In / Time Clock",
  desc:"Compact-view clock in/out button + clocked-in indicator at login.",
  verdict:"No compact check-in button or clocked-into indicator. CANONICAL (folds in e06d747e)."},
 {id:"e06d747e",by:"Riley",date:"04-10",loe:"S",theme:"6 | Check-In / Time Clock",
  desc:"Tech check-in float for ease of access.",
  verdict:"Underspecified; same ask as 6bb61db2 - build once."},
 // ---- SCHEDULING / FILTERS ----
 {id:"bb1b62f6",by:"Brandon",date:"09-22",loe:"S",theme:"7 | Scheduling/Dates & Board Filters",
  desc:"Days-on-lot filter for days UNDER a value.",
  verdict:"#daysOnLotFilter is >= only (js/render.js). Add max bound + reset in Clear Filters."},
 // ---- CUSTOMER MGMT ----
 {id:"0e172b2c",by:"Sofia",date:"07-16",loe:"M",theme:"8 | Customer / Account Management",
  desc:"Merge duplicate customer accounts created under different spellings.",
  verdict:"js/duplicates.js merges only same-base-RO-id groups. Needs similarity detection + verify-then-merge."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",loe:"M",theme:"8 | Customer / Account Management",
  desc:"Archive quote-only customers/units that never moved forward.",
  verdict:"Largely solved by Canceled status (972af03c); decide if soft-archive still needed."},
 // ---- RAF ----
 {id:"5fec3eca",by:"Sofia",date:"07-15",loe:"S",theme:"9 | RAF / E-Signature",
  desc:"Show customer address on the emailed RAF copy.",
  verdict:"raf_copy branch of send-quote-email lacks customerAddress. Edge-fn deploy."},
 {id:"0448de62",by:"Sofia",date:"06-11",loe:"L",theme:"9 | RAF / E-Signature",
  desc:"Send the authorization form remotely for e-signature.",
  verdict:"Kiosk-only signing. Needs tokenized signing page + delivery + storage."},
 // ---- STRATEGIC ----
 {id:"ed1b873e",by:"Roland",date:"06-07",loe:"XL",theme:"10 | Strategic / Needs Roland",
  desc:"Replace per-seat Google-email auth (~$500/mo) with database auth.",
  verdict:"Auth is Google-token end-to-end (js/auth.js). Dedicated design session."},
 {id:"47428f75",by:"Lynn",date:"08-03",loe:"S",theme:"10 | Strategic / Needs Roland",
  desc:"'Update vacation/sick/personal calendar' - underspecified.",
  verdict:"time-off.html already has all three types + calendar + edit. ASK LYNN what is wanted."}
];

const order = [...new Set(ERS.map(e=>e.theme))];
const counts = {BUG:0,S:0,M:0,L:0,XL:0,DATA:0,DUP:0};
ERS.forEach(e=>counts[e.loe]++);
document.getElementById('stats').innerHTML =
  `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Unreviewed ERs</div></div>
   <div class="stat"><div class="n" style="color:var(--bug)">${counts.BUG}</div><div class="l">Bugs</div></div>
   <div class="stat"><div class="n" style="color:var(--s)">${counts.S}</div><div class="l">Small</div></div>
   <div class="stat"><div class="n" style="color:var(--m)">${counts.M}</div><div class="l">Medium</div></div>
   <div class="stat"><div class="n" style="color:var(--l)">${counts.L}</div><div class="l">Large</div></div>
   <div class="stat"><div class="n" style="color:var(--xl)">${counts.XL}</div><div class="l">XL</div></div>
   <div class="stat"><div class="n" style="color:var(--data)">${counts.DATA+counts.DUP}</div><div class="l">Data / Dup</div></div>`;

let filter='all', q='';
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  order.forEach(theme=>{
    const items=ERS.filter(e=>e.theme===theme)
      .filter(e=>filter==='all'||e.loe===filter)
      .filter(e=>!q||JSON.stringify(e).toLowerCase().includes(q));
    if(!items.length) return;
    const h=document.createElement('div'); h.className='theme'; h.textContent=theme; list.appendChild(h);
    items.forEach(e=>{
      const d=document.createElement('div'); d.className=`er b-${e.loe}`;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p><span class="tag t-${e.loe}">${e.loe}</span></div>
        <div class="meta">${e.id} | ${e.by} | 2026-${e.date}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
}
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); filter=p.dataset.f; render();
});
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();render();};
render();
</script>
</body>
</html>
