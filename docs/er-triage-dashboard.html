<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS &mdash; Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
</style>
</head>
<body>
  <h1>PRVS &mdash; Enhancement Request Triage</h1>
  <div class="sub">2026-07-31 &middot; headless nightly run &middot; 87 of 88 ERs re-verified vs index.html v1.485 &middot; 22 open Needed ERs shown below (+ 2 confirmed Bugs: d4d0eeba scroll-to-RO, d94a418a reversed note lines)</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <input id="q" placeholder="Search ERs&hellip;">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 {id:"14f35f95",by:"Lynn",date:"04-09",cat:"Parts",loe:"XL",theme:"Parts & Inventory",
  desc:"In-house parts inventory: order a box of 25, use 5, remaining 20 go to stock - listed as available, priced, and searchable.",
  verdict:"Still absent on v1.485: grep for inventory / on_hand / in_stock / stock_qty across js, supabase/migrations and supabase/functions returns zero code hits. Parts remain per-RO line items only (js/parts.js). New subsystem: inventory table, receive/consume/adjust flows, a searchable priced stock view, and links from the parts-request path. Largest item on the board."},
 {id:"ed1b873e",by:"Roland",date:"06-07",cat:"Auth/Cost",loe:"XL",theme:"Auth & Cost",
  desc:"Replace Google-email auth (~$25/mo each, ~$500/mo total; most staff don't use the email) with database-specific auth.",
  verdict:"Still Google-based on v1.485: js/auth.js imports GOOGLE_CONFIG (L69), inits gapi with it (L203-204) and signs in via google.accounts One Tap (L483) plus signInWithIdToken (L593); the check-in kiosk shares the path. Security-critical swap - touches every page sign-in plus the email-keyed RBAC. Roland wants to scope this together."},
 {id:"5925fc01",by:"Lynn",date:"04-09",cat:"Notif/Digest",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Notify the right team on every RO update; daily comprehensive list of all in-progress jobs with to-dos scraped from status notes.",
  verdict:"PARTIAL on v1.485: the daily in-progress digest half ships as supabase/functions/send-manager-report, and single-event notifies exist (service_added_notify work-orders.js L293, urgent_update_notify). Still absent: notify-on-every-RO-update and to-do scraping from status notes - grep for ro_tasks / task_tracker / customer_task returns zero hits. Anchor of this theme; pairs with af14b3cb."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",cat:"Task-Tracking",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Per-customer task tracker with a daily reminder; each task stays on the list until marked complete.",
  verdict:"Still absent on v1.485: js/shop-tasks.js is a non-customer shop checklist with no ro_id / customer link and no reminder column, and grep for ro_tasks / customer_task / task_tracker across js and supabase/migrations returns zero hits. Needs a per-RO tasks table, an add/complete UI and a daily open-task reminder. Pairs with 5925fc01."},
 {id:"b19975d4",by:"Lynn",date:"04-09",cat:"Parts",loe:"L",theme:"Parts & Inventory",
  desc:"Track a part that needs to be returned to the supplier or warrantied by the supplier.",
  verdict:"Partial infra only on v1.485: js/config.js PART_STATUSES (L200) includes 'Returned' and js/parts.js has a Return Deadline input (pf_returnDeadline L226, read L343), but grep for rma / return_reason / supplier_credit returns zero hits - no RMA number, return reason, supplier credit or reverse-direction flow. Equals GH#24 Shop Ops Phase 2. Canonical for declined dup 86bbaf50."},
 {id:"0448de62",by:"Sofia",date:"06-11",cat:"Auth form",loe:"L",theme:"Messaging & e-sign",
  desc:"Send an authorization form remotely for e-signature.",
  verdict:"Still absent on v1.485: signing is kiosk-only (customer-checkin.html on-device signature pad) and the raf_copy branch of send-quote-email (L386) only emails a copy after signing; grep for signing_token / remote_sign / signature_request / signing_link returns nothing. Needs a tokenized public signing page, a delivery path and signed-form storage. Pairs with the Textly SMS channel."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",cat:"RO Lifecycle",loe:"M",theme:"RO Lifecycle & Status",
  desc:"Archive customers/units that only exist because we quoted them and never moved forward.",
  verdict:"Still absent on v1.485: the only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase L658, archived_at L692 into cashiered_child_archives); there is no archived / abandoned flag, status or board filter. Needs a soft-archive flag, a board filter and an un-archive path. The S161 lead path keeps FUTURE quotes on the Messages board, but existing quote-only ROs still need this. Pairs with 972af03c."},
 {id:"0e172b2c",by:"Sofia",date:"07-16",cat:"Data Integrity",loe:"M",theme:"Customer & RO Data Integrity",
  desc:"Merge duplicate customer accounts (Hubert / Huebert) after asking the customer to verify which is correct.",
  verdict:"Partial on v1.485: js/duplicates.js has an RO-level merge/delete engine (getBaseROId L35, findDuplicateGroups L40, executeDupeMerge) but groups strictly on the PRVS-XXXX-XXXX base RO id (regex L36, grouping L44-46), so two ROs under different spellings of one customer are never detected. Needs name/phone account dedup plus a verify-which-is-correct merge step. One-off cleanup is 3f254929."},
 {id:"8d885331",by:"Lynn",date:"04-09",cat:"Parts",loe:"S",theme:"Parts & Inventory",
  desc:"Rework the field order on the parts-entry / ordering screen (move fields around).",
  verdict:"Form exists and is unchanged on v1.485: js/parts.js pf_supplier L181, pf_partName L190, pf_qty L200, pf_status L204, pf_serviceSilo L208, pf_returnDeadline L226. The ask is only to reorder those fields - quick once Lynn supplies the target layout or a mockup. BLOCKED on detail, not on effort."},
 {id:"e06d747e",by:"solar",date:"04-10",cat:"Time Clock",loe:"S",theme:"Time Clock & Check-In",
  desc:"Tech check-in 'float' for ease of access.",
  verdict:"Still absent on v1.485: no floating or sticky tech check-in control in index.html or checkin.html, and js/render.js compact-col-actions (L228-235) offers edit / parts / WO / notify / message / schedule only. Underspecified - scope the target page and exact behavior with the submitter. Pairs with 6bb61db2."},
 {id:"6bb61db2",by:"Riley",date:"07-22",cat:"Time Clock",loe:"S",theme:"Time Clock & Check-In",
  desc:"Check in / check out button on the compact view, plus a live reminder at login of which unit you are clocked into.",
  verdict:"Still absent on v1.485: js/render.js compact-col-actions (L228-235) has edit / parts / WO / notify / message / schedule but no check-in-out button, and grep for a persistent 'clocked into' / activeTimeLog indicator across index.html and js returns nothing. Small: add a compact check-in/out action plus a login-time active-time_log banner shown across views. Pairs with e06d747e."},
 {id:"29654af7",by:"Lynn",date:"07-06",cat:"Navigation",loe:"S",theme:"Board & Navigation UX",
  desc:"Button that jumps back to the top of the page / the search bar after scrolling to the bottom.",
  verdict:"Still absent on v1.485: grep for backToTop / back-to-top / scroll-to-top / window.scrollTo finds nothing on the dashboard - the only window.scrollTo calls are closed-ros.html L765 and customer-checkin.html L1277, and the board has only targeted scrollIntoView. Small: add a scroll-triggered back-to-top / jump-to-search control, ideally in the sidebar layout too. Canonical for dup 2b78696c."},
 {id:"d1844e46",by:"Lynn",date:"07-16",cat:"Navigation",loe:"S",theme:"Board & Navigation UX",
  desc:"Sort the dashboard by promised date, then oldest on lot, keeping PRVS Shop Operations pinned to the top.",
  verdict:"Still absent on v1.485: js/render.js renderBoard sorts on the single blended calculatePriority score (L31-39) with the shop-ops pin at L35-37; grep for sortBy / sortSelect / sortMode finds only closed-ros.html and solar.html, never the main board. Small: add the strict sort option while keeping the shop pin. Related to 1aeb3f58, which delivered only the promised-date chip."},
 {id:"d432863a",by:"Brandon",date:"07-21",cat:"Polish",loe:"S",theme:"Board & Navigation UX",
  desc:"Make the browser tab icon the Patriots logo so the dashboard stands out among open tabs.",
  verdict:"Still absent on v1.485: grep for favicon / rel=icon / apple-touch-icon across all repo *.html files returns zero hits, so every tab shows the generic browser icon. Small: add a Patriots-logo favicon plus apple-touch-icon to each page head (logo.png already ships in the repo but needs resizing to icon dimensions)."},
 {id:"9aab7550",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX",
  desc:"Highlight new messages that have not yet been checked so they are clearly visible.",
  verdict:"Partial on messages.html v1.17: a small gold .unread-dot renders per conversation (CSS L334, markup L1095) but only when last_direction is 'inbound' AND status is 'open' (unresponded L1089), and there is no row-level highlight. Small: add a stronger unread treatment (bold row / tinted background) and widen the condition so a closed-then-reopened thread also flags."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX",
  desc:"Let the conversation list text be rescaled so it is easier to read.",
  verdict:"Still absent on messages.html v1.17: the page uses fixed rem font sizes with no user text-size control - grep for font-scale / fontScale / textSize across js, html and css returns zero hits. Small: add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX",
  desc:"Add a little button to clear the name faster in the messaging search bar.",
  verdict:"Still absent on messages.html v1.17: convoSearch (L469) is a plain text input with no clear affordance - it is reset only programmatically (L1001, L1020). Small: add a clear (x) button that empties the conversation search and re-runs the filter (L1059 filter read, L2144 input handler)."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX",
  desc:"Remove the redundant 'Added to every send' block at the bottom of every chat.",
  verdict:"Valid and STILL VISIBLE on desktop: js/messaging.js refreshSignaturePreview writes 'Added to every send:' into #msgSigPreview and sets display:block (element L222, text L246, show L247) on both surfaces. messages.html hides it only inside the max-width:760px mobile media query (rule L430, query L417-435), so desktop messages.html and the RO-card composer still show it. Small: remove it or collapse it behind a toggle in all viewports; the signature itself keeps sending."},
 {id:"2f752d40",by:"Jason",date:"07-21",cat:"Work Orders",loe:"S",theme:"Work Orders",
  desc:"Auto-populate the work-order dollar amount from the total hours at the posted $195/hr labor rate.",
  verdict:"Still absent on v1.485: js/work-orders.js has independent manual inputs woFormDollar (L360) and woFormEstHours (L365), read separately on save (L649-650), with no labor-rate arithmetic - grep for LABOR_RATE / laborRate / 195 in the module returns zero hits (index.html laborRate is the per-claim INSURANCE rate field, not the posted shop rate). Small: auto-populate dollar_value = effective hours x $195/hr, respecting the dollarLocked readonly gate (L324)."},
 {id:"972af03c",by:"Lynn",date:"07-17",cat:"RO Status",loe:"S",theme:"RO Lifecycle & Status",
  desc:"Add status CANCELED - keep the record rather than deleting it, so the notes survive.",
  verdict:"Still absent on v1.485: there is no Canceled / Cancelled RO status - js/config.js STATUS_PROGRESS_MAP (L151-164) and js/render.js ALL_STATUSES (L741-745) both end at Delivered/Cashed Out, and a case-insensitive grep for 'cancel' in js/config.js returns zero hits. Small: add a Canceled status plus color/priority maps, exclude it from the on-lot and queue counts, and keep the record for notes. Pairs with 5fbfa299."},
 {id:"50175fce",by:"Lynn",date:"07-27",cat:"RO fields",loe:"S",theme:"RO fields & status",
  desc:"Move the urgent-update INPUT to the bottom of the tile instead of burying it inside Edit RO.",
  verdict:"Confirmed absent on v1.485: urgent_update is writable only from the New/Edit RO forms (index.html textarea, editUrgentUpdate; js/ro-crud.js L414 create, L467/L491 edit, repopulate L1107) and the card banner is read-only - js/render.js L324 even titles it 'change it via Edit RO'. Small: add an inline edit-in-place control at the tile bottom reusing the existing editField / notify path so it still fires urgent_update_notify. Follow-on to ER a7d1474e."},
 {id:"5fec3eca",by:"Sofia",date:"07-15",cat:"Auth form",loe:"S",theme:"Check-in & Auth Form",
  desc:"Show the customer's address on the emailed copy of the authorization form.",
  verdict:"Still absent on v1.485: the raf_copy branch of supabase/functions/send-quote-email (L386) destructures to / cc / customerName / roId / signedDate / rv / services / workType / phone / customerType / serviceDesc / warrantyDesc / promisedDate / signatureDataUrl at L387 with no customerAddress; the address appears only in the lead_staff_notify branch (L549, HTML L674, text L748). Small: add customerAddress to the raf_copy payload and both templates."},
];

const ORDER={XL:0,L:1,M:2,S:3};
let activeFilter="all", query="";

function renderStats(){
  const c={XL:0,L:0,M:0,S:0};
  ERS.forEach(e=>c[e.loe]++);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Open ERs (all Needed)</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--xl)">${c.XL}</div><div class="l">XL &mdash; new subsystem</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--l)">${c.L}</div><div class="l">L &mdash; multi-session</div></div>`+
    `<div class="stat"><div class="n" style="color:#7fb0ff">${c.M}</div><div class="l">M &mdash; &frac12;&ndash;1 session</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--s)">${c.S}</div><div class="l">S &mdash; under 2h*</div></div>`;
}
function renderList(){
  const list=document.getElementById('list'); list.innerHTML="";
  const q=query.toLowerCase();
  const shown=ERS.filter(e=>{
    if(activeFilter!=="all"&&e.loe!==activeFilter) return false;
    if(q){const blob=(e.id+e.by+e.cat+e.desc+e.verdict+e.theme).toLowerCase(); if(!blob.includes(q)) return false;}
    return true;
  });
  const themes=[...new Set(shown.map(e=>e.theme))];
  themes.forEach(th=>{
    const h=document.createElement('div'); h.className="theme"; h.textContent=th; list.appendChild(h);
    shown.filter(e=>e.theme===th).sort((a,b)=>ORDER[a.loe]-ORDER[b.loe]).forEach(e=>{
      const d=document.createElement('div'); d.className="er b-"+e.loe;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p>
        <span class="tag t-${e.loe}">LOE ${e.loe}</span></div>
        <div class="meta">${e.id} &middot; ${e.by} &middot; ${e.date} &middot; ${e.cat}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
  if(!shown.length) list.innerHTML='<div class="sub">No ERs match.</div>';
}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); activeFilter=p.dataset.f; renderList();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; renderList();});
renderStats(); renderList();
</script>
</body>
</html>
