<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS — Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
</style>
</head>
<body>
  <h1>PRVS — Enhancement Request Triage</h1>
  <div class="sub">2026-07-27 | headless nightly run | 83 ERs re-verified vs index.html v1.483 (S159) | 23 open items below: 21 Needed + 2 Bugs (the stat tile label predates the bug rows) | plus 1 data-only fix, 3f254929 Huebert/Hubert, handled as SQL in the report</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <input id="q" placeholder="Search ERs…">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 {id:"9031e101",by:"Riley Scott",date:"07-21",cat:"BUG - Work List",loe:"S",theme:"Bugs - fix first (severity: small)",
  desc:"Tapping a unit in the Work List on an iPhone does not open the right unit.",
  verdict:"BUG, still present in v1.483. js/work-list.js L328 calls scrollToROInBoard (index.html L4079), which only scans already-rendered .ro-card / .ro-card-compact [data-ro-index] nodes and matches ro._supabaseId. If the RO is filtered off the board it falls through to a 'RO not visible' toast (L4094) instead of navigating. Severity small: navigation only, no data risk. Same root cause as d4d0eeba - fix both together: clear filters, re-render, then scroll and highlight."},
 {id:"d4d0eeba",by:"Brandon Dillon",date:"07-22",cat:"BUG - Navigation",loe:"S",theme:"Bugs - fix first (severity: small)",
  desc:"Clicking an RO in my list, or an RO link in Messages, does not track through to the unit.",
  verdict:"BUG, still present in v1.483, two entry points and one cause. Work-list path is the 9031e101 path above. Messages path: the ro-chip link is index.html?ro=&lt;ro_id&gt; and js/qr.js handleDeepLink (L198) returns silently when the RO is not in currentFilteredData (L207) or has no rendered card (L209-210). Severity small: navigation only, no data risk. One fix closes both ERs."},
 {id:"9aab7550",by:"Brandon Dillon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX (bundle these four)",
  desc:"Highlight new messages that have not been checked yet so they are clearly visible.",
  verdict:"PARTIAL. messages.html renders a small gold .unread-dot per conversation (CSS L260, markup L879) but only when last_direction is 'inbound' AND status is 'open' (L873), and there is no row-level highlight. Small: add a bold row / tinted background and widen the condition so a closed-then-reopened thread also flags."},
 {id:"21fc3a9d",by:"Brandon Dillon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX (bundle these four)",
  desc:"Rescale the conversation list so the text is easier to read.",
  verdict:"Confirmed still absent in v1.483: messages.html uses fixed rem font sizes with no user text-size control (grep font-scale / fontScale / textSize / zoom returns nothing). Small: add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon Dillon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX (bundle these four)",
  desc:"Add a small button to clear the name faster in the messaging search bar.",
  verdict:"Confirmed still absent in v1.483: messages.html convoSearch (L395) is a plain text input, reset only programmatically (L788, L806). Small: add a clear (x) button that empties the search and re-runs the filter (L845 filter, L1597 input handler)."},
 {id:"6e9ca4dc",by:"Brandon Dillon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging UX (bundle these four)",
  desc:"Drop the redundant 'Added to every send' strip at the bottom of every chat.",
  verdict:"Valid, still present on desktop. js/messaging.js refreshSignaturePreview (L241-246) writes it into #msgSigPreview (L222) on both surfaces; messages.html hides it ONLY inside the max-width:760px media query (L356), so desktop messages.html and the RO-card composer still show it. Small: remove it or collapse behind a toggle in all viewports - the signature keeps sending either way."},
 {id:"29654af7",by:"Lynn Titel-Shepard",date:"07-06",cat:"Board UX",loe:"S",theme:"Board UX & Navigation",
  desc:"Button that jumps back to the top of the page / the search bar after scrolling down.",
  verdict:"Confirmed still absent in v1.483: grep for backToTop / back-to-top / window.scrollTo across index.html, js/*.js and css/*.css returns nothing - only targeted scrollIntoView calls exist. Small: add a scroll-triggered back-to-top / jump-to-search control, ideally present in the sidebar layout too (css/sidebar-layout.css)."},
 {id:"d1844e46",by:"Lynn Titel-Shepard",date:"07-16",cat:"Board UX",loe:"S",theme:"Board UX & Navigation",
  desc:"Sort the dashboard by promised date then oldest on lot, keeping PRVS Shop Operations pinned to the top.",
  verdict:"Confirmed still absent in v1.483: js/render.js renderBoard sorts on the single blended calculatePriority score (L31-39) with the shop-ops pin already at L35-37; grep for sortBy / sortSelect / sortMode returns nothing, so no selectable strict order exists. Small: add the strict sort option while keeping the pin. Distinct from 1aeb3f58, which delivered only the promised-date chip."},
 {id:"d432863a",by:"Brandon Dillon",date:"07-21",cat:"Board UX",loe:"S",theme:"Board UX & Navigation",
  desc:"Make the browser tab icon the Patriots logo so the dashboard stands out among open tabs.",
  verdict:"Confirmed still absent in v1.483: grep for favicon / rel=icon / apple-touch-icon across all 13 *.html files returns nothing, so every tab shows the generic browser icon. Small: add a Patriots-logo favicon plus apple-touch-icon to each page head."},
 {id:"5fbfa299",by:"Brandon Dillon",date:"06-30",cat:"Record lifecycle",loe:"M",theme:"Record Lifecycle & Cleanup (design as one)",
  desc:"Archive customers or units that were only quoted and never moved forward.",
  verdict:"Confirmed still absent in v1.483: the only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase L658, archived_at L692 into cashiered_child_archives). There is no archived / abandoned flag, status or board filter for quoted-but-never-progressed units. Needs a soft-archive flag, a board filter and an un-archive path. Pairs with 972af03c."},
 {id:"0e172b2c",by:"Sofia Pedroza",date:"07-16",cat:"Record lifecycle",loe:"M",theme:"Record Lifecycle & Cleanup (design as one)",
  desc:"Merge duplicate customer accounts created by a misspelled name (Hubert / Huebert), with customer verification.",
  verdict:"PARTIAL. js/duplicates.js has an RO-level merge/delete engine (getBaseROId L35, findDuplicateGroups L40, openDuplicateManager L51, executeDupeMerge L150) but it groups strictly on the PRVS-XXXX-XXXX base RO id (L36, L44), so two ROs under different spellings of one customer are never detected. Needs name/phone account dedup plus a verify-which-is-correct merge step. The one-off cleanup for this case is the data ER 3f254929."},
 {id:"972af03c",by:"Lynn Titel-Shepard",date:"07-17",cat:"Record lifecycle",loe:"S",theme:"Record Lifecycle & Cleanup (design as one)",
  desc:"Add a Canceled status that keeps the record and its notes instead of deleting it.",
  verdict:"Confirmed still absent in v1.483: no Canceled / Cancelled RO status - js/config.js STATUS_PROGRESS_MAP (L151-164) and js/render.js ALL_STATUSES (L741-745) both end at Delivered/Cashed Out. Small: add the status plus color/priority maps and exclude it from the on-lot and queue counts. Pairs with 5fbfa299."},
 {id:"e06d747e",by:"Riley Scott",date:"04-10",cat:"Time Clock",loe:"S",theme:"Time Clock & Check-In (scope with submitter)",
  desc:"Tech check-in 'float' for ease of access.",
  verdict:"Confirmed still absent in v1.483: no floating or sticky tech check-in control in index.html or checkin.html, and js/render.js compact-col-actions (L228-235) offers edit / parts / WO / notify / message / schedule only. UNDERSPECIFIED - scope the target page and behavior with the submitter. Pairs with 6bb61db2, which is the same person asking more concretely."},
 {id:"6bb61db2",by:"Riley Scott",date:"07-22",cat:"Time Clock",loe:"S",theme:"Time Clock & Check-In (scope with submitter)",
  desc:"Check-in / check-out button on the compact view, plus a live reminder at login of which unit you are clocked into.",
  verdict:"Confirmed still absent in v1.483: js/render.js compact-col-actions (L228-235) has no check-in-out button, and grep for a persistent 'clocked into' / active time_log indicator across index.html and js/*.js returns nothing. Small: add a compact check-in/out action plus a login-time active-time_log banner shown across all views. Pairs with e06d747e."},
 {id:"2f752d40",by:"Jason Rubin",date:"07-21",cat:"Work Orders",loe:"S",theme:"Work Orders",
  desc:"Auto-populate the work-order dollar amount from total hours at the posted $195/hr labor rate.",
  verdict:"Confirmed still absent in v1.483: js/work-orders.js has independent manual inputs woFormDollar (L360) and woFormEstHours (L365), read separately on save (L649-650), with no labor-rate arithmetic anywhere (no LABOR_RATE or 195 constant). Small: set dollar_value = effective hours x $195 (task est_hours rollup when present, else the WO-level figure), with an editable override that respects the existing dollarLocked readonly gate (L324)."},
 {id:"5fec3eca",by:"Sofia Pedroza",date:"07-15",cat:"Auth form",loe:"S",theme:"Authorization Form & E-Sign",
  desc:"Show the customer's address on the emailed copy of the authorization form.",
  verdict:"Confirmed still absent in v1.483: the raf_copy branch of supabase/functions/send-quote-email (L386) destructures to / cc / customerName / roId / signedDate / rv / services / workType / phone / customerType / serviceDesc / warrantyDesc / promisedDate / signatureDataUrl at L387 with no customerAddress. The address is emitted only by the lead_staff_notify branch (L549, HTML L674, text L748). Small: add customerAddress to the raf_copy payload plus both templates."},
 {id:"0448de62",by:"Sofia Pedroza",date:"06-11",cat:"Auth form",loe:"L",theme:"Authorization Form & E-Sign",
  desc:"Send an authorization form remotely for e-signature.",
  verdict:"Confirmed still absent in v1.483: signing is kiosk-only (customer-checkin.html on-device signature pad) and raf_copy only emails a copy after signing; grep for signing_token / esign / remote_sign across js/ and supabase/ returns nothing. Needs a tokenized public signing page, a delivery path and signed-form storage. Now pairs naturally with the Textly SMS channel."},
 {id:"5925fc01",by:"Lynn Titel-Shepard",date:"04-09",cat:"Notif/Digest",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Notify the right team on every RO update; daily comprehensive list of all in-progress jobs with to-dos scraped from status notes.",
  verdict:"PARTIAL, re-verified v1.483. The daily in-progress digest is served by supabase/functions/send-manager-report, and single-event notifies exist (service_added_notify in js/work-orders.js L293, urgent_update_notify). Still absent: notify-on-every-RO-update, and to-do scraping from status notes - no scrape/todo logic in js/*.js or the report function. Anchor of this theme; pairs with af14b3cb."},
 {id:"af14b3cb",by:"Lynn Titel-Shepard",date:"05-21",cat:"Task-Tracking",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Per-customer task tracker with a daily reminder; each task stays on the list until marked complete.",
  verdict:"Confirmed still absent in v1.483: js/shop-tasks.js is a non-customer shop checklist with no ro_id / customer link and no reminder column, and grep for ro_tasks / customer_task / task_tracker across supabase/migrations returns nothing. Needs a per-RO tasks table, add/complete UI and a daily open-task reminder. Pairs with 5925fc01."},
 {id:"8d885331",by:"Lynn Titel-Shepard",date:"04-09",cat:"Parts",loe:"S",theme:"Parts & Inventory",
  desc:"Rework the field order on the parts-entry / ordering screen (move fields around).",
  verdict:"Parts-entry form exists and is unchanged: js/parts.js pf_supplier L181, pf_partName L190, pf_qty L200, pf_status L204, pf_serviceSilo L208, pf_returnDeadline L226. The ask is only to reorder those fields, which is quick once Lynn supplies the target layout or a mockup. BLOCKED on detail, not on effort."},
 {id:"b19975d4",by:"Lynn Titel-Shepard",date:"04-09",cat:"Parts",loe:"L",theme:"Parts & Inventory",
  desc:"Track a part that needs to be returned to the supplier or warrantied by the supplier.",
  verdict:"Partial infra only, re-verified: js/config.js PART_STATUSES (L200) includes 'Returned' and js/parts.js has a Return Deadline input (pf_returnDeadline L226), but there is no RMA number, return reason, supplier credit or reverse-direction flow anywhere in js/ or supabase/. Equals GH#24 Shop Ops Phase 2. Canonical for the declined duplicate 86bbaf50."},
 {id:"14f35f95",by:"Lynn Titel-Shepard",date:"04-09",cat:"Parts",loe:"XL",theme:"Parts & Inventory",
  desc:"In-house parts inventory: order a box of 25, use 5, remaining 20 go to searchable priced stock.",
  verdict:"Confirmed still absent in v1.483: grep for inventory / on_hand / in_stock / stock_qty across js/ and supabase/migrations returns zero hits; parts remain per-RO line items only (js/parts.js). New subsystem: inventory table, receive/consume/adjust flows, a searchable priced stock view and links from the parts-request path. Largest item on the board."},
 {id:"ed1b873e",by:"Roland Shepard Jr",date:"06-07",cat:"Auth/Cost",loe:"XL",theme:"Auth & Cost",
  desc:"Replace Google-email auth (roughly $500/mo in seats most staff never use) with database-specific auth.",
  verdict:"Confirmed still Google-based in v1.483: js/auth.js imports GOOGLE_CONFIG from js/config.js (L69) and signs in via google.accounts One Tap plus signInWithIdToken (GROUP D, L44-48); the check-in kiosk uses the same path. Swapping to Supabase password / magic-link or shared role accounts would drop roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Roland wants to scope this together."},
];

const ORDER={XL:0,L:1,M:2,S:3};
let activeFilter="all", query="";

function renderStats(){
  const c={XL:0,L:0,M:0,S:0};
  ERS.forEach(e=>c[e.loe]++);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Open ERs (all Needed)</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--xl)">${c.XL}</div><div class="l">XL — new subsystem</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--l)">${c.L}</div><div class="l">L — multi-session</div></div>`+
    `<div class="stat"><div class="n" style="color:#7fb0ff">${c.M}</div><div class="l">M — ½–1 session</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--s)">${c.S}</div><div class="l">S — under 2h*</div></div>`;
}
function renderList(){
  const list=document.getElementById('list'); list.innerHTML="";
  const q=query.toLowerCase();
  const shown=ERS.filter(e=>{
    if(activeFilter!=="all"&&e.loe!==activeFilter) return false;
    if(q){const blob=(e.id+e.by+e.cat+e.desc+e.verdict+e.theme).toLowerCase(); if(!blob.includes(q)) return false;}
    return true;
  });
  const themes=[...new Set(shown.map(e=>e.theme))];
  themes.forEach(th=>{
    const h=document.createElement('div'); h.className="theme"; h.textContent=th; list.appendChild(h);
    shown.filter(e=>e.theme===th).sort((a,b)=>ORDER[a.loe]-ORDER[b.loe]).forEach(e=>{
      const d=document.createElement('div'); d.className="er b-"+e.loe;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p>
        <span class="tag t-${e.loe}">LOE ${e.loe}</span></div>
        <div class="meta">${e.id} · ${e.by} · ${e.date} · ${e.cat}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
  if(!shown.length) list.innerHTML='<div class="sub">No ERs match.</div>';
}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); activeFilter=p.dataset.f; renderList();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; renderList();});
renderStats(); renderList();
</script>
</body>
</html>
