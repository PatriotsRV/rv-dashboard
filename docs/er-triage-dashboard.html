<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS — Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e; --bug:#f43f5e; --data:#a78bfa; --dup:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
  .b-BUG{border-left-color:var(--bug)} .t-BUG{background:rgba(244,63,94,.18);color:var(--bug)}
  .b-DATA{border-left-color:var(--data)} .t-DATA{background:rgba(167,139,250,.18);color:var(--data)}
  .b-DUP{border-left-color:var(--dup)} .t-DUP{background:rgba(100,116,139,.22);color:#9fb2c8}
</style>
</head>
<body>
  <h1>PRVS — Enhancement Request Triage</h1>
  <div class="sub">2026-08-26 | headless nightly runner, incremental (full_pass=false) | vs index.html v1.501 (HEAD 9c50b52) | 28 open ERs; 2 classified this run (2af47890, 1e434aff), 26 carried | ZERO open bugs | report: docs/ER_TRIAGE_2026-08-26.md</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="BUG">Bugs</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <span class="pill" data-f="DATA">Data</span>
    <span class="pill" data-f="DUP">Dup</span>
    <input id="q" placeholder="Search ERs…">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 // ---- GROUP 1: RO FIELDS & STATUS ----
 {id:"44419de9",by:"Lynn",date:"08-12",loe:"S",theme:"1 - RO Fields & Status (status batch: BOTH DB CHECK twins, S172 lesson)",
  desc:"New statuses: Need Estimate / Awaiting Estimate / Estimate Declined / Job Declined-Close.",
  verdict:"None of the 4 exist. Each status add hits ~9 hardcoded UI spots PLUS both CHECK constraints (repair_orders + cashiered) or saves throw 23514. Overlaps 972af03c CANCELED - confirm scope with Lynn. CARRIED verdict, not re-verified this run; note v1.501 added a 16th status Closed - No Charge."},
 {id:"972af03c",by:"Lynn",date:"07-17",loe:"S",theme:"1 - RO Fields & Status (status batch: BOTH DB CHECK twins, S172 lesson)",
  desc:"Add status CANCELED - keep record + notes, never delete.",
  verdict:"Absent. Add the status plus color/priority maps; exclude from on-lot and queue counts. Canonical for declined dups eb00a68d and 611589ba. CARRIED verdict, not re-verified this run."},
 {id:"3e746c18",by:"Lynn",date:"08-03",loe:"S",theme:"1 - RO Fields & Status (status batch: BOTH DB CHECK twins, S172 lesson)",
  desc:"Add status TOTALED OUT.",
  verdict:"Absent. Distinct terminal value from Canceled; build both together and exclude both from the queue/on-lot counts. CARRIED verdict - CHECK THIS ONE: v1.501 shipped Closed - No Charge, whose own code comment names totaled-out insurance claims as the use case."},
 {id:"0e172b2c",by:"Sofia",date:"07-16",loe:"M",theme:"1 - RO Fields & Status (status batch: BOTH DB CHECK twins, S172 lesson)",
  desc:"Merge duplicate customer accounts created under different spellings.",
  verdict:"js/duplicates.js merges only same-base-RO-id groups (regex L36); different spellings are never detected. Needs name/phone-similarity detection plus a verify-then-merge step. The one-off Hubert cleanup was 3f254929, done in S178."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",loe:"M",theme:"1 - RO Fields & Status (status batch: BOTH DB CHECK twins, S172 lesson)",
  desc:"Archive quote-only customers/units that never moved forward.",
  verdict:"The only archive path is the cashiered one; no soft-archive flag, status or board filter. Largely absorbed by the Canceled status - decide whether a board filter / un-archive path is still wanted on top."},
 {id:"a195e4ab",by:"Brandon",date:"08-20",loe:"M",theme:"1 - RO Fields & Status (status batch: BOTH DB CHECK twins, S172 lesson)",
  desc:"Track checks received on an RO (multiple, with amounts and dates).",
  verdict:"Zero check tracking: check_number / checkNumber / payments = 0 hits. Only capture is the one-value hybrid Customer Pay block (index.html L7203-7246), method Check but no check number, saved flat into insurance_data JSONB and never on the card. Needs a per-RO checks table plus add/list UI plus a cashiered mirror."},
 // ---- GROUP 2: NOTIFICATIONS & TASK-TRACKING ----
 {id:"a03677e6",by:"Brandon",date:"08-07",loe:"S",theme:"2 - Notifications & Task-Tracking",
  desc:"Move machine lines (NOTIFICATION SENT, replies, scheduled) out of RO Status Updates.",
  verdict:"Machine audit lines write as notes type ro_status and crowd the box (js/ro-crud.js L316/L358/L393/L545/L602; js/parts.js L654/L855). customer_comm renders separately. CAUTION: Roland reversed exactly this retarget for LEAD NOTES in v1.491 - confirm the target stream with him first. Canonical for declined dup 2deb8f30."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",loe:"L",theme:"2 - Notifications & Task-Tracking",
  desc:"Per-RO TO-DO list with a daily reminder; items persist until completed.",
  verdict:"Absent: shop_tasks has no ro_id, and ro_tasks / task_tracker / customer_task greps = 0. Needs a per-RO tasks table plus add/complete UI plus a daily open-task reminder. Declined dup ece91cba supplies the concrete spec (bulleted, anyone adds or checks, notate who and when)."},
 {id:"5925fc01",by:"Lynn",date:"04-09",loe:"L",theme:"2 - Notifications & Task-Tracking",
  desc:"Notify team on every RO update + daily digest with scraped to-dos.",
  verdict:"PARTIAL: the daily digest half ships as send-manager-report (extended again in v2.5-S183 with the lot-wide UNWATCHED ROs section) and single-event notifies exist. Remaining halves - per-update notify and to-do scraping - overlap the af14b3cb task tracker. Design together."},
 // ---- GROUP 3: PARTS & INVENTORY ----
 {id:"2af47890",by:"Brandon",date:"08-25",loe:"S",theme:"3 - Parts & Inventory (2 NEW this run - ship both together)",
  desc:"NEW: clicking Received on a part should set the date received to that moment.",
  verdict:"CLASSIFIED THIS RUN. Half-delivered, filed needed not done per the prefer-needed rail. The DB half ships: trigger trg_stamp_date_received (stamp_date_received_on_parts.sql L33-36) stamps date_received to the Chicago-local day on any transition INTO Received. The CLIENT half is missing: js/parts.js markPartReceived (L449-478) sets part.status only, never part.dateReceived, so the in-memory row stays blank after the modal reopen (L473) - and if staff then edit that part, showAddPartForm reloads the blank (L308-311), savePartForm reads it blank (L353) and updatePartInSupabase resends date_received null (L539), which the trigger deliberately will NOT restamp because OLD.status is already Received (migration L34). The receipt date is WIPED. Fix is 1-2 lines in markPartReceived."},
 {id:"1e434aff",by:"Brandon",date:"08-25",loe:"S",theme:"3 - Parts & Inventory (2 NEW this run - ship both together)",
  desc:"NEW: show the received date on the parts status list once a part is marked received.",
  verdict:"CLASSIFIED THIS RUN. Confirmed absent at HEAD 9c50b52. The Manage Parts table has nine columns - Part Name, Part #, Supplier, Status, Qty, Wholesale, Retail, Quick, Actions (js/parts.js L259-267) - and renderPartsRows (L121-145) never prints p.dateReceived. Once a part is Received the Quick cell collapses to a bare tick (L136) with no date. The value is editable only inside the collapsed Add/Edit Part form (pf_dateReceived L242). Small: render dateReceived beside the tick. Build WITH 2af47890 - otherwise the column renders blank for parts received via the quick button."},
 {id:"8d885331",by:"Lynn",date:"04-09",loe:"S",theme:"3 - Parts & Inventory (2 NEW this run - ship both together)",
  desc:"Reorder the parts-entry form fields.",
  verdict:"Form exists and is unchanged (pf_supplier L181, pf_partName L190, pf_serviceSilo L208, pf_returnDeadline L226). The ask is only a field reorder. BLOCKED on Lynn supplying the target layout or a mockup, not on effort."},
 {id:"b19975d4",by:"Lynn",date:"04-09",loe:"L",theme:"3 - Parts & Inventory (2 NEW this run - ship both together)",
  desc:"Parts returned to supplier / warrantied by supplier.",
  verdict:"Partial infra only: a Returned status (js/config.js PART_STATUSES L200) and a Return Deadline input (js/parts.js L226); rma / return_reason / supplier_credit = 0 hits. No RMA number, reason, supplier credit or reverse flow. Equals GH#24 Shop Ops Phase 2 - merge into that build. Canonical for declined dup 86bbaf50."},
 {id:"14f35f95",by:"Lynn",date:"04-09",loe:"XL",theme:"3 - Parts & Inventory (2 NEW this run - ship both together)",
  desc:"Parts stock inventory (order 25, use 5, 20 searchable in-house).",
  verdict:"inventory / on_hand / in_stock / stock_qty = 0 hits repo-wide; parts are per-RO line items only. New subsystem: inventory table, receive/consume/adjust flows, a searchable priced stock view, and links from the parts-request path. Largest item on the board - needs its own spec plus a Roland go/no-go."},
 // ---- GROUP 4: MESSAGING & E-SIGN ----
 {id:"9aab7550",by:"Brandon",date:"07-21",loe:"S",theme:"4 - Messaging & E-sign (one messages release for the six S items)",
  desc:"Make unread conversations much more visible.",
  verdict:"Still only an 8px gold dot, applied when last_direction is inbound AND status is open (messages.html L1313/L1319, CSS L469). S166 added a MANUAL Mark-unread button (L1980) but no row-level highlight. Add a bold/tinted unread row treatment."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",loe:"S",theme:"4 - Messaging & E-sign (one messages release for the six S items)",
  desc:"Rescale conversation-list text for readability.",
  verdict:"Fixed rem sizes with no user control; font-scale / fontScale / textSize = 0 hits. Add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",loe:"S",theme:"4 - Messaging & E-sign (one messages release for the six S items)",
  desc:"Clear (x) button in the conversation search.",
  verdict:"convoSearch (messages.html L604) is a plain input, reset only programmatically (L1151/L1170). Add a clear button that empties it and re-runs the filter."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",loe:"S",theme:"4 - Messaging & E-sign (one messages release for the six S items)",
  desc:"Remove the redundant 'Added to every send' signature preview.",
  verdict:"js/messaging.js refreshSignaturePreview (L369) writes it into #msgSigPreview (L350/L374); messages.html hides it only inside the mobile media query (L565), so desktop and the RO-card composer still show it. Kill or collapse it in all viewports; the signature itself keeps sending."},
 {id:"ca0f7ed9",by:"Brandon",date:"08-03",loe:"S",theme:"4 - Messaging & E-sign (one messages release for the six S items)",
  desc:"Auto-populate lead info from the dashboard when the customer already exists.",
  verdict:"renderLeadInfo (messages.html L1389) reads ONLY the conversation's own columns, so an existing dashboard customer shows 'No RV or service type captured yet'. selectConversation already computes phone-matched linked ROs for renderContactInfo but calls renderLeadInfo(c) without them (L1744). Pass linked, fall back to RO rv."},
 {id:"5fec3eca",by:"Sofia",date:"07-15",loe:"S",theme:"4 - Messaging & E-sign (one messages release for the six S items)",
  desc:"Show the customer address on the emailed RAF copy.",
  verdict:"The raf_copy branch of send-quote-email (L387) has no customerAddress in the payload or the template; the address appears only in the lead_staff_notify branch. Edge-function deploy, no dashboard release."},
 {id:"0448de62",by:"Sofia",date:"06-11",loe:"L",theme:"4 - Messaging & E-sign (one messages release for the six S items)",
  desc:"Send the authorization form remotely for e-signature.",
  verdict:"Signing is kiosk-only (customer-checkin.html on-device pad); signing_token / remote_sign / signature_request / signing_link = 0 hits. Needs a tokenized public signing page, a delivery path and signed-form storage. Pairs with the S166 short-link machinery."},
 // ---- GROUP 5: BOARD & NAVIGATION UX ----
 {id:"d1844e46",by:"Lynn",date:"07-16",loe:"S",theme:"5 - Board & Navigation UX",
  desc:"Sort board by promised date then oldest-on-lot, Shop Ops pinned top.",
  verdict:"The board sorts on one blended calculatePriority score (js/render.js L30-39, shop pin L35-37); sortBy / sortSelect / sortMode = 0 hits, so no selectable sort mode exists. Add the strict sort option while keeping the shop pin. Related to 1aeb3f58, which delivered only the promised-date chip."},
 // ---- GROUP 6: TIME CLOCK & CHECK-IN ----
 {id:"6bb61db2",by:"Riley",date:"07-22",loe:"S",theme:"6 - Time Clock & Check-In (build once)",
  desc:"Compact-view clock in/out button + clocked-in indicator at login (all layouts).",
  verdict:"js/render.js compact-col-actions (L228-235) has edit / parts / WO / notify / message / schedule but no check-in-out button, and 'clocked in' / activeTimeLog = 0 hits. CANONICAL spec for this theme - folds in e06d747e."},
 {id:"e06d747e",by:"Riley",date:"04-10",loe:"S",theme:"6 - Time Clock & Check-In (build once)",
  desc:"Tech check-in float for ease of access.",
  verdict:"No floating or sticky tech check-in control in index.html or checkin.html. Underspecified - almost certainly the same ask as 6bb61db2. Fold in and build once."},
 // ---- GROUP 7: WORK ORDERS & SHOP TASKS ----
 {id:"2f752d40",by:"Jason",date:"07-21",loe:"S",theme:"7 - Work Orders & Shop Tasks",
  desc:"WO dollar amount auto-populates from total hours x $195 labor rate.",
  verdict:"woFormDollar (js/work-orders.js L360) and woFormEstHours (L365) are independent manual inputs read separately on save (L649-650); LABOR_RATE / laborRate / labor_rate = 0 hits in the module (js/insurance.js laborRate L212 is the per-claim INSURANCE rate). Auto-populate dollar_value = effective hours x $195/hr, respecting the dollarLocked gate (L324)."},
 // ---- GROUP 8: SCHEDULING & DATES ----
 {id:"47428f75",by:"Lynn",date:"08-03",loe:"S",theme:"8 - Scheduling & Dates (blocked on submitter detail)",
  desc:"'Update vacation/sick/personal calendar' - underspecified.",
  verdict:"UNDERSPECIFIED - no stated defect or target. time-off.html already has all three types, a color-coded month calendar, stats tiles, per-row Edit (L752) and exact partial-day windows (L368/L372). Filed needed not done because the ask maps to no gap without Lynn's detail; if it restates ee50d11c it is already delivered. ASK LYNN."},
 // ---- GROUP 9: AUTH & COST ----
 {id:"ed1b873e",by:"Roland",date:"06-07",loe:"XL",theme:"9 - Auth & Cost (needs Roland)",
  desc:"Replace per-seat Google-email auth (~$500/mo) with database auth.",
  verdict:"Still Google-token end to end: js/auth.js imports GOOGLE_CONFIG (L69), initialises gapi (L203-204) and signs in via One Tap plus signInWithIdToken; the kiosk uses the same path. A Supabase password / magic-link swap touches every page sign-in plus the email-keyed RBAC. Dedicated design session."},
 // ---- GROUP 10: DUPLICATE STILL UNREVIEWED ----
 {id:"611589ba",by:"Lynn",date:"08-24",loe:"DUP",theme:"10 - Duplicate to decline",
  desc:"Need statuses Closed and Canceled in the drop-down.",
  verdict:"DUPLICATE - both halves are already open ERs: CANCELED is 972af03c, Closed is 44419de9's JOB DECLINED/CLOSE. Adds no new work item. Still unreviewed - recommend declined. BUT ask Lynn first: v1.501 shipped the terminal status 'Closed - No Charge' after this verdict was written, and that may already be her 'Closed'."}
];

const order = [...new Set(ERS.map(e=>e.theme))];
const counts = {BUG:0,S:0,M:0,L:0,XL:0,DATA:0,DUP:0};
ERS.forEach(e=>counts[e.loe]++);
document.getElementById('stats').innerHTML =
  `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Unreviewed ERs</div></div>
   <div class="stat"><div class="n" style="color:var(--bug)">${counts.BUG}</div><div class="l">Bugs</div></div>
   <div class="stat"><div class="n" style="color:var(--s)">${counts.S}</div><div class="l">Small</div></div>
   <div class="stat"><div class="n" style="color:var(--m)">${counts.M}</div><div class="l">Medium</div></div>
   <div class="stat"><div class="n" style="color:var(--l)">${counts.L}</div><div class="l">Large</div></div>
   <div class="stat"><div class="n" style="color:var(--xl)">${counts.XL}</div><div class="l">XL</div></div>
   <div class="stat"><div class="n" style="color:var(--data)">${counts.DATA+counts.DUP}</div><div class="l">Data / Dup</div></div>`;

let filter='all', q='';
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  order.forEach(theme=>{
    const items=ERS.filter(e=>e.theme===theme)
      .filter(e=>filter==='all'||e.loe===filter)
      .filter(e=>!q||JSON.stringify(e).toLowerCase().includes(q));
    if(!items.length) return;
    const h=document.createElement('div'); h.className='theme'; h.textContent=theme; list.appendChild(h);
    items.forEach(e=>{
      const d=document.createElement('div'); d.className=`er b-${e.loe}`;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p><span class="tag t-${e.loe}">${e.loe}</span></div>
        <div class="meta">${e.id} · ${e.by} · 2026-${e.date}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
}
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); filter=p.dataset.f; render();
});
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();render();};
render();
</script>
</body>
</html>
