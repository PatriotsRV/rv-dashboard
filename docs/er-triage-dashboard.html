<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS — Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
</style>
</head>
<body>
  <h1>PRVS — Enhancement Request Triage</h1>
  <div class="sub">2026-08-03 &middot; headless nightly runner &middot; 87 of 88 ERs re-verified vs HEAD 7e8fadc / index.html v1.487 &middot; 26 open work items: 23 Needed + 2 Bugs + 1 Data (bugs and data sized S)</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <input id="q" placeholder="Search ERs…">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 {id:"d4d0eeba",by:"Brandon",date:"07-22",cat:"BUG - navigation (small)",loe:"S",theme:"Bugs - fix first",
  desc:"Clicking an RO in the work list, or a link in Messages, never takes you to the right board entry.",
  verdict:"CONFIRMED still present at HEAD 7e8fadc (v1.487). Two paths, one root cause. Work list: scrollToROInBoard (index.html L4162) only matches already-rendered [data-ro-index] cards, else toasts 'RO not visible' (L4177) whose Clear Filters action re-renders but never then scrolls. Messages: js/qr.js handleDeepLink (L198) returns silently when the RO is not in currentFilteredData (L207) or has no card (L210). Canonical for duplicates 9031e101 and 1bc33dd6 - ONE fix retires three ERs. Fix: clear filters, re-render, scroll, highlight."},
 {id:"d94a418a",by:"Brandon",date:"07-27",cat:"BUG - data-display",loe:"S",theme:"Bugs - fix first",
  desc:"RO STATUS / Customer Comm text is not shown as typed - the latter portion of a long note appears at the top.",
  verdict:"CONFIRMED at HEAD 7e8fadc (v1.487); render only, no data loss. js/render.js L553 builds the card RO Status box via split(newline) + map(escapeHtml) + reverse(), reversing EVERY line, so a multi-line note renders bottom-line-first - exactly the reported symptom. L563 does the same to Customer Comm. Entry boundaries are already lost upstream (js/ro-crud.js joins entries with a newline). Fix: reuse the S159 history-modal entry-regex split for both boxes."},
 {id:"0448de62",by:"Sofia",date:"06-11",cat:"Auth form",loe:"L",theme:"Messaging & e-sign",
  desc:"Send an authorization form remotely for e-signature.",
  verdict:"Confirmed still absent at HEAD 7e8fadc (v1.487): signing is kiosk-only (customer-checkin.html on-device signature pad) and the raf_copy branch of send-quote-email (L386) only emails a copy after signing; grep for signing_token / remote_sign / signature_request returns nothing. Needs a tokenized public signing page, a delivery path and signed-form storage. Pairs naturally with the SMS channel."},
 {id:"1c7f1410",by:"Andrew Page",date:"07-16",cat:"Messaging",loe:"S",theme:"Messaging & e-sign",
  desc:"Messaging has no way to attach media such as photos or videos.",
  verdict:"The photo/PDF half shipped (S151b/S158) but the VIDEO half did not. On messages.html v1.17, js/messaging.js input#msgAttach accepts only image/*,application/pdf (L219), _handleAttachPick branches solely on isPdf and otherwise runs _compressImage (L314), and grep for 'video' across js/messaging.js and messages.html returns zero hits. Small: add video/* accept, skip compression, keep the 5MB MMS cap."},
 {id:"9aab7550",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & e-sign",
  desc:"Highlight new messages that have not been checked yet so they are clearly visible.",
  verdict:"Partial on messages.html v1.17: a small gold .unread-dot renders per conversation (CSS L334, applied L1095) but only when last_direction is 'inbound' AND status is 'open' (L1089), and there is no row-level highlight. Small: add a stronger unread treatment (bold row / tinted background) and widen the condition so a closed-then-reopened thread also flags."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & e-sign",
  desc:"Rescale the conversation list so the text is easier to read.",
  verdict:"Confirmed still absent on messages.html v1.17: the page uses fixed rem font sizes with no user text-size control - grep for font-scale / fontScale / textSize across js, html and css returns zero hits. Small: add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & e-sign",
  desc:"Add a button to clear the name from the messaging search bar faster.",
  verdict:"Confirmed still absent on messages.html v1.17: convoSearch (L469) is a plain text input with no clear affordance - the only sibling control is the New-conversation button (L470) and the field is reset only programmatically (L1001, L1020). Small: add a clear (x) button that empties the search and re-runs the filter."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & e-sign",
  desc:"Remove the redundant 'Added to every send' line at the bottom of every chat.",
  verdict:"Valid and still present on DESKTOP: js/messaging.js refreshSignaturePreview (L241) writes 'Added to every send:' into #msgSigPreview and shows it (element L222, text L246). messages.html hides it only inside the max-width:760px mobile media query (rule L430, query opens L417), so desktop messages.html and the RO-card composer still show it. Small: remove it or collapse it behind a toggle in all viewports; the signature itself keeps sending."},
 {id:"14f35f95",by:"Lynn",date:"04-09",cat:"Parts",loe:"XL",theme:"Parts & Inventory",
  desc:"In-house parts inventory: order a box of 25, use 5, remaining 20 go to stock - available, priced, and searchable.",
  verdict:"Confirmed still absent at HEAD 7e8fadc (v1.487): grep for inventory / on_hand / in_stock / stock_qty across js, supabase/migrations and supabase/functions returns zero code hits (docs only). Parts remain per-RO line items only (js/parts.js). New subsystem: inventory table, receive/consume/adjust flows, a searchable priced stock view, links from the parts-request path. Largest item on the board."},
 {id:"b19975d4",by:"Lynn",date:"04-09",cat:"Parts",loe:"L",theme:"Parts & Inventory",
  desc:"Track a part that needs to be returned to the supplier or warrantied by the supplier.",
  verdict:"Partial infra only at HEAD 7e8fadc: js/config.js PART_STATUSES (L200) includes 'Returned' and js/parts.js has a Return Deadline input (pf_returnDeadline L226), but a word-boundary grep for rma / return_reason / supplier_credit across js and supabase returns zero hits - no RMA number, return reason, supplier credit or reverse-direction flow. Equals GH#24 Shop Ops Phase 2. Canonical for declined duplicate 86bbaf50."},
 {id:"8d885331",by:"Lynn",date:"04-09",cat:"Parts",loe:"S",theme:"Parts & Inventory",
  desc:"Rework the field order on the parts-entry / ordering screen (move fields around).",
  verdict:"Parts-entry form exists and is unchanged at HEAD 7e8fadc: js/parts.js pf_supplier L181, pf_partName L190, pf_qty L200, pf_status L204, pf_serviceSilo L208, pf_returnDeadline L226. The ask is only to reorder those fields, which is quick once Lynn supplies the target layout or a mockup. BLOCKED on detail, not on effort."},
 {id:"5925fc01",by:"Lynn",date:"04-09",cat:"Notif/Digest",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Notify the right team on every RO update; daily list of all in-progress jobs with to-dos scraped from status notes.",
  verdict:"PARTIAL at HEAD 7e8fadc. The daily in-progress digest half ships as supabase/functions/send-manager-report, and single-event notifies exist (service_added_notify js/work-orders.js L293; urgent_update_notify js/ro-crud.js L370). Still absent: notify-on-every-RO-update and to-do scraping from status notes - grep for ro_tasks / task_tracker / customer_task returns zero hits. Anchor of this theme; pairs with af14b3cb."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",cat:"Task-Tracking",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Per-customer task tracker with a daily reminder; each task stays on the list until marked complete.",
  verdict:"Confirmed still absent at HEAD 7e8fadc: js/shop-tasks.js is a non-customer shop checklist with no ro_id / customer link and no reminder column, and grep for ro_tasks / customer_task / task_tracker across js and supabase returns zero hits. Needs a per-RO tasks table, an add/complete UI and a daily open-task reminder. Pairs with 5925fc01."},
 {id:"5fec3eca",by:"Sofia",date:"07-15",cat:"Notif/Email",loe:"S",theme:"Notifications & Task-Tracking",
  desc:"Show the customer's address on the emailed copy of the authorization form.",
  verdict:"Confirmed still absent at HEAD 7e8fadc: the raf_copy branch of send-quote-email (L386-387) destructures to / cc / customerName / roId / signedDate / rv / services / workType / phone / customerType / serviceDesc / warrantyDesc / promisedDate / signatureDataUrl with no customerAddress; the address appears only in the lead_staff_notify branch (L549, HTML L674, text L748). Small: add customerAddress to the raf_copy payload and both templates."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",cat:"RO fields/status",loe:"M",theme:"RO fields/status",
  desc:"Archive customers or units that only exist because we quoted them and never moved forward.",
  verdict:"Confirmed still absent at HEAD 7e8fadc: the only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase L658, archived_at L692 into cashiered_child_archives); a case-insensitive grep for archived / abandoned in js/render.js and js/config.js returns zero hits, so there is no soft-archive flag, status or board filter. Needs a flag, a board filter and an un-archive path. Pairs with 972af03c."},
 {id:"972af03c",by:"Lynn",date:"07-17",cat:"RO fields/status",loe:"S",theme:"RO fields/status",
  desc:"Add status CANCELED - keep, do not delete the record, so the notes survive.",
  verdict:"Confirmed still absent at HEAD 7e8fadc: there is no Canceled / Cancelled RO status - js/config.js STATUS_PROGRESS_MAP (L151-163) and js/render.js ALL_STATUSES (L741-745) plus statusColorMap (L727-739) all end at Delivered/Cashed Out, and a case-insensitive grep returns zero hits. Small: add a Canceled status plus color/priority maps, exclude it from the on-lot and queue counts, keep the record for notes. Pairs with 5fbfa299."},
 {id:"50175fce",by:"Lynn",date:"07-27",cat:"RO fields/status",loe:"S",theme:"RO fields/status",
  desc:"Move the urgent-update INPUT to the bottom of the tile instead of burying it inside Edit RO.",
  verdict:"Valid and confirmed absent at HEAD 7e8fadc: urgent_update is writable only from the New/Edit RO forms (js/ro-crud.js L414 create, L491 edit, repopulate L1107) and the card banner is read-only - js/render.js L324 even titles it 'change it via Edit RO'. Small: add an inline edit-in-place control at the tile bottom reusing the existing editField / notify path so it still fires urgent_update_notify (js/ro-crud.js L370). Follow-on to ER a7d1474e."},
 {id:"29654af7",by:"Lynn",date:"07-06",cat:"Board nav",loe:"S",theme:"Board & Navigation UX",
  desc:"Button that jumps back to the top of the page / the search bar after scrolling to a tile at the bottom.",
  verdict:"Confirmed still absent at HEAD 7e8fadc: grep for backToTop / back-to-top / scroll-to-top / scrollToTop across index.html, js and css returns nothing, and the only window.scrollTo calls in the repo are in closed-ros.html and customer-checkin.html; the board has only targeted scrollIntoView calls. Small: add a scroll-triggered back-to-top / jump-to-search control, ideally present in the sidebar layout too. Canonical for duplicate 2b78696c."},
 {id:"d1844e46",by:"Lynn",date:"07-16",cat:"Board nav",loe:"S",theme:"Board & Navigation UX",
  desc:"Sort the dashboard by promised date then oldest on lot, keeping PRVS Shop Operations pinned to the top.",
  verdict:"Confirmed still absent at HEAD 7e8fadc: js/render.js renderBoard sorts on the single blended calculatePriority score (L30-39) with the shop-ops pin at L35-37; grep for sortBy / sortSelect / sortMode finds only closed-ros.html and solar.html, never the main board, so there is no selectable strict promised-date-then-oldest-on-lot order. Small: add the strict sort option while keeping the shop pin. Related to 1aeb3f58, which delivered only the promised-date chip."},
 {id:"d432863a",by:"Brandon",date:"07-21",cat:"Board nav",loe:"S",theme:"Board & Navigation UX",
  desc:"Make the browser tab icon the Patriots logo so the dashboard stands out among open tabs.",
  verdict:"Confirmed still absent at HEAD 7e8fadc: grep for favicon / rel=icon / apple-touch-icon across all repo *.html files returns zero hits, so every tab shows the generic browser icon. Small: add a Patriots-logo favicon plus apple-touch-icon to each page head (logo.png already ships in the repo but needs resizing to icon dimensions). Cheapest win on the board."},
 {id:"e06d747e",by:"Riley Scott",date:"04-10",cat:"Time Clock",loe:"S",theme:"Time clock",
  desc:"Tech check-in 'float' for ease of access.",
  verdict:"Confirmed still absent at HEAD 7e8fadc: no floating or sticky tech check-in control in index.html or checkin.html, and js/render.js compact-col-actions (L228-235) offers edit / parts / WO / notify / message / schedule only, with no check-in button. UNDERSPECIFIED: scope the target page and the exact behavior with the submitter. Pairs with 6bb61db2."},
 {id:"6bb61db2",by:"Riley Scott",date:"07-22",cat:"Time Clock",loe:"S",theme:"Time clock",
  desc:"Check-in/out button in the compact view, plus a live reminder on login of which unit you are clocked into.",
  verdict:"Confirmed still absent at HEAD 7e8fadc: js/render.js compact-col-actions (L228-235) has edit / parts / WO / notify / message / schedule but no check-in-out button, and grep for 'clocked in' / 'clocked into' / activeTimeLog across index.html, js/render.js and js/time-tracking.js returns nothing. Small: add a compact check-in/out action plus a login-time active-time_log banner shown across views. Pairs with e06d747e."},
 {id:"2f752d40",by:"Jason Rubin",date:"07-21",cat:"Work Orders",loe:"S",theme:"Work Orders & Shop tasks",
  desc:"Auto-populate the work-order dollar amount from total hours at the posted $195/hr labor rate.",
  verdict:"Confirmed still absent at HEAD 7e8fadc: js/work-orders.js has independent manual inputs woFormDollar (L360) and woFormEstHours (L365), read separately on save (L649-650), and grep for LABOR_RATE / laborRate / labor_rate in the module returns zero hits (js/insurance.js laborRate is the per-claim INSURANCE rate, solar.html's is the solar quote rate). Small: auto-populate dollar_value = effective hours x $195/hr, respecting the dollarLocked readonly gate (L324)."},
 {id:"0e172b2c",by:"Sofia",date:"07-16",cat:"Data integrity",loe:"M",theme:"Duplicates & Data Integrity",
  desc:"Merge accounts created under different spellings of the same customer (Hubert / Huebert), asking the customer to verify.",
  verdict:"Partial at HEAD 7e8fadc: js/duplicates.js has an RO-level merge/delete engine (getBaseROId L35, findDuplicateGroups L40, executeDupeMerge L150) but it groups strictly on the PRVS-XXXX-XXXX base RO id (regex L36, grouping L44-46), so two ROs created under different spellings of the same customer are never detected. Needs name/phone account dedup plus a verify-which-is-correct merge step. The one-off cleanup for this case is 3f254929."},
 {id:"3f254929",by:"Sofia",date:"07-16",cat:"DATA - SQL for Roland",loe:"S",theme:"Duplicates & Data Integrity",
  desc:"Correction: the customer is Steve HUEBERT; delete the misspelled Hubert account.",
  verdict:"DATA bucket - data correction, no code change: keep Steve Huebert and remove the misspelled Hubert RO. SQL for Roland to run after eyeballing the rows: SELECT id,ro_id,customer_name,status FROM repair_orders WHERE customer_name ILIKE '%ubert%'; then, once the wrong id is confirmed, UPDATE repair_orders SET deleted_at=now() WHERE id='&lt;wrong-id&gt;'; Nothing was executed by this runner. The merge feature itself is tracked as 0e172b2c."},
 {id:"ed1b873e",by:"Roland",date:"06-07",cat:"Auth/Cost",loe:"XL",theme:"Auth & cost",
  desc:"Replace Google-email auth (~$25/mo each, ~$500/mo total; most staff don't use the email) with database-specific auth.",
  verdict:"Confirmed still Google-based at HEAD 7e8fadc (v1.487): js/auth.js imports GOOGLE_CONFIG from js/config.js (L69), initialises gapi with it (L203-204) and signs in via google.accounts One Tap (initialize L978, v1.486 renderButton fallback L541, promptOneTapWithReason L566) plus signInWithIdToken; the kiosk uses the same path. Swapping to Supabase password / magic-link or shared role accounts drops roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Scope with Roland."},
];

const ORDER={XL:0,L:1,M:2,S:3};
let activeFilter="all", query="";

function renderStats(){
  const c={XL:0,L:0,M:0,S:0};
  ERS.forEach(e=>c[e.loe]++);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Open ERs (all Needed)</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--xl)">${c.XL}</div><div class="l">XL — new subsystem</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--l)">${c.L}</div><div class="l">L — multi-session</div></div>`+
    `<div class="stat"><div class="n" style="color:#7fb0ff">${c.M}</div><div class="l">M — ½–1 session</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--s)">${c.S}</div><div class="l">S — under 2h*</div></div>`;
}
function renderList(){
  const list=document.getElementById('list'); list.innerHTML="";
  const q=query.toLowerCase();
  const shown=ERS.filter(e=>{
    if(activeFilter!=="all"&&e.loe!==activeFilter) return false;
    if(q){const blob=(e.id+e.by+e.cat+e.desc+e.verdict+e.theme).toLowerCase(); if(!blob.includes(q)) return false;}
    return true;
  });
  const themes=[...new Set(shown.map(e=>e.theme))];
  themes.forEach(th=>{
    const h=document.createElement('div'); h.className="theme"; h.textContent=th; list.appendChild(h);
    shown.filter(e=>e.theme===th).sort((a,b)=>ORDER[a.loe]-ORDER[b.loe]).forEach(e=>{
      const d=document.createElement('div'); d.className="er b-"+e.loe;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p>
        <span class="tag t-${e.loe}">LOE ${e.loe}</span></div>
        <div class="meta">${e.id} · ${e.by} · ${e.date} · ${e.cat}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
  if(!shown.length) list.innerHTML='<div class="sub">No ERs match.</div>';
}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); activeFilter=p.dataset.f; renderList();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; renderList();});
renderStats(); renderList();
</script>
</body>
</html>
