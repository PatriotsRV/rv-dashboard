<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS — Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e; --bug:#f43f5e; --data:#a78bfa; --dup:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
  .b-BUG{border-left-color:var(--bug)} .t-BUG{background:rgba(244,63,94,.18);color:var(--bug)}
  .b-DATA{border-left-color:var(--data)} .t-DATA{background:rgba(167,139,250,.18);color:var(--data)}
  .b-DUP{border-left-color:var(--dup)} .t-DUP{background:rgba(100,116,139,.22);color:#9fb2c8}
</style>
</head>
<body>
  <h1>PRVS — Enhancement Request Triage</h1>
  <div class="sub">2026-09-03 | headless runner, incremental pass | vs index.html v1.502 + messages v1.24 (HEAD 505e22b) | all 31 unreviewed ERs, grouped by function then LOE/risk | 0 bugs open | report: docs/ER_TRIAGE_2026-09-03.md</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="BUG">Bugs</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <span class="pill" data-f="DATA">Data</span>
    <span class="pill" data-f="DUP">Dup</span>
    <input id="q" placeholder="Search ERs…">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 // ---- GROUP 0: MESSAGING COMPOSER + POLISH (one release) ----
 {id:"776384e7",by:"Andrew",date:"09-01",loe:"S",theme:"0 - Messaging: composer + polish (one messages release)",
  desc:"NEW: quick responses / canned replies in the message board, e.g. 'Vroom parts deposit'.",
  verdict:"Classified this run. Absent at HEAD 505e22b (messages v1.24): composer extras are attach / emoji / signature only (js/messaging.js composerExtrasHtml L341-351, initComposerExtras L491-509). quick_replies / canned / message_templates / sms_templates grep repo-wide hits only a dormant comment in supabase/migrations/sms_schema.sql L11 ('comes in Stage 3'). Small: snippet picker in composerExtrasHtml, which is the shared implementation for messages.html L671-673 AND the RO-card modal. Ask Andrew for the starter list; hardcoded = S, staff-editable table = M."},
 {id:"472ccadb",by:"Andrew",date:"08-28",loe:"S",theme:"0 - Messaging: composer + polish (one messages release)",
  desc:"Drag a thumbnail straight into the conversation to send it.",
  verdict:"Composer has only a hidden file input plus paperclip click (js/messaging.js msgAttach L347, initComposerExtras L491-494); _handleAttachPick reads ev.target.files (L422). dragover / drop / dataTransfer.files hit only the work-list and WO row-reorder code. Small: a drop zone feeding the same upload path. Ask Andrew whether the thumbnail is an OS file or an in-app photo (that variant is M)."},
 {id:"ca0f7ed9",by:"Brandon",date:"08-03",loe:"S",theme:"0 - Messaging: composer + polish (one messages release)",
  desc:"Auto-populate lead info from the dashboard when the customer already exists.",
  verdict:"renderLeadInfo (messages.html L1389) reads only the conversation's own columns (c.rv, c.service_type), so an existing customer shows 'No RV or service type captured yet'. selectConversation already computes phone-matched live ROs as 'linked' but calls renderLeadInfo(c) without them (L1744). Small: pass linked, fall back to RO rv."},
 {id:"9aab7550",by:"Brandon",date:"07-21",loe:"S",theme:"0 - Messaging: composer + polish (one messages release)",
  desc:"Make unread conversations much more visible.",
  verdict:"S166's manual 'Mark unread' button (markConversationUnread L1980) helps, but the treatment is still a single 8px gold .unread-dot (CSS L469) shown only when last_direction is inbound AND status is open (L1313, L1319), with no row-level highlight. Add a bold/tinted unread row."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",loe:"S",theme:"0 - Messaging: composer + polish (one messages release)",
  desc:"Rescale conversation-list text for readability.",
  verdict:"Fixed rem sizing with no user text-size control anywhere on the page; font-scale / fontScale / textSize grep across js, html and css returns zero hits. Add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",loe:"S",theme:"0 - Messaging: composer + polish (one messages release)",
  desc:"Clear (x) button in the conversation search.",
  verdict:"convoSearch (L604) is a plain text input with no clear affordance; the field is reset only programmatically (L1151, L1170). Add a clear button that empties the search and re-runs the filter."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",loe:"S",theme:"0 - Messaging: composer + polish (one messages release)",
  desc:"Remove the redundant 'Added to every send' signature preview.",
  verdict:"js/messaging.js refreshSignaturePreview (L369) writes it into #msgSigPreview (L350, set L374); messages.html hides it ONLY inside the mobile max-width media query (L565), so desktop and the RO-card composer still show it. Remove or collapse in all viewports; the signature keeps sending."},
 {id:"5fec3eca",by:"Sofia",date:"07-15",loe:"S",theme:"0 - Messaging: composer + polish (one messages release)",
  desc:"Show the customer address on the emailed RAF copy.",
  verdict:"The raf_copy branch of send-quote-email (L387) destructures to / cc / customerName / roId / signedDate / rv / services / workType / phone / customerType / serviceDesc / warrantyDesc / promisedDate / signatureDataUrl - no customerAddress; the address exists only in the lead_staff_notify branch. Add it to the payload and both templates. Edge-fn deploy, no dashboard release."},
 {id:"0448de62",by:"Sofia",date:"06-11",loe:"L",theme:"0 - Messaging: composer + polish (one messages release)",
  desc:"Send the authorization form remotely for e-signature.",
  verdict:"Signing is kiosk-only (customer-checkin.html on-device pad); the raf_copy branch just emails a copy after signing. signing_token / remote_sign / signature_request / signing_link return nothing repo-wide. Needs a tokenized public signing page, a delivery path and signed-form storage. Not part of the S batch - pairs with the S166 short-link machinery."},
 // ---- GROUP 1: RO STATUSES & FIELDS ----
 {id:"44419de9",by:"Lynn",date:"08-12",loe:"S",theme:"1 - RO Statuses & Fields - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"New statuses: Need Estimate / Awaiting Estimate / Estimate Declined / Job Declined-Close.",
  verdict:"None of the 4 exist. Each add hits ~9 hardcoded UI spots PLUS both DB CHECKs or saves throw 23514. CAUTION: this verdict was stamped at v1.494 counting 12 statuses; v1.500 counts 15 and v1.501 added 'Closed - No Charge', so RE-ANCHOR the line numbers before building. Overlaps 972af03c CANCELED - confirm scope with Lynn."},
 {id:"972af03c",by:"Lynn",date:"07-17",loe:"S",theme:"1 - RO Statuses & Fields - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Add status CANCELED - keep record + notes, never delete.",
  verdict:"Absent: STATUS_PROGRESS_MAP ends at Delivered/Cashed Out and the only 'cancelled' hits are the scheduled_notifications and review_requests CHECKs. Add the status plus color/priority maps, exclude from on-lot and queue counts, keep the record for notes. Canonical for duplicates eb00a68d and (half of) 611589ba."},
 {id:"3e746c18",by:"Lynn",date:"08-03",loe:"S",theme:"1 - RO Statuses & Fields - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Add status TOTALED OUT.",
  verdict:"totaled / totalled return zero hits across js/config.js and js/render.js. Distinct terminal value from Canceled, so kept as its own item, but ONE build should add both and exclude both from the queue / on-lot counts (js/render.js L656-658, L718-721)."},
 {id:"a195e4ab",by:"Brandon",date:"08-20",loe:"M",theme:"1 - RO Statuses & Fields - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Track checks received on an RO (multiple, with amounts and dates).",
  verdict:"Zero check tracking: check_number / checkNumber / payments = 0 hits. The only payment capture is the one-value Customer Pay block (index.html L7203-7246 / L7782-7804), hybrid-RO-only, method Check but no check number, one amount + datePaid, saved flat into insurance_data JSONB and never shown on the card. Needs a per-RO checks table + add/list UI + cashiered mirror."},
 {id:"0e172b2c",by:"Sofia",date:"07-16",loe:"M",theme:"1 - RO Statuses & Fields - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Merge duplicate customer accounts created under different spellings.",
  verdict:"js/duplicates.js has an RO-level merge engine but groups strictly on the PRVS-XXXX-XXXX base RO id (regex L36, keying L44), so two ROs under different spellings of one customer are never detected. Needs name/phone account dedup plus a verify-which-is-correct step. The one-off cleanup was 3f254929 (already applied)."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",loe:"M",theme:"1 - RO Statuses & Fields - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Archive quote-only customers/units that never moved forward.",
  verdict:"The only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase L662); archived / abandoned return zero hits in render.js and config.js. Needs a flag, a board filter and an un-archive path - or decide the new Canceled status alone is enough. Pairs with 972af03c."},
 // ---- GROUP 2: NOTIFICATIONS & TASK-TRACKING (re-scope vs S186) ----
 {id:"a03677e6",by:"Brandon",date:"08-07",loe:"S",theme:"2 - Notifications & Task-Tracking - RE-SCOPE against the S186 Task Manager first",
  desc:"Move machine lines (NOTIFICATION SENT, customer reply) out of RO Status Updates.",
  verdict:"Machine audit lines all write as notes type 'ro_status' and crowd the box - NOTIFICATION SENT/FAILED (process-scheduled-notifications L187/L215), SCHEDULED/CANCELLED (index.html L3116/L3154), key-date and urgent rows (js/ro-crud.js), parts notes (js/parts.js). customer_comm already renders separately. Small: retarget the type. CAUTION: Roland reversed exactly this retarget for LEAD NOTES in v1.491 - confirm scope with him."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",loe:"L",theme:"2 - Notifications & Task-Tracking - RE-SCOPE against the S186 Task Manager first",
  desc:"Per-RO TO-DO list with daily reminder; items persist until completed.",
  verdict:"STALE VERDICT. The stored text ('ro_tasks / task_tracker / customer_task = zero hits') predates S186. task_manager_s186.sql now creates tasks with an ro_uuid FK to repair_orders (L15), task_events, board_prefs and the ro_activity_feed view, plus send-task-reminders for the nag loop - that is the persist-plus-reminder half. What is still open is the PLACEMENT ask: a bulleted list on the RO card that anyone can add to and check off with who/when notation. index.html does not read the tasks table at all. Re-scope, do not rebuild."},
 {id:"5925fc01",by:"Lynn",date:"04-09",loe:"L",theme:"2 - Notifications & Task-Tracking - RE-SCOPE against the S186 Task Manager first",
  desc:"Notify team on every RO update + daily digest with scraped to-dos.",
  verdict:"STALE VERDICT, same reason as af14b3cb. The daily digest half already shipped as send-manager-report and single-event notifies exist; S186 has since added the task nag loop. Remaining genuine gap is notify-on-every-RO-update and to-do scraping from status notes. Design with af14b3cb."},
 // ---- GROUP 3: PARTS & INVENTORY ----
 {id:"2af47890",by:"Brandon",date:"08-25",loe:"S",theme:"3 - Parts & Inventory",
  desc:"Marking a part Received should stamp the date received.",
  verdict:"DB half ships: trigger trg_stamp_date_received (stamp_date_received_on_parts.sql L33-36) stamps the shop-local day on the transition into Received. Client half missing: js/parts.js markPartReceived (L449-478) sets part.status only, never part.dateReceived, so the in-memory row stays blank and a later savePartForm edit resends date_received null (L539) - which the trigger will NOT restamp (OLD.status already Received), wiping the date. Build with 1e434aff."},
 {id:"1e434aff",by:"Brandon",date:"08-25",loe:"S",theme:"3 - Parts & Inventory",
  desc:"Show the received date on the parts status page.",
  verdict:"The Manage Parts table has no receipt-date column - headers are Part Name / Part # / Supplier / Status / Qty / Wholesale / Retail / Quick / Actions (js/parts.js L259-267) and renderPartsRows (L121-145) prints no p.dateReceived; the value is only editable in the collapsed Add/Edit Part form (pf_dateReceived L242). Small: render it beside the Received tick. Depends on 2af47890 landing the stamp."},
 {id:"8d885331",by:"Lynn",date:"04-09",loe:"S",theme:"3 - Parts & Inventory",
  desc:"Reorder the parts-entry form fields.",
  verdict:"Form unchanged (js/parts.js pf_supplier L181, pf_partName L190, pf_serviceSilo L208, pf_returnDeadline L226). The ask is only a field reorder - quick once Lynn supplies the target layout or a mockup. BLOCKED on detail, not on effort."},
 {id:"b19975d4",by:"Lynn",date:"04-09",loe:"L",theme:"3 - Parts & Inventory",
  desc:"Parts returned to supplier / warrantied by supplier.",
  verdict:"Partial infra only: PART_STATUSES includes 'Returned' (js/config.js L200) and there is a Return Deadline input (js/parts.js L226), but rma / return_reason / supplier_credit return zero hits - no RMA number, reason, credit or reverse-direction flow. Equals GH#24 Shop Ops Phase 2; merge into that build. Canonical for declined duplicate 86bbaf50."},
 {id:"14f35f95",by:"Lynn",date:"04-09",loe:"XL",theme:"3 - Parts & Inventory",
  desc:"Parts stock inventory (order 25, use 5, 20 searchable in-house).",
  verdict:"inventory / on_hand / in_stock / stock_qty return zero hits across js, migrations and functions; parts remain per-RO line items only. New subsystem: inventory table, receive/consume/adjust flows, a searchable priced stock view, and links from the parts-request path. Largest item on the board - needs its own spec and a Roland go/no-go."},
 // ---- GROUP 4: BOARD & NAVIGATION UX ----
 {id:"6ff111e7",by:"Lynn",date:"08-27",loe:"S",theme:"4 - Board & Navigation UX",
  desc:"Enlarge and re-color the drop date on the RO card - it must stand out.",
  verdict:"Not a repeat of fa35e3df. That ER already recolored the Drop chip #0a84ff -> #5cadff in v1.498, but Lynn filed this 5 days AFTER it shipped and adds a NEW size ask. At HEAD 505e22b js/render.js L468 still renders Drop at 0.72rem / weight 700 - the smallest of the three key dates - vs the Promised chip L469 at 0.78rem / 800. Small, render/CSS only."},
 {id:"d1844e46",by:"Lynn",date:"07-16",loe:"S",theme:"4 - Board & Navigation UX",
  desc:"Sort board by promised date then oldest-on-lot, Shop Ops pinned top.",
  verdict:"renderBoard sorts on the single blended calculatePriority score (js/render.js L30-39) with the shop-ops pin at L35-37; sortBy / sortSelect / sortMode find nothing. Add a selectable strict promised-then-oldest sort while keeping the shop pin. Related to 1aeb3f58, which delivered only the chip."},
 // ---- GROUP 5: TIME CLOCK & CHECK-IN ----
 {id:"6bb61db2",by:"Riley",date:"07-22",loe:"S",theme:"5 - Time Clock & Check-In (build once)",
  desc:"Compact-view clock in/out button + clocked-in indicator at login (all layouts).",
  verdict:"js/render.js compact-col-actions (L228-235) has edit / parts / WO / notify / message / schedule but no check-in-out button, and 'clocked in' / activeTimeLog return nothing across index.html, render.js and time-tracking.js. CANONICAL spec for this theme - folds in e06d747e."},
 {id:"e06d747e",by:"Riley",date:"04-10",loe:"S",theme:"5 - Time Clock & Check-In (build once)",
  desc:"Tech check-in float for ease of access.",
  verdict:"No floating or sticky check-in control on any page. Underspecified - almost certainly the same ask as 6bb61db2. Scope the target page and behavior with Riley, then build once."},
 // ---- GROUP 6: WORK ORDERS ----
 {id:"2f752d40",by:"Jason",date:"07-21",loe:"S",theme:"6 - Work Orders",
  desc:"WO dollar amount auto-populates from total hours x $195 labor rate.",
  verdict:"woFormDollar (L360) and woFormEstHours (L365) are independent manual inputs read separately on save (L649-650); LABOR_RATE / laborRate / labor_rate return zero hits in the module (js/insurance.js laborRate L212 is the per-claim INSURANCE rate). Auto-populate dollar_value = effective hours x $195/hr, respecting the dollarLocked gate (L324)."},
 // ---- GROUP 7: SCHEDULING & DATES ----
 {id:"47428f75",by:"Lynn",date:"08-03",loe:"S",theme:"7 - Scheduling & Dates",
  desc:"'Update vacation/sick/personal calendar' - underspecified.",
  verdict:"time-off.html already has all three types, a color-coded month calendar, stats tiles, per-row Edit (L752, ER ee50d11c) and exact partial-day windows (L368, L372). No stated defect or target. Filed Needed rather than Done because the ask maps to no gap without detail - ASK LYNN what is wrong or wanted before filing work."},
 // ---- GROUP 8: AUTH & COST ----
 {id:"ed1b873e",by:"Roland",date:"06-07",loe:"XL",theme:"8 - Auth & Cost - needs Roland",
  desc:"Replace per-seat Google-email auth (~$500/mo) with database auth.",
  verdict:"Auth is Google-token end-to-end: js/auth.js imports GOOGLE_CONFIG (L69), initialises gapi (L203-204) and signs in via One Tap plus signInWithIdToken; the kiosk uses the same path. A Supabase password / magic-link swap drops roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Dedicated design session."},
 // ---- GROUP 9: PAPERWORK ----
 {id:"611589ba",by:"Lynn",date:"08-24",loe:"DUP",theme:"9 - Paperwork: decline, no code",
  desc:"Need statuses Closed and Canceled in the drop-down.",
  verdict:"DUPLICATE - both halves are already open ERs. CANCELED is 972af03c (canonical; eb00a68d already declined into it); Closed is 44419de9's JOB DECLINED/CLOSE. Re-verified absent at v1.500: STATUS_PROGRESS_MAP L151-171 lists 15 statuses, neither value present. Adds no work item. THE ONLY DUPLICATE STILL UNREVIEWED - one decline takes the open count 31 -> 30."}
];

const order = [...new Set(ERS.map(e=>e.theme))];
const counts = {BUG:0,S:0,M:0,L:0,XL:0,DATA:0,DUP:0};
ERS.forEach(e=>counts[e.loe]++);
document.getElementById('stats').innerHTML =
  `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Unreviewed ERs</div></div>
   <div class="stat"><div class="n" style="color:var(--bug)">${counts.BUG}</div><div class="l">Bugs</div></div>
   <div class="stat"><div class="n" style="color:var(--s)">${counts.S}</div><div class="l">Small</div></div>
   <div class="stat"><div class="n" style="color:var(--m)">${counts.M}</div><div class="l">Medium</div></div>
   <div class="stat"><div class="n" style="color:var(--l)">${counts.L}</div><div class="l">Large</div></div>
   <div class="stat"><div class="n" style="color:var(--xl)">${counts.XL}</div><div class="l">XL</div></div>
   <div class="stat"><div class="n" style="color:var(--data)">${counts.DATA+counts.DUP}</div><div class="l">Data / Dup</div></div>`;

let filter='all', q='';
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  order.forEach(theme=>{
    const items=ERS.filter(e=>e.theme===theme)
      .filter(e=>filter==='all'||e.loe===filter)
      .filter(e=>!q||JSON.stringify(e).toLowerCase().includes(q));
    if(!items.length) return;
    const h=document.createElement('div'); h.className='theme'; h.textContent=theme; list.appendChild(h);
    items.forEach(e=>{
      const d=document.createElement('div'); d.className=`er b-${e.loe}`;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p><span class="tag t-${e.loe}">${e.loe}</span></div>
        <div class="meta">${e.id} · ${e.by} · 2026-${e.date}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
}
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); filter=p.dataset.f; render();
});
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();render();};
render();
</script>
</body>
</html>
