<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS — Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
</style>
</head>
<body>
  <h1>PRVS — Enhancement Request Triage</h1>
  <div class="sub">2026-08-07 - headless nightly runner - vs index.html v1.491 (HEAD 362137d) - 31 open items: 5 Bugs + 26 Needed</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <input id="q" placeholder="Search ERs…">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 {id:"09084bc5",by:"Lynn",date:"08-04",cat:"Bug - data loss",loe:"L",theme:"Bugs - fix first",
  desc:"When an RO is closed and reopened, all fields, parts, pictures and documents must repopulate - today they do not.",
  verdict:"CONFIRMED BUG, severity LARGE (permanent data loss). js/ro-crud.js archiveROInSupabase L666-693 writes cashiered via a 24-column allowlist that OMITS photo_library, planned_dropoff_date, pickup_date, key_status, keypad_code, keep_plugged_in and urgent_update, then L697 hard-deletes the repair_orders row. cashiered_child_archives mirrors 7 child tables only, with no photo/doc mirror, so closed-ros.html reactivateRO cannot restore them. Fix: widen the allowlist in BOTH the JS and the archive_cashiered_ros SQL twin, and add a photo/doc mirror."},
 {id:"225a2535",by:"Brandon",date:"08-05",cat:"Bug - data integrity",loe:"S",theme:"Bugs - fix first",
  desc:"Insurance information typed into one customer's RO tries to transfer to a different customer.",
  verdict:"CONFIRMED BUG, severity data-integrity (wrong customer's insurance data persisted). window._lastEstimateScan is set per scan (js/insurance.js L118) and keyed only by mode (read L43-44), and closeEditModal deliberately KEEPS it (js/ro-crud.js L1192). Scan RO A, close without saving, open RO B: A's values auto-fill B and saving B merges A's extracted data (index.html L6617-6620). Fix: key the cache to the RO id."},
 {id:"d94a418a",by:"Brandon",date:"07-27",cat:"Bug - data display",loe:"S",theme:"Bugs - fix first",
  desc:"RO STATUS text should display exactly as typed; today the latter portion of a long message appears near the top.",
  verdict:"CONFIRMED, severity data-display (render only, no data loss). js/render.js L553 draws the card RO Status box via split-newline + map(escapeHtml) + reverse(), reversing EVERY line, so a multi-line note reads bottom-line-first. L563 does the same to Customer Comm. Entry boundaries are lost upstream because js/ro-crud.js joins entries with a newline. Reuse the S159 history-modal entry regex for both boxes."},
 {id:"d4d0eeba",by:"Brandon",date:"07-22",cat:"Bug - navigation",loe:"S",theme:"Bugs - fix first",
  desc:"Clicking an RO in My List, or a link in Messages, does not take you to the right entry on the board.",
  verdict:"BUG, severity small (navigation, no data risk), two paths. Work list: scrollToROInBoard (index.html L4201-4217) only matches already-rendered [data-ro-index] cards, else it toasts, and the toast Clear Filters action re-renders but never then scrolls. Messages: js/qr.js handleDeepLink L198 returns silently when the RO is not in currentFilteredData. Canonical for 9031e101 and 1bc33dd6 - one fix retires three rows."},
 {id:"5ca724ff",by:"Lynn",date:"08-06",cat:"Bug - NEW 08-06",loe:"S",theme:"Bugs - fix first",
  desc:"The work list can be reorganized on the mobile interface but not on desktop.",
  verdict:"NEW ER, BUG, severity small (UX only; the saved priority is intact). Desktop reorder IS wired (js/work-list.js row.draggable L304, dragstart L389, dragover L395, drop L397) but dragstart never populates e.dataTransfer - no setData, not even the effectAllowed the WO task drag sets (js/work-orders.js L482) - and there is no dragenter preventDefault, so Safari and Firefox desktop refuse the drag while the bespoke touch path (L404-429) works. NEEDS A DESKTOP REPRO: ask Lynn which browser, and whether the row lifts at all."},
 {id:"5925fc01",by:"Lynn",date:"04-09",cat:"Notif/Digest",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Notify the right team on every RO update; daily comprehensive list of all in-progress jobs with to-dos scraped from status notes.",
  verdict:"PARTIAL. The daily in-progress digest half ships as supabase/functions/send-manager-report, and single-event notifies exist (service_added_notify js/work-orders.js L293; urgent_update_notify js/ro-crud.js L370). Still absent: notify-on-every-RO-update and to-do scraping from status notes - grep for ro_tasks / task_tracker / customer_task returns zero hits. Anchor of this theme; pairs with af14b3cb."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",cat:"Task-Tracking",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Per-customer task tracker with a daily reminder; each task stays on the list until marked complete.",
  verdict:"Confirmed still absent. js/shop-tasks.js is a non-customer shop checklist with no ro_id link and no reminder column, and ro_tasks / customer_task / task_tracker return zero hits across js and supabase. Needs a per-RO tasks table, an add/complete UI and a daily open-task reminder. Pairs with 5925fc01."},
 {id:"5fec3eca",by:"Sofia",date:"07-15",cat:"Auth form email",loe:"S",theme:"Notifications & Task-Tracking",
  desc:"Show the customer's address on the emailed copy of the authorization form.",
  verdict:"Confirmed still absent: the raf_copy branch of supabase/functions/send-quote-email destructures to / cc / customerName / roId / signedDate / rv / services / workType / phone / customerType / serviceDesc / warrantyDesc / promisedDate / signatureDataUrl with no customerAddress. The address appears only in the lead_staff_notify branch. Small: add customerAddress to the raf_copy payload and both templates."},
 {id:"14f35f95",by:"Lynn",date:"04-09",cat:"Parts",loe:"XL",theme:"Parts & Inventory",
  desc:"In-house parts inventory: order a box of 25, use 5, remaining 20 go to stock - listed as available, priced, and searchable.",
  verdict:"Confirmed still absent: grep for inventory / on_hand / in_stock / stock_qty across js, supabase/migrations and supabase/functions returns zero code hits. Parts remain per-RO line items only (js/parts.js). New subsystem: inventory table, receive/consume/adjust flows, a searchable priced stock view, and links from the parts-request path. Largest item on the board."},
 {id:"b19975d4",by:"Lynn",date:"04-09",cat:"Parts",loe:"L",theme:"Parts & Inventory",
  desc:"Track a part that needs to be returned to the supplier or warrantied by the supplier.",
  verdict:"Partial infra only: js/config.js PART_STATUSES includes Returned and js/parts.js has a Return Deadline input (pf_returnDeadline L226), but rma / return_reason / supplier_credit return zero hits - no RMA number, return reason, supplier credit or reverse-direction flow. Equals GH#24 Shop Ops Phase 2. Canonical for the declined duplicate 86bbaf50."},
 {id:"8d885331",by:"Lynn",date:"04-09",cat:"Parts",loe:"S",theme:"Parts & Inventory",
  desc:"Rework the field order on the parts-entry / ordering screen (move fields around).",
  verdict:"The parts-entry form is unchanged: js/parts.js pf_supplier L181, pf_partName L190, pf_serviceSilo L208, pf_returnDeadline L226. The ask is only to reorder those fields, which is quick once Lynn supplies the target layout or a mockup. BLOCKED on detail, not on effort."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",cat:"RO archive",loe:"M",theme:"RO Fields & Status",
  desc:"A way to archive customers or units that only exist because we quoted them and never moved forward.",
  verdict:"Confirmed still absent: the only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase L658), and archived / abandoned return zero hits in js/render.js and js/config.js - no soft-archive flag, status or board filter. Needs a flag, a board filter and an un-archive path. Pairs with 972af03c."},
 {id:"972af03c",by:"Lynn",date:"07-17",cat:"RO status",loe:"S",theme:"RO Fields & Status",
  desc:"Add RO status CANCELED - keep the record and all notes rather than deleting it.",
  verdict:"Confirmed still absent: js/config.js STATUS_PROGRESS_MAP L151-164 ends at Delivered/Cashed Out, and the only cancelled hits in the repo are the scheduled_notifications and review_requests status CHECKs. Small: add the status plus the color/priority maps and exclude it from the on-lot and queue counts. Canonical for duplicate eb00a68d; pairs with 3e746c18."},
 {id:"3e746c18",by:"Lynn",date:"08-03",cat:"RO status",loe:"S",theme:"RO Fields & Status",
  desc:"Add RO status TOTALED OUT.",
  verdict:"Confirmed absent: totaled / totalled return zero hits across js/config.js and js/render.js, and the status maps end at Delivered/Cashed Out. A distinct value from 972af03c's Canceled, so kept as its own item, but ONE build should add both terminal statuses and exclude them from the queue and on-lot counts (js/render.js L656-658, L718-721)."},
 {id:"ac8265c8",by:"Lynn",date:"08-05",cat:"RO field",loe:"S",theme:"RO Fields & Status",
  desc:"Add mileage to the RO.",
  verdict:"Confirmed absent: a case-insensitive grep for mileage / odometer across every js, html and sql file in the repo returns zero hits - the RO records rv and vin but never the unit's mileage. Small: one repair_orders.mileage column plus the New/Edit RO inputs (js/ro-crud.js create L409-415 / edit L486-491) and an optional card readout. Bundle with 3e746c18 and 972af03c."},
 {id:"50175fce",by:"Lynn",date:"07-27",cat:"Urgent update",loe:"S",theme:"RO Fields & Status",
  desc:"Move the urgent-update input onto the tile at the bottom instead of inside Edit RO.",
  verdict:"Valid and confirmed absent: urgent_update is writable only from the New/Edit RO forms (js/ro-crud.js L414 create, L491 edit) and the card banner is read-only - js/render.js L324 even titles it change it via Edit RO. Small: add an inline edit-in-place control at the tile bottom reusing the existing editField / notify path so it still fires urgent_update_notify. Follow-on to a7d1474e."},
 {id:"9aab7550",by:"Brandon",date:"07-21",cat:"Messages",loe:"S",theme:"Messages UX",
  desc:"Make unread messages clearly visible in the conversation list with a highlight.",
  verdict:"Still only partial on messages.html v1.23. S166 added a MANUAL Mark-unread button (markConversationUnread) which helps, but the visual treatment is unchanged: a single 8px gold .unread-dot applied only when last_direction is inbound AND status is open, with no row-level highlight. Small: add a bold/tinted unread row treatment."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",cat:"Messages",loe:"S",theme:"Messages UX",
  desc:"Rescale the conversation list text to make it easier to read.",
  verdict:"Confirmed still absent on messages.html v1.23: the page uses fixed rem font sizes with no user text-size control - font-scale / fontScale / textSize return zero hits across js, html and css. Small: add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",cat:"Messages",loe:"S",theme:"Messages UX",
  desc:"Add a button to clear the name faster in the messaging search bar.",
  verdict:"Confirmed still absent on messages.html v1.23: convoSearch is a plain text input with no clear affordance, and the field is reset only programmatically. Small: add a clear (x) button that empties the messaging conversation search and re-runs the filter."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",cat:"Messages",loe:"S",theme:"Messages UX",
  desc:"Remove the redundant 'Added to every send' line at the bottom of every chat.",
  verdict:"Valid, still present on desktop: js/messaging.js refreshSignaturePreview writes Added to every send into #msgSigPreview (element L350, read L370) on both surfaces, and messages.html hides it only inside the max-width:760px mobile media query - so desktop messages.html and the RO-card composer still show it. Small: remove it or collapse it behind a toggle in all viewports; the signature itself keeps sending."},
 {id:"ca0f7ed9",by:"Brandon",date:"08-03",cat:"Messages",loe:"S",theme:"Messages UX",
  desc:"Auto-populate the Messages lead-info section when the customer is already in the dashboard.",
  verdict:"Confirmed still absent on messages.html v1.23: renderLeadInfo reads ONLY the conversation's own columns (c.rv, c.service_type), so an existing dashboard customer shows No RV or service type captured yet. selectConversation already computes phone-matched live ROs as linked for renderContactInfo but calls renderLeadInfo(c) without them. S168 touched the create-RO handoff, not this panel. Small: pass linked, fall back to RO rv."},
 {id:"29654af7",by:"Lynn",date:"07-06",cat:"Board nav",loe:"S",theme:"Board & Navigation UX",
  desc:"A quick button back to the top of the page once you have scrolled down to a tile.",
  verdict:"Confirmed still absent: backToTop / back-to-top / scroll-to-top / scrollToTop return nothing across index.html, js and css, and the board has only targeted scrollIntoView calls. Small: add a scroll-triggered back-to-top / jump-to-search control, ideally present in the sidebar layout too. Canonical for duplicate 2b78696c."},
 {id:"d1844e46",by:"Lynn",date:"07-16",cat:"Board sort",loe:"S",theme:"Board & Navigation UX",
  desc:"Sort the dashboard by promised date then oldest on lot, keeping PRVS Shop Operations pinned to the top.",
  verdict:"Confirmed still absent: js/render.js renderBoard sorts on the single blended calculatePriority score (L30-39) with the shop-ops pin at L35-37, and sortBy / sortSelect / sortMode find nothing in index.html or js/render.js. Small: add the strict promised-then-oldest sort option while keeping the shop pin. Related to 1aeb3f58, which delivered only the promised-date chip."},
 {id:"d432863a",by:"Brandon",date:"07-21",cat:"Branding",loe:"S",theme:"Board & Navigation UX",
  desc:"Make the browser tab icon the Patriots logo so the site stands out among open tabs.",
  verdict:"Confirmed still absent: favicon / rel=icon / apple-touch-icon return zero hits across all repo html files, so every tab shows the generic browser icon. Small: add a Patriots-logo favicon plus apple-touch-icon to each page head - logo.png already ships in the repo but needs resizing to icon dimensions."},
 {id:"e06d747e",by:"Riley Scott",date:"04-10",cat:"Time Clock",loe:"S",theme:"Time Clock",
  desc:"Tech check-in float for ease of access.",
  verdict:"Confirmed still absent: no floating or sticky tech check-in control in index.html or checkin.html, and js/render.js compact-col-actions L228-235 offers edit / parts / WO / notify / message / schedule only, with no check-in button. UNDERSPECIFIED - scope the target page and the exact behavior with the submitter. Pairs with 6bb61db2."},
 {id:"6bb61db2",by:"Riley Scott",date:"07-22",cat:"Time Clock",loe:"S",theme:"Time Clock",
  desc:"Check in / check out button on the compact view, plus a live reminder of which unit you are clocked into at login.",
  verdict:"Confirmed still absent: js/render.js compact-col-actions L228-235 has edit / parts / WO / notify / message / schedule but no check-in-out button, and clocked in / clocked into / activeTimeLog return nothing across index.html, js/render.js and js/time-tracking.js. Small: add a compact check-in/out action plus a login-time active time_log banner shown across views. Pairs with e06d747e."},
 {id:"2f752d40",by:"Jason Rubin",date:"07-21",cat:"Work Orders",loe:"S",theme:"Work Orders",
  desc:"Auto-populate the work-order dollar amount from total task hours at the posted $195/hr labor rate.",
  verdict:"Confirmed still absent: js/work-orders.js has independent manual inputs woFormDollar L360 and woFormEstHours L365, read separately on save L649-650, and LABOR_RATE / laborRate / labor_rate return zero hits in the module (js/insurance.js laborRate is the per-claim INSURANCE rate). Small: auto-populate dollar_value = effective hours x $195/hr, respecting the dollarLocked gate L324."},
 {id:"0e172b2c",by:"Sofia",date:"07-16",cat:"Dedup/merge",loe:"M",theme:"Data Integrity & Duplicates",
  desc:"Merge duplicate customer accounts created under different spellings, asking the customer to verify which is correct.",
  verdict:"Partial: js/duplicates.js has an RO-level merge/delete engine (getBaseROId L35, findDuplicateGroups L40, executeDupeMerge wired L116) but it groups strictly on the PRVS-XXXX-XXXX base RO id (L44), so two ROs created under different spellings of the same customer are never detected. Needs name/phone account dedup plus a verify-which-is-correct merge step. The one-off cleanup for the Huebert case is 3f254929."},
 {id:"0448de62",by:"Sofia",date:"06-11",cat:"Auth form",loe:"L",theme:"Messaging & e-sign",
  desc:"Send an authorization form remotely for e-signature.",
  verdict:"Confirmed still absent: signing is kiosk-only (customer-checkin.html on-device signature pad) and the raf_copy branch of send-quote-email only emails a copy AFTER signing; signing_token / remote_sign / signature_request / signing_link return nothing across js, supabase and the HTML pages. Needs a tokenized public signing page, a delivery path and signed-form storage. Pairs naturally with the SMS channel."},
 {id:"ed1b873e",by:"Roland",date:"06-07",cat:"Auth/Cost",loe:"XL",theme:"Auth & Cost",
  desc:"Replace Google-email auth (~$25/mo each, ~$500/mo total; most staff do not use the email) with database-specific auth.",
  verdict:"Confirmed still Google-based: js/auth.js imports GOOGLE_CONFIG from js/config.js, initialises gapi with it and signs in via google.accounts One Tap plus signInWithIdToken; the kiosk uses the same path. Swapping to Supabase password / magic-link or shared role accounts drops roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Scope with Roland."},
 {id:"47428f75",by:"Lynn",date:"08-03",cat:"Time Off",loe:"S",theme:"Time Off",
  desc:"Update the vacation / sick / personal calendar.",
  verdict:"UNDERSPECIFIED - no stated defect or target. time-off.html already has all three types (L270-272), a color-coded month calendar, stats tiles, per-row Edit (L752, ER ee50d11c) and exact partial-day windows (modalStartTime L368, modalEndTime L372). Filed Needed rather than Done because the ask maps to no gap without Lynn's detail; if it restates ee50d11c it is already delivered. Scope with the submitter."},
];

const ORDER={XL:0,L:1,M:2,S:3};
let activeFilter="all", query="";

function renderStats(){
  const c={XL:0,L:0,M:0,S:0};
  ERS.forEach(e=>c[e.loe]++);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Open items (Bugs + Needed)</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--xl)">${c.XL}</div><div class="l">XL — new subsystem</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--l)">${c.L}</div><div class="l">L — multi-session</div></div>`+
    `<div class="stat"><div class="n" style="color:#7fb0ff">${c.M}</div><div class="l">M — ½–1 session</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--s)">${c.S}</div><div class="l">S — under 2h*</div></div>`;
}
function renderList(){
  const list=document.getElementById('list'); list.innerHTML="";
  const q=query.toLowerCase();
  const shown=ERS.filter(e=>{
    if(activeFilter!=="all"&&e.loe!==activeFilter) return false;
    if(q){const blob=(e.id+e.by+e.cat+e.desc+e.verdict+e.theme).toLowerCase(); if(!blob.includes(q)) return false;}
    return true;
  });
  const themes=[...new Set(shown.map(e=>e.theme))];
  themes.forEach(th=>{
    const h=document.createElement('div'); h.className="theme"; h.textContent=th; list.appendChild(h);
    shown.filter(e=>e.theme===th).sort((a,b)=>ORDER[a.loe]-ORDER[b.loe]).forEach(e=>{
      const d=document.createElement('div'); d.className="er b-"+e.loe;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p>
        <span class="tag t-${e.loe}">LOE ${e.loe}</span></div>
        <div class="meta">${e.id} · ${e.by} · ${e.date} · ${e.cat}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
  if(!shown.length) list.innerHTML='<div class="sub">No ERs match.</div>';
}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); activeFilter=p.dataset.f; renderList();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; renderList();});
renderStats(); renderList();
</script>
</body>
</html>
