<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS - Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
</style>
</head>
<body>
  <h1>PRVS - Enhancement Request Triage</h1>
  <div class="sub">2026-08-21 | headless runner | vs index.html v1.495 (HEAD df519c6) | 30 open Needed ERs shown below | 4 open Bugs tracked separately in docs/ER_TRIAGE_2026-08-21.md</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <input id="q" placeholder="Search ERs...">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 {id:"a195e4ab",by:"Brandon",date:"08-20",cat:"RO Management",loe:"M",theme:"RO Fields & Status",
  desc:"NEW 08-20. A section on the RO to record check information and append each additional check received.",
  verdict:"NEW ER, confirmed at HEAD df519c6 (v1.495): zero check tracking - grep check_number / checkNumber / check_amount / payments across js, index.html and supabase/migrations returns 0 hits. The only payment capture is the single-value Customer Pay Details block (index.html L7203-7246 New RO, L7782-7804 Edit RO), which is hybrid-RO-only (setROType L2263-2267), offers Payment Method 'Check' with no check number (L7229 / L7797), holds one amount and one datePaid, is saved flat into the insurance_data JSONB blob (collectInsuranceFields L2414-2423, write L6562 / L6718), and is never rendered on the card (0 hits for customerPay / paymentMethod in js/render.js). Needs a repeatable per-RO checks/payments child table, an add-and-list UI, a card readout and a cashiered_child_archives mirror so the history survives cash-out (the 09084bc5 / S171 lesson). Confirm with Brandon whether insurance drafts count as checks - that decides whether it lives on every RO type or only on the hybrid pay block."},
 {id:"0e172b2c",by:"Sofia",date:"07-16",cat:"RO Management",loe:"M",theme:"RO Fields & Status",
  desc:"Merge duplicate customer accounts created under different spellings of the same name.",
  verdict:"Partial, re-verified at HEAD 0223cb3: js/duplicates.js has an RO-level merge/delete engine (getBaseROId L35, findDuplicateGroups L40, executeDupeMerge) but it groups strictly on the PRVS-XXXX-XXXX base RO id (regex L36, keying L44), so two ROs created under different spellings of the same customer are never detected. Needs name/phone account dedup plus a verify-which-is-correct merge step. The one-off cleanup for this case is 3f254929."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",cat:"RO Management",loe:"M",theme:"RO Fields & Status",
  desc:"Archive customers/units that were only quoted and never moved forward.",
  verdict:"Confirmed still absent at HEAD 0223cb3: the only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase L662 into cashiered + cashiered_child_archives); a case-insensitive grep for archived / abandoned in js/render.js and js/config.js returns zero hits, so there is no soft-archive flag, status or board filter for quoted-but-never-progressed units. Needs a flag, a board filter and an un-archive path. Pairs with 972af03c."},
 {id:"972af03c",by:"Lynn",date:"07-17",cat:"RO Management",loe:"S",theme:"RO Fields & Status",
  desc:"Add an RO status of CANCELED that keeps the record and all notes.",
  verdict:"Confirmed still absent at HEAD 0223cb3: no Canceled / Cancelled RO status - js/config.js STATUS_PROGRESS_MAP ends at Delivered/Cashed Out, and the only 'cancelled' hits in the repo are the scheduled_notifications and review_requests status CHECKs. Add the status plus color/priority maps, exclude it from the on-lot and queue counts, keep the record for notes. Canonical for duplicate eb00a68d; pairs with 3e746c18. STALE LOE: S175 (v1.495) grew the per-status surface to 17 statuses plus optgroup dropdowns, grouped filter chips and both DB CHECKs - re-scope before building."},
 {id:"3e746c18",by:"Lynn",date:"08-03",cat:"RO Management",loe:"S",theme:"RO Fields & Status",
  desc:"Add an RO status of TOTALED OUT.",
  verdict:"Valid and confirmed absent at HEAD 0223cb3: a case-insensitive grep for totaled / totalled across js/config.js and js/render.js returns zero hits. Distinct status value from 972af03c's Canceled, so kept as its own item, but ONE build should add both terminal statuses and exclude them from the queue / on-lot counts. STALE LOE: re-scope post-S175 with 972af03c and 44419de9."},
 {id:"44419de9",by:"Lynn",date:"08-12",cat:"RO Management",loe:"S",theme:"RO Fields & Status",
  desc:"Add RO statuses: Need Estimate, Awaiting Estimate, Estimate Declined, Job Declined/Close.",
  verdict:"NEEDED - none of the 4 values exist at HEAD a405b7a (v1.494); the canonical set was the 12 in js/config.js STATUS_PROGRESS_MAP and is now 17 after S175. Each add must hit the status selects, the filter chips, the inline and twin status maps, statusColorMap, ALL_STATUSES and the Spanish/i18n maps, PLUS both DB CHECKs (repair_orders and the cashiered twin) per S172 or saves throw 23514. Overlaps 972af03c CANCELED - confirm scope with Lynn; bundle with 972af03c + 3e746c18. STALE LOE post-S175."},
 {id:"ac8265c8",by:"Lynn",date:"08-05",cat:"RO Management",loe:"S",theme:"RO Fields & Status",
  desc:"Add mileage to the repair order.",
  verdict:"Valid and confirmed absent at HEAD 0223cb3: a case-insensitive grep for mileage / odometer across every *.js, *.html and *.sql in the repo returns zero hits, so the RO records rv / vin but never the unit's mileage. Small: one repair_orders.mileage column plus the New/Edit RO inputs (js/ro-crud.js create / edit blocks) and an optional card or key-info readout. Bundle with 3e746c18, 972af03c and 44419de9 as one RO-fields build."},
 {id:"50175fce",by:"Lynn",date:"07-27",cat:"RO Management",loe:"S",theme:"RO Fields & Status",
  desc:"Move the urgent-update INPUT onto the tile instead of burying it inside Edit RO.",
  verdict:"Valid and confirmed absent at HEAD 0223cb3: urgent_update is writable only from the New/Edit RO forms and the card banner is read-only - js/render.js even titles it 'change it via Edit RO'. Small: add an inline edit-in-place control at the tile bottom reusing the existing editField / notify path so it still fires urgent_update_notify. Follow-on to ER a7d1474e."},
 {id:"0448de62",by:"Sofia",date:"06-11",cat:"Auth form",loe:"L",theme:"Messaging & E-sign",
  desc:"Send an authorization form remotely for e-signature.",
  verdict:"Confirmed still absent at HEAD 0223cb3: signing is kiosk-only (customer-checkin.html on-device signature pad) and the raf_copy branch of supabase/functions/send-quote-email (L386) only emails a copy after signing; grep for signing_token / remote_sign / signature_request / signing_link across js, supabase and the HTML pages returns nothing. Needs a tokenized public signing page, a delivery path and signed-form storage."},
 {id:"ca0f7ed9",by:"Brandon",date:"08-03",cat:"Messages / Texting",loe:"S",theme:"Messaging & E-sign",
  desc:"Auto-populate the messages lead-info panel when the customer already exists in the dashboard.",
  verdict:"Confirmed still absent on messages.html v1.23 at HEAD 0223cb3: renderLeadInfo (L1389) reads ONLY the conversation's own columns (c.rv, c.service_type), so an existing dashboard customer shows 'No RV or service type captured yet'. selectConversation computes phone-matched live ROs as 'linked' for renderContactInfo but calls renderLeadInfo(c) without them (L1744). S168 touched the create-RO handoff, not this panel. Small: pass 'linked', fall back to RO rv."},
 {id:"5fec3eca",by:"Sofia",date:"07-15",cat:"Auth form",loe:"S",theme:"Messaging & E-sign",
  desc:"Show the customer's address on the emailed copy of the authorization form.",
  verdict:"Confirmed still absent at HEAD 0223cb3: the raf_copy branch of supabase/functions/send-quote-email (L387) destructures to / cc / customerName / roId / signedDate / rv / services / workType / phone / customerType / serviceDesc / warrantyDesc / promisedDate / signatureDataUrl with no customerAddress; the address appears only in the lead_staff_notify branch. Small: add customerAddress to the raf_copy payload and both templates."},
 {id:"9aab7550",by:"Brandon",date:"07-21",cat:"Messages / Texting",loe:"S",theme:"Messaging & E-sign",
  desc:"Make unchecked new messages far more visible in the conversation list.",
  verdict:"Still only partial on messages.html v1.23 at HEAD 0223cb3. S166 added a MANUAL 'Mark unread' button (markConversationUnread L1980) which helps, but the visual treatment is unchanged: a single 8px gold .unread-dot (CSS L469) applied only when last_direction is 'inbound' AND status is 'open' (L1313, rendered L1319), with no row-level highlight. Small: add a bold/tinted unread row treatment."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",cat:"Messages / Texting",loe:"S",theme:"Messaging & E-sign",
  desc:"Let the user rescale the conversation-list text for readability.",
  verdict:"Confirmed still absent on messages.html v1.23 at HEAD 0223cb3: the page uses fixed rem font sizes with no user text-size control - grep for font-scale / fontScale / textSize across js, html and css returns zero hits. Small: add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",cat:"Messages / Texting",loe:"S",theme:"Messaging & E-sign",
  desc:"Add a clear button to the messaging search bar.",
  verdict:"Confirmed still absent on messages.html v1.23 at HEAD 0223cb3: convoSearch (L604) is a plain text input with no clear affordance and the field is reset only programmatically (L1151, L1170). Small: add a clear (x) button that empties the messaging conversation search and re-runs the filter."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",cat:"Messages / Texting",loe:"S",theme:"Messaging & E-sign",
  desc:"Remove the redundant 'Added to every send' signature preview at the bottom of every chat.",
  verdict:"Valid, still present on desktop at HEAD 0223cb3: js/messaging.js refreshSignaturePreview (L369) writes 'Added to every send:' into #msgSigPreview (element L350, set L374). messages.html hides it only inside the mobile max-width media query (L565), so desktop messages.html and the RO-card composer still show it. Small: remove it or collapse it behind a toggle in all viewports; the signature itself keeps sending."},
 {id:"5925fc01",by:"Lynn",date:"04-09",cat:"Notif/Digest",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Notify the right team on every RO update; daily list of all in-progress jobs with to-dos scraped from status notes.",
  verdict:"PARTIAL, re-verified at HEAD 0223cb3. The daily in-progress digest half ships as supabase/functions/send-manager-report, and single-event notifies exist (service_added_notify js/work-orders.js L293; urgent_update_notify js/ro-crud.js L374). Still absent: notify-on-every-RO-update and to-do scraping from status notes - grep for ro_tasks / task_tracker / customer_task across js and supabase returns zero hits. Anchor of this theme; pairs with af14b3cb."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",cat:"Task-Tracking",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Per-customer task tracker with a daily reminder; each task stays on the list until marked complete.",
  verdict:"Confirmed still absent at HEAD 0223cb3: js/shop-tasks.js is a non-customer shop checklist with no ro_id / customer link and no reminder column, and grep for ro_tasks / customer_task / task_tracker across js and supabase returns zero hits. Needs a per-RO tasks table, an add/complete UI and a daily open-task reminder. Pairs with 5925fc01. Now also carries duplicate ece91cba's spec: a third note box beside Repair Description / RO Status, with who and when stamped on add and on complete."},
 {id:"a03677e6",by:"Brandon",date:"08-07",cat:"General UI/UX",loe:"S",theme:"Notifications & Task-Tracking",
  desc:"Move notification-sent / customer-reply lines out of RO Status Updates into the Customer Comms section.",
  verdict:"Confirmed at HEAD 0223cb3: machine audit lines write as notes type 'ro_status' and so crowd RO Status Updates (js/render.js) - NOTIFICATION SENT/FAILED (process-scheduled-notifications), SCHEDULED/CANCELLED (index.html), key-date and urgent rows (js/ro-crud.js), parts notes (js/parts.js). A customer_comm stream already renders separately. Small: retarget the type. Canonical for duplicate 2deb8f30, where Lynn asks for a SEPARATE view rather than the comm stream - reconcile the two before building. NOTE Roland reversed exactly this retarget for LEAD NOTES in v1.491 - confirm scope."},
 {id:"14f35f95",by:"Lynn",date:"04-09",cat:"Parts",loe:"XL",theme:"Parts & Inventory",
  desc:"In-house parts inventory: order a box of 25, use 5, remaining 20 go to searchable priced stock.",
  verdict:"Confirmed still absent at HEAD 0223cb3: a word-boundary grep for inventory / on_hand / in_stock / stock_qty across js, supabase/migrations and supabase/functions returns zero hits. Parts remain per-RO line items only (js/parts.js). New subsystem needed: inventory table, receive/consume/adjust flows, a searchable priced stock view, and links from the parts-request path. Largest item on the board."},
 {id:"b19975d4",by:"Lynn",date:"04-09",cat:"Parts",loe:"L",theme:"Parts & Inventory",
  desc:"Track a part that needs to be returned to the supplier or warrantied by the supplier.",
  verdict:"Partial infra only, re-verified at HEAD 0223cb3: js/config.js PART_STATUSES (L200) includes 'Returned' and js/parts.js has a Return Deadline input (pf_returnDeadline L226), but a word-boundary grep for rma / return_reason / supplier_credit across js and supabase returns zero hits - no RMA number, return reason, supplier credit or reverse-direction flow. Equals GH#24 Shop Ops Phase 2. Canonical for declined duplicate 86bbaf50."},
 {id:"8d885331",by:"Lynn",date:"04-09",cat:"Parts",loe:"S",theme:"Parts & Inventory",
  desc:"Rework the field order on the parts-entry / ordering screen.",
  verdict:"Parts-entry form exists and is unchanged at HEAD 0223cb3: js/parts.js pf_supplier L181, pf_partName L190, pf_serviceSilo L208, pf_returnDeadline L226. The ask is only to reorder those fields, which is quick once Lynn supplies the target layout or a mockup. Blocked on detail, not on effort."},
 {id:"fa35e3df",by:"Lynn",date:"08-18",cat:"General UI/UX",loe:"S",theme:"Board & Navigation UX",
  desc:"NEW 08-18. Get rid of the blue font - too hard to see.",
  verdict:"NEEDED/S, not a functional defect. Small bold blue text sits at or below the WCAG AA 4.5:1 floor: #3b82f6 parts-estimate chip (css/dashboard.css L560, L3020; index.html L1028), .comm-thread-link L1210, #0a84ff Drop key-date chip (js/render.js L363, L395), #667eea .log-duration L1911 - about 4.0-4.6:1 on --bg-surface/--bg-elevated, about 3.7:1 in the light parts modal (js/parts.js L161, L216, L613). Fix: recolor to a #93c5fd-class blue. Underspecified - confirm the screen with Lynn."},
 {id:"29654af7",by:"Lynn",date:"07-06",cat:"General UI/UX",loe:"S",theme:"Board & Navigation UX",
  desc:"A button that jumps back to the top of the page / the search bar after scrolling to a tile.",
  verdict:"Confirmed still absent at HEAD 0223cb3: grep for backToTop / back-to-top / scroll-to-top / scrollToTop across index.html, js and css returns nothing, and the board has only targeted scrollIntoView calls. Small: add a scroll-triggered back-to-top / jump-to-search control, ideally present in the sidebar layout too. Canonical for duplicate 2b78696c."},
 {id:"d1844e46",by:"Lynn",date:"07-16",cat:"General UI/UX",loe:"S",theme:"Board & Navigation UX",
  desc:"Sort the dash by promised date then oldest on lot, keeping PRVS Shop Operations pinned to the top.",
  verdict:"Confirmed still absent at HEAD 0223cb3: js/render.js renderBoard sorts on the single blended calculatePriority score (L30-39) with the shop-ops pin at L35-37; grep for sortBy / sortSelect / sortMode finds nothing in index.html or js/render.js, so there is no selectable strict promised-date-then-oldest-on-lot order. Small: add the strict sort option while keeping the shop pin. Related to 1aeb3f58, which delivered only the promised-date chip."},
 {id:"d432863a",by:"Brandon",date:"07-21",cat:"General UI/UX",loe:"S",theme:"Board & Navigation UX",
  desc:"Make the browser tab icon the Patriots logo so the dashboard stands out among open tabs.",
  verdict:"Confirmed still absent at HEAD 0223cb3: grep for favicon / rel=icon / apple-touch-icon across all repo *.html files returns zero hits, so every tab shows the generic browser icon. Small: add a Patriots-logo favicon plus apple-touch-icon to each page head (logo.png already ships in the repo but needs resizing to icon dimensions)."},
 {id:"e06d747e",by:"Riley",date:"04-10",cat:"Time Clock",loe:"S",theme:"Time Clock & Check-In",
  desc:"Tech check-in float for ease of access.",
  verdict:"Confirmed still absent at HEAD 0223cb3: no floating or sticky tech check-in control in index.html or checkin.html, and js/render.js compact-col-actions (L228-235) offers edit / parts / WO / notify / message / schedule only, with no check-in button. Underspecified: scope the target page and the exact behavior with the submitter. Pairs with 6bb61db2."},
 {id:"6bb61db2",by:"Riley",date:"07-22",cat:"Time Clock",loe:"S",theme:"Time Clock & Check-In",
  desc:"Check in / check out button on the compact view, plus a live reminder of which unit you are clocked into.",
  verdict:"Confirmed still absent at HEAD 0223cb3: js/render.js compact-col-actions (L228-235) has edit / parts / WO / notify / message / schedule but no check-in-out button, and grep for 'clocked in' / 'clocked into' / activeTimeLog across index.html, js/render.js and js/time-tracking.js returns nothing. Small: add a compact check-in/out action plus a login-time active-time_log banner shown across views. Pairs with e06d747e."},
 {id:"2f752d40",by:"Jason Rubin",date:"07-21",cat:"Work Orders",loe:"S",theme:"Work Orders & Shop Tasks",
  desc:"Auto-populate the work-order dollar amount from total hours at the posted $195/hr labor rate.",
  verdict:"Confirmed still absent at HEAD 0223cb3: js/work-orders.js has independent manual inputs woFormDollar (L360) and woFormEstHours (L365), read separately on save (L649-650), and grep for LABOR_RATE / laborRate / labor_rate in the module returns zero hits (js/insurance.js laborRate L212 is the per-claim INSURANCE rate). Small: auto-populate dollar_value = effective hours x $195/hr, respecting the dollarLocked gate (L324)."},
 {id:"ed1b873e",by:"Roland",date:"06-07",cat:"Auth/Cost",loe:"XL",theme:"Auth & Cost",
  desc:"Replace Google-email auth (~$500/mo in seats most staff never use) with database-specific auth.",
  verdict:"Confirmed still Google-based at HEAD 0223cb3: js/auth.js imports GOOGLE_CONFIG from js/config.js (L69), initialises gapi with it (L203-204) and signs in via google.accounts One Tap plus signInWithIdToken; the kiosk uses the same path. Swapping to Supabase password / magic-link or shared role accounts drops roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Scope with Roland."},
 {id:"47428f75",by:"Lynn",date:"08-03",cat:"Time Off",loe:"S",theme:"Scheduling & Dates",
  desc:"Update the vacation / sick / personal calendar. No stated defect or target.",
  verdict:"UNDERSPECIFIED - 'update vacation/sick/personal calendar', no stated defect or target. time-off.html already has all three types, a color-coded month calendar, stats tiles, per-row Edit (L752 / editRequest, ER ee50d11c) and exact partial-day windows (modalStartTime L368, modalEndTime L372). Filed Needed not Done because the ask maps to no gap without Lynn's detail; if it restates ee50d11c it is already delivered. Scope with the submitter."},
];

const ORDER={XL:0,L:1,M:2,S:3};
let activeFilter="all", query="";

function renderStats(){
  const c={XL:0,L:0,M:0,S:0};
  ERS.forEach(e=>c[e.loe]++);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Open ERs (all Needed)</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--xl)">${c.XL}</div><div class="l">XL - new subsystem</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--l)">${c.L}</div><div class="l">L - multi-session</div></div>`+
    `<div class="stat"><div class="n" style="color:#7fb0ff">${c.M}</div><div class="l">M - half to 1 session</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--s)">${c.S}</div><div class="l">S - under 2h*</div></div>`;
}
function renderList(){
  const list=document.getElementById('list'); list.innerHTML="";
  const q=query.toLowerCase();
  const shown=ERS.filter(e=>{
    if(activeFilter!=="all"&&e.loe!==activeFilter) return false;
    if(q){const blob=(e.id+e.by+e.cat+e.desc+e.verdict+e.theme).toLowerCase(); if(!blob.includes(q)) return false;}
    return true;
  });
  const themes=[...new Set(shown.map(e=>e.theme))];
  themes.forEach(th=>{
    const h=document.createElement('div'); h.className="theme"; h.textContent=th; list.appendChild(h);
    shown.filter(e=>e.theme===th).sort((a,b)=>ORDER[a.loe]-ORDER[b.loe]).forEach(e=>{
      const d=document.createElement('div'); d.className="er b-"+e.loe;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p>
        <span class="tag t-${e.loe}">LOE ${e.loe}</span></div>
        <div class="meta">${e.id} - ${e.by} - ${e.date} - ${e.cat}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
  if(!shown.length) list.innerHTML='<div class="sub">No ERs match.</div>';
}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); activeFilter=p.dataset.f; renderList();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; renderList();});
renderStats(); renderList();
</script>
</body>
</html>
