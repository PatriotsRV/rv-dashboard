<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS - Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e; --bug:#f43f5e; --data:#a78bfa; --dup:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
  .b-BUG{border-left-color:var(--bug)} .t-BUG{background:rgba(244,63,94,.18);color:var(--bug)}
  .b-DATA{border-left-color:var(--data)} .t-DATA{background:rgba(167,139,250,.18);color:var(--data)}
  .b-DUP{border-left-color:var(--dup)} .t-DUP{background:rgba(100,116,139,.22);color:#9fb2c8}
</style>
</head>
<body>
  <h1>PRVS - Enhancement Request Triage</h1>
  <div class="sub">2026-09-26 | nightly runner incremental pass (1 new ER) | vs index.html v1.507 (HEAD 76c75f5) | all 36 unreviewed ERs, grouped by function then LOE/risk | report: docs/ER_TRIAGE_2026-09-26.md</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="BUG">Bugs</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <span class="pill" data-f="DATA">Data</span>
    <span class="pill" data-f="DUP">Dup</span>
    <input id="q" placeholder="Search ERs...">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 // ---- GROUP 1: RO STATUSES & SORT ----
 {id:"44419de9",by:"Lynn",date:"08-12",loe:"S",theme:"1 | RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"New statuses: Need Estimate / Awaiting Estimate / Estimate Declined / Job Declined-Close.",
  verdict:"None of the 4 exist in js/config.js STATUS_PROGRESS_MAP. Each status add hits ~9 hardcoded UI spots + BOTH CHECK constraints (repair_orders + cashiered). Confirm with Lynn which values survive."},
 {id:"972af03c",by:"Lynn",date:"07-17",loe:"S",theme:"1 | RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Add status CANCELED - keep record + notes, never delete.",
  verdict:"Absent. Canonical for declined eb00a68d and dup 611589ba. Add status + color/priority maps; exclude from on-lot and queue counts."},
 {id:"3e746c18",by:"Lynn",date:"08-03",loe:"S",theme:"1 | RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Add status TOTALED OUT.",
  verdict:"Absent (zero totaled/totalled hits). Distinct terminal value; build together with Canceled."},
 {id:"b4db201b",by:"Lynn",date:"09-11",loe:"S",theme:"1 | RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Status NO SHOW - close with no dollar amount and no review sent.",
  verdict:"Behavior half ships via 'Closed - No Charge' (js/config.js L174; no review enqueued). NO SHOW label absent. 20th status + both CHECK twins; ship with the status batch."},
 {id:"611589ba",by:"Lynn",date:"08-24",loe:"DUP",theme:"1 | RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Closed and Canceled in the status dropdown.",
  verdict:"DUPLICATE: Canceled = 972af03c, Closed = 44419de9 Job Declined/Close. Decline with pointer."},
 {id:"d1844e46",by:"Lynn",date:"07-16",loe:"S",theme:"1 | RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Sort board by promised date then oldest-on-lot, Shop Ops pinned top.",
  verdict:"Board sorts on one blended calculatePriority score (js/render.js L30-39); no selectable sort mode. Add strict sort option keeping the shop pin."},
 // ---- GROUP 2: NOTIFICATIONS & TASK-TRACKING ----
 {id:"a03677e6",by:"Brandon",date:"08-07",loe:"S",theme:"2 | Notifications & Task-Tracking",
  desc:"Move machine lines (NOTIFICATION SENT, replies, scheduled) out of RO Status Updates.",
  verdict:"Machine audit lines write as notes type ro_status. CAUTION: Roland reversed a similar retarget for lead notes in v1.491 - confirm target stream."},
 {id:"d7493a3c",by:"Brandon",date:"09-15",loe:"S",theme:"2 | Notifications & Task-Tracking",
  desc:"Get rid of 'NOTIFICATION SENT: Customer reply' lines in RO Status Updates.",
  verdict:"Written by process-scheduled-notifications L186-191 for source inbound_message_notify. Narrow twin of a03677e6 - decide suppress vs retarget once, ship together."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",loe:"L",theme:"2 | Notifications & Task-Tracking",
  desc:"Per-RO TO-DO list w/ daily reminder; items persist until completed.",
  verdict:"Absent: shop_tasks has no ro_id; ro_tasks/task_tracker greps = 0. Needs per-RO tasks table + UI + daily reminder. Spec detail from declined ece91cba."},
 {id:"5925fc01",by:"Lynn",date:"04-09",loe:"L",theme:"2 | Notifications & Task-Tracking",
  desc:"Notify team on every RO update + daily digest with scraped to-dos.",
  verdict:"PARTIAL: digest half ships as send-manager-report. Per-update notify + to-do scraping overlaps af14b3cb - design together."},
 // ---- GROUP 3: RO FIELDS & CARD DISPLAY ----
 {id:"929072dc",by:"Lynn",date:"09-09",loe:"S",theme:"3 | RO Fields & Card Display",
  desc:"Promised and drop dates closer to customer name, large bold text.",
  verdict:"Key-dates row (js/render.js L481-494) sits below badges and parts chips. Hoist under the name and raise size. Superset of 6ff111e7 - ship as one change."},
 {id:"6ff111e7",by:"Lynn",date:"08-27",loe:"S",theme:"3 | RO Fields & Card Display",
  desc:"Enlarge and recolor the drop date on the RO card.",
  verdict:"Drop chip still 0.72rem/700, smallest key date. Render/CSS only; ship with 929072dc."},
 {id:"5dc697e2",by:"Brandon",date:"09-15",loe:"S",theme:"3 | RO Fields & Card Display",
  desc:"Restore RO dollar totals on the front page.",
  verdict:"No regression: chip gated by tileVisibility.dollarValue, false in default Condensed preset (index.html L1636). Workaround Tile View -> Regular; fix = show in Condensed."},
 {id:"5c3b14eb",by:"Brandon",date:"09-16",loe:"S",theme:"3 | RO Fields & Card Display",
  desc:"Click the dollar amount on the card to edit it directly.",
  verdict:"Chip is a plain div. Reuse editField delegation. Caution: dollar_value is a WO roll-up (computeAndSaveWORollup) so manual edits get clobbered. Pair with 5dc697e2."},
 {id:"154e15a3",by:"Bobby",date:"09-09",loe:"S",theme:"3 | RO Fields & Card Display",
  desc:"Recognize and auto-format phone numbers with dashes.",
  verdict:"Matching already strips non-digits (normalisePhone js/utils.js L95). Missing half: input mask on new/edit phone fields."},
 {id:"a195e4ab",by:"Brandon",date:"08-20",loe:"M",theme:"3 | RO Fields & Card Display",
  desc:"Track checks received on an RO (multiple, with amounts/dates).",
  verdict:"Zero check tracking; only single-value hybrid Customer Pay block. Needs per-RO checks table + add/list UI + cashiered mirror."},
 {id:"98a2f2f5",by:"Lynn",date:"09-14",loe:"M",theme:"3 | RO Fields & Card Display",
  desc:"Veteran parts-discount checkbox, always visible near name/address.",
  verdict:"No discount feature. Boolean on repair_orders + cashiered twin + archive_one_ro() rebuild, checkbox in New/Edit, always-on chip. Ask Lynn if it must price parts."},
 // ---- GROUP 4: PARTS ----
 {id:"2af47890",by:"Brandon",date:"08-25",loe:"S",theme:"4 | Parts",
  desc:"Clicking received sets date received to today.",
  verdict:"DB trigger stamps it, but js/parts.js markPartReceived never sets dateReceived client-side so a later form save can null it. Prefer needed over done."},
 {id:"1e434aff",by:"Brandon",date:"08-25",loe:"S",theme:"4 | Parts",
  desc:"Show the received date on the parts status page.",
  verdict:"Manage Parts table has no receipt-date column (js/parts.js L259-267). Depends on 2af47890."},
 {id:"c15727a3",by:"Lynn",date:"09-16",loe:"S",theme:"4 | Parts",
  desc:"Notify requestor when parts status changes to received.",
  verdict:"setPartsStatus (js/parts.js L825-881) notifies on no transition. Hook notify there to cover all 3 received paths."},
 {id:"1fe2707e",by:"Lynn",date:"09-16",loe:"M",theme:"4 | Parts",
  desc:"Requestor approval step for estimate parts between sourcing and ordered.",
  verdict:"parts_status CHECK has no approved value; no gate or notify. Migration + gated Approve action + parts_manager notify."},
 {id:"8d885331",by:"Lynn",date:"04-09",loe:"S",theme:"4 | Parts",
  desc:"Reorder the parts-entry form fields.",
  verdict:"Form unchanged; BLOCKED on Lynn supplying the target layout, not on effort."},
 {id:"b19975d4",by:"Lynn",date:"04-09",loe:"L",theme:"4 | Parts",
  desc:"Parts returned to supplier / warrantied by supplier.",
  verdict:"Partial infra only ('Returned' status + return-deadline input); no RMA/reason/credit flow. Merge into GH#24 Parts Returns."},
 {id:"14f35f95",by:"Lynn",date:"04-09",loe:"XL",theme:"4 | Parts",
  desc:"Parts stock inventory (order 25, use 5, 20 searchable in-house).",
  verdict:"Zero inventory hits; parts are per-RO line items only. New subsystem; needs own spec + Roland go/no-go."},
 // ---- GROUP 5: WORK ORDERS ----
 {id:"2f752d40",by:"Jason",date:"07-21",loe:"S",theme:"5 | Work Orders",
  desc:"WO dollar amount auto-populates from total hours x $195 labor rate.",
  verdict:"woFormDollar and woFormEstHours are independent inputs; no LABOR_RATE constant. Auto-fill respecting the dollarLocked gate."},
 {id:"4354157b",by:"Bobby",date:"09-14",loe:"M",theme:"5 | Work Orders",
  desc:"Add sublet line to service silo.",
  verdict:"Zero 'sublet' hits. Either an outside-vendor line on a silo WO (service_tasks has no vendor/cost column) or a 9th Sublet silo (js/config.js SERVICE_SILOS + silo CHECK). Ask Bobby which."},
 {id:"109c094f",by:"Bobby",date:"09-25",loe:"DUP",theme:"5 | Work Orders",
  desc:"NEW: need to add a line in the service silo that says Sublet.",
  verdict:"DUPLICATE of 4354157b (same submitter). Re-verified at v1.507: still zero 'sublet' hits; SERVICE_SILOS has 8 silos. Decline with pointer."},
 // ---- GROUP 6: CHECK-IN ----
 {id:"6bb61db2",by:"Riley",date:"07-22",loe:"S",theme:"6 | Check-In / Time Clock",
  desc:"Compact-view clock in/out button + clocked-in indicator at login (all layouts).",
  verdict:"Compact actions row has no check-in button; no clocked-into indicator. CANONICAL spec (folds in e06d747e)."},
 {id:"e06d747e",by:"Riley",date:"04-10",loe:"S",theme:"6 | Check-In / Time Clock",
  desc:"Tech check-in float for ease of access.",
  verdict:"Underspecified; almost certainly the same ask as 6bb61db2 - fold in and build once."},
 // ---- GROUP 7: CUSTOMER MGMT ----
 {id:"0e172b2c",by:"Sofia",date:"07-16",loe:"M",theme:"7 | Customer / Account Management",
  desc:"Merge duplicate customer accounts created under different spellings.",
  verdict:"js/duplicates.js merges only same-base-RO-id groups; different spellings never detected. Needs name/phone similarity + verify-then-merge."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",loe:"M",theme:"7 | Customer / Account Management",
  desc:"Archive quote-only customers/units that never moved forward.",
  verdict:"Only archive path is cashiered. Largely solved by Group 1 Canceled status - decide if a board filter / soft-archive is still needed."},
 // ---- GROUP 8: RAF / E-SIGN ----
 {id:"5fec3eca",by:"Sofia",date:"07-15",loe:"S",theme:"8 | RAF / E-Signature",
  desc:"Show customer address on the emailed RAF copy.",
  verdict:"raf_copy branch of send-quote-email has no customerAddress. Edge-fn deploy, no dashboard release."},
 {id:"0448de62",by:"Sofia",date:"06-11",loe:"L",theme:"8 | RAF / E-Signature",
  desc:"Send the authorization form remotely for e-signature.",
  verdict:"Signing is kiosk-only. Needs tokenized public signing page + delivery + signed-form storage."},
 // ---- GROUP 9: BOARD FILTERS / MISC UI ----
 {id:"bb1b62f6",by:"Brandon",date:"09-22",loe:"S",theme:"9 | Board Filters / Misc UI",
  desc:"Days-on-lot filter should also support under N days.",
  verdict:"Filter is >= only (index.html L1247-1256, js/render.js L169-173). Add max bound; reset it in Clear Filters paths."},
 // ---- GROUP 10: STRATEGIC ----
 {id:"ed1b873e",by:"Roland",date:"06-07",loe:"XL",theme:"10 | Strategic / Needs Roland",
  desc:"Replace per-seat Google-email auth (~$500/mo) with database auth.",
  verdict:"Auth is Google-token end-to-end (js/auth.js + One Tap + signInWithIdToken; kiosk same path). Dedicated design session."},
 {id:"47428f75",by:"Lynn",date:"08-03",loe:"S",theme:"10 | Strategic / Needs Roland",
  desc:"'Update vacation/sick/personal calendar' - underspecified.",
  verdict:"time-off.html already has all three types, calendar, per-row edit, partial-day windows. ASK LYNN what is wrong or wanted."}
];

const order = [...new Set(ERS.map(e=>e.theme))];
const counts = {BUG:0,S:0,M:0,L:0,XL:0,DATA:0,DUP:0};
ERS.forEach(e=>counts[e.loe]++);
document.getElementById('stats').innerHTML =
  `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Unreviewed ERs</div></div>
   <div class="stat"><div class="n" style="color:var(--bug)">${counts.BUG}</div><div class="l">Bugs</div></div>
   <div class="stat"><div class="n" style="color:var(--s)">${counts.S}</div><div class="l">Small</div></div>
   <div class="stat"><div class="n" style="color:var(--m)">${counts.M}</div><div class="l">Medium</div></div>
   <div class="stat"><div class="n" style="color:var(--l)">${counts.L}</div><div class="l">Large</div></div>
   <div class="stat"><div class="n" style="color:var(--xl)">${counts.XL}</div><div class="l">XL</div></div>
   <div class="stat"><div class="n" style="color:var(--data)">${counts.DATA+counts.DUP}</div><div class="l">Data / Dup</div></div>`;

let filter='all', q='';
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  order.forEach(theme=>{
    const items=ERS.filter(e=>e.theme===theme)
      .filter(e=>filter==='all'||e.loe===filter)
      .filter(e=>!q||JSON.stringify(e).toLowerCase().includes(q));
    if(!items.length) return;
    const h=document.createElement('div'); h.className='theme'; h.textContent=theme; list.appendChild(h);
    items.forEach(e=>{
      const d=document.createElement('div'); d.className=`er b-${e.loe}`;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p><span class="tag t-${e.loe}">${e.loe}</span></div>
        <div class="meta">${e.id} | ${e.by} | 2026-${e.date}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
}
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); filter=p.dataset.f; render();
});
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();render();};
render();
</script>
</body>
</html>
