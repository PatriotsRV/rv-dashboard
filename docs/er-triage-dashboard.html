<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS - Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
</style>
</head>
<body>
  <h1>PRVS - Enhancement Request Triage</h1>
  <div class="sub">2026-08-02 - headless nightly runner - incremental pass vs index.html v1.487 (HEAD 7e8fadc) - 23 open Needed ERs, plus 2 open bugs tracked in docs/ER_TRIAGE_2026-08-02.md (d4d0eeba scroll-to-RO, d94a418a reversed RO Status lines)</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <input id="q" placeholder="Search ERs...">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 {id:"1c7f1410",by:"Andrew",date:"07-16",cat:"Messaging",loe:"S",theme:"Messaging & Texting",
  desc:"Attach media - photos or VIDEO - to customer messages.",
  verdict:"The photo/PDF half shipped (S151b/S158) but the video half did not. js/messaging.js input#msgAttach accepts only image/*,application/pdf (L219) and _handleAttachPick branches solely on isPdf before compressing (L313-314); grep for 'video' across js/messaging.js and messages.html returns zero hits. Add video/* accept, skip compression, keep the 5MB MMS cap."},
 {id:"9aab7550",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & Texting",
  desc:"Highlight new messages that have not been checked yet.",
  verdict:"Partial on messages.html v1.17: a small gold .unread-dot renders per conversation (CSS L334) but only when last_direction is 'inbound' AND status is 'open', and there is no row-level highlight. Add a stronger unread treatment (bold row / tinted background) and widen the condition so a closed-then-reopened thread also flags."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & Texting",
  desc:"Rescale the conversation list so the text is easier to read.",
  verdict:"Confirmed still absent on messages.html v1.17: the page uses fixed rem font sizes with no user text-size control - grep for font-scale / fontScale / textSize across js, html and css returns zero hits. Add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & Texting",
  desc:"Add a clear (x) button to the messaging search bar.",
  verdict:"Confirmed still absent on messages.html v1.17: convoSearch (L469) is a plain text input with no clear affordance - its only sibling control is the New-conversation button (L470) and the field is reset only programmatically. Add a clear button that empties the search and re-runs the filter."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & Texting",
  desc:"Remove the redundant 'Added to every send' signature footer under every chat.",
  verdict:"Valid, still present on desktop: js/messaging.js refreshSignaturePreview (L241) writes 'Added to every send:' into #msgSigPreview and shows it (element L222, text L246, display L247) on both surfaces. messages.html hides it only inside the max-width:760px mobile media query (rule L430, query opens L417), so desktop messages.html and the RO-card composer still show it. Remove it or collapse it behind a toggle in all viewports; the signature itself keeps sending."},
 {id:"0448de62",by:"Sofia",date:"06-11",cat:"E-Sign",loe:"L",theme:"Messaging & E-Sign",
  desc:"Send the authorization form remotely for e-signature.",
  verdict:"Confirmed still absent on v1.487: signing is kiosk-only (customer-checkin.html on-device signature pad) and the raf_copy branch of supabase/functions/send-quote-email (L386) only emails a copy after signing; grep for signing_token / remote_sign / signature_request / signing_link across js and supabase returns nothing. Needs a tokenized public signing page, a delivery path and signed-form storage. Pairs naturally with the SMS channel."},
 {id:"972af03c",by:"Lynn",date:"07-17",cat:"RO Status",loe:"S",theme:"RO Fields & Status",
  desc:"Add a CANCELED status - keep the record, do not delete it, so the notes survive.",
  verdict:"Confirmed still absent on v1.487: there is no Canceled / Cancelled RO status - js/config.js STATUS_PROGRESS_MAP (L151-163) and js/render.js ALL_STATUSES (L741-745) plus statusColorMap (L727-739) all end at Delivered/Cashed Out. Add a Canceled status plus color/priority maps, exclude it from the on-lot and queue counts, and keep the record for notes. Pairs with 5fbfa299."},
 {id:"50175fce",by:"Lynn",date:"07-27",cat:"RO Management",loe:"S",theme:"RO Fields & Status",
  desc:"Move the urgent-update INPUT to the bottom of the tile instead of inside Edit RO.",
  verdict:"Valid and confirmed absent on v1.487: urgent_update is writable only from the New/Edit RO forms (js/ro-crud.js L414 create, L491 edit, repopulate L1107) and the card banner is read-only - js/render.js L324 even titles it 'change it via Edit RO'. Add an inline edit-in-place control at the tile bottom reusing the existing editField / notify path so it still fires urgent_update_notify (js/ro-crud.js L370). Follow-on to ER a7d1474e."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",cat:"RO Management",loe:"M",theme:"RO Fields & Status",
  desc:"Archive customers/units that were only ever quoted and never moved forward.",
  verdict:"Confirmed still absent on v1.487: the only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase L658, archived_at L692 into cashiered_child_archives); grep for archived / abandoned in js/render.js and js/config.js returns zero hits, so there is no soft-archive flag, status or board filter for quoted-but-never-progressed units. Needs a flag, a board filter and an un-archive path. Pairs with 972af03c."},
 {id:"0e172b2c",by:"Sofia",date:"07-16",cat:"Data Integrity",loe:"M",theme:"RO Fields & Status",
  desc:"Merge duplicate customer accounts (Steve Hubert / Huebert) with a verify-which-is-correct step.",
  verdict:"Partial, re-verified on v1.487: js/duplicates.js has an RO-level merge/delete engine (getBaseROId L35, findDuplicateGroups L40, executeDupeMerge) but it groups strictly on the PRVS-XXXX-XXXX base RO id (regex L36, grouping L44-46), so two ROs created under different spellings of the same customer are never detected. Needs name/phone account dedup plus a verify step. The one-off cleanup for the live case is ER 3f254929 (Data bucket)."},
 {id:"5fec3eca",by:"Sofia",date:"07-15",cat:"Notif/Email",loe:"S",theme:"Notifications & Task-Tracking",
  desc:"Show the customer's address on the emailed copy of the authorization form.",
  verdict:"Confirmed still absent on v1.487: the raf_copy branch of supabase/functions/send-quote-email (L386) destructures to / cc / customerName / roId / signedDate / rv / services / workType / phone / customerType / serviceDesc / warrantyDesc / promisedDate / signatureDataUrl with no customerAddress; the address appears only in the lead_staff_notify branch (L549, HTML L674, text L748). Add customerAddress to the raf_copy payload and both templates."},
 {id:"5925fc01",by:"Lynn",date:"04-09",cat:"Notif/Digest",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Notify the right team on every RO update; daily list of all in-progress jobs with to-dos scraped from the status notes.",
  verdict:"PARTIAL, re-verified on v1.487. The daily in-progress digest half ships as supabase/functions/send-manager-report, and single-event notifies exist (service_added_notify js/work-orders.js L293; urgent_update_notify js/ro-crud.js L370). Still absent: notify-on-every-RO-update and to-do scraping from status notes - grep for ro_tasks / task_tracker / customer_task across js and supabase returns zero code hits. Anchor of this theme; pairs with af14b3cb."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",cat:"Task-Tracking",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Per-customer task tracker with a daily reminder; each task stays on the list until marked complete.",
  verdict:"Confirmed still absent on v1.487: js/shop-tasks.js is a non-customer shop checklist with no ro_id / customer link and no reminder column, and grep for ro_tasks / customer_task / task_tracker across js and supabase returns zero hits. Needs a per-RO tasks table, an add/complete UI and a daily open-task reminder. Pairs with 5925fc01."},
 {id:"8d885331",by:"Lynn",date:"04-09",cat:"Parts",loe:"S",theme:"Parts & Inventory",
  desc:"Rework the parts-entry screen field order (move fields around).",
  verdict:"Parts-entry form exists and is unchanged on v1.487: js/parts.js pf_supplier L181, pf_partName L190, pf_qty L200, pf_status L204, pf_serviceSilo L208, pf_returnDeadline L226. The ask is only to reorder those fields, which is quick once Lynn supplies the target layout or a mockup. BLOCKED on detail, not on effort."},
 {id:"b19975d4",by:"Lynn",date:"04-09",cat:"Parts",loe:"L",theme:"Parts & Inventory",
  desc:"Track parts returned to the supplier and parts warrantied by the supplier.",
  verdict:"Partial infra only, re-verified on v1.487: js/config.js PART_STATUSES (L200) includes 'Returned' and js/parts.js has a Return Deadline input (pf_returnDeadline L226), but a word-boundary grep for rma / return_reason / supplier_credit across js and supabase returns zero hits - no RMA number, return reason, supplier credit or reverse-direction flow. Equals GH#24 Shop Ops Phase 2. Canonical for declined duplicate 86bbaf50."},
 {id:"14f35f95",by:"Lynn",date:"04-09",cat:"Parts",loe:"XL",theme:"Parts & Inventory",
  desc:"In-house parts inventory: order a box of 25, use 5, remaining 20 go to stock - listed as available, priced, and searchable.",
  verdict:"Confirmed still absent on v1.487: grep for inventory / on_hand / in_stock / stock_qty across js, supabase/migrations and supabase/functions returns zero code hits (docs only). Parts remain per-RO line items only (js/parts.js). New subsystem needed: inventory table, receive/consume/adjust flows, a searchable priced stock view, and links from the parts-request path. Largest item on the board."},
 {id:"29654af7",by:"Lynn",date:"07-06",cat:"Navigation",loe:"S",theme:"Board & Navigation UX",
  desc:"Button that jumps back to the top of the page / the search bar after scrolling to a tile.",
  verdict:"Confirmed still absent on v1.487: grep for backToTop / back-to-top / scroll-to-top / scrollToTop across index.html, js and css returns nothing, and the only window.scrollTo calls in the repo are closed-ros.html L765 and customer-checkin.html L1289; the board has only targeted scrollIntoView calls. Add a scroll-triggered back-to-top / jump-to-search control, ideally present in the sidebar layout too. Canonical for duplicate 2b78696c."},
 {id:"d1844e46",by:"Lynn",date:"07-16",cat:"Board Sort",loe:"S",theme:"Board & Navigation UX",
  desc:"Sort the dashboard by promised date then oldest on lot, keeping PRVS Shop Operations pinned to the top.",
  verdict:"Confirmed still absent on v1.487: js/render.js renderBoard sorts on the single blended calculatePriority score (L30-39) with the shop-ops pin at L34-36; grep for sortBy / sortSelect / sortMode finds only closed-ros.html and solar.html, never the main board, so there is no selectable strict promised-date-then-oldest-on-lot order. Add the strict sort option while keeping the shop pin. Related to 1aeb3f58, which delivered only the promised-date chip."},
 {id:"d432863a",by:"Brandon",date:"07-21",cat:"General UI/UX",loe:"S",theme:"Board & Navigation UX",
  desc:"Make the browser tab icon the Patriots logo so the dashboard stands out among open tabs.",
  verdict:"Confirmed still absent on v1.487: grep for favicon / rel=icon / apple-touch-icon across all repo *.html files returns zero hits (only release notes and CLAUDE_CONTEXT.md mention the 404), so every tab shows the generic browser icon. Add a Patriots-logo favicon plus apple-touch-icon to each page head - logo.png already ships in the repo but needs resizing to icon dimensions."},
 {id:"e06d747e",by:"Riley",date:"04-10",cat:"Time Clock",loe:"S",theme:"Time Clock & Check-In",
  desc:"Tech check-in 'float' for ease of access.",
  verdict:"Confirmed still absent on v1.487: no floating or sticky tech check-in control in index.html or checkin.html, and js/render.js compact-col-actions (L228-235) offers edit / parts / WO / notify / message / schedule only, with no check-in button. UNDERSPECIFIED - scope the target page and the exact behavior with the submitter. Pairs with 6bb61db2."},
 {id:"6bb61db2",by:"Riley",date:"07-22",cat:"Time Clock",loe:"S",theme:"Time Clock & Check-In",
  desc:"Check in / out button on the compact view, plus a live reminder at login of which unit you are clocked into.",
  verdict:"Confirmed still absent on v1.487: js/render.js compact-col-actions (L228-235) has edit / parts / WO / notify / message / schedule but no check-in-out button, and grep for 'clocked in' / 'clocked into' / activeTimeLog across index.html, js/render.js and js/time-tracking.js returns nothing. Add a compact check-in/out action plus a login-time active-time_log banner shown across views. Pairs with e06d747e."},
 {id:"2f752d40",by:"Jason",date:"07-21",cat:"Work Orders",loe:"S",theme:"Work Orders",
  desc:"Auto-populate the work-order dollar amount from total hours at the posted $195/hr labor rate.",
  verdict:"Confirmed still absent on v1.487: js/work-orders.js has independent manual inputs woFormDollar (L360) and woFormEstHours (L365), read separately on save (L649-650), with no labor-rate arithmetic anywhere - grep for LABOR_RATE / laborRate / labor_rate in the module returns zero hits (js/insurance.js laborRate is the per-claim INSURANCE rate, not the posted shop rate). Auto-populate dollar_value = effective hours x $195/hr, respecting the dollarLocked readonly gate (L324)."},
 {id:"ed1b873e",by:"Roland",date:"06-07",cat:"Auth",loe:"XL",theme:"Auth & Cost",
  desc:"Replace Google-email authentication (~$25/user/mo, nearing $500/mo) with a database-specific auth model.",
  verdict:"Confirmed still Google-based on v1.487: js/auth.js imports GOOGLE_CONFIG from js/config.js (L69), initialises gapi with it (L202-204) and signs in via google.accounts One Tap (initialize L978, prompt L568, v1.486 renderButton fallback L541) plus signInWithIdToken (L999, L1176); the kiosk uses the same path. Swapping to Supabase password / magic-link or shared role accounts would drop roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Roland wants to scope this together."},
];

const ORDER={XL:0,L:1,M:2,S:3};
let activeFilter="all", query="";

function renderStats(){
  const c={XL:0,L:0,M:0,S:0};
  ERS.forEach(e=>c[e.loe]++);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Open ERs (all Needed)</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--xl)">${c.XL}</div><div class="l">XL - new subsystem</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--l)">${c.L}</div><div class="l">L - multi-session</div></div>`+
    `<div class="stat"><div class="n" style="color:#7fb0ff">${c.M}</div><div class="l">M - half to 1 session</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--s)">${c.S}</div><div class="l">S - under 2h*</div></div>`;
}
function renderList(){
  const list=document.getElementById('list'); list.innerHTML="";
  const q=query.toLowerCase();
  const shown=ERS.filter(e=>{
    if(activeFilter!=="all"&&e.loe!==activeFilter) return false;
    if(q){const blob=(e.id+e.by+e.cat+e.desc+e.verdict+e.theme).toLowerCase(); if(!blob.includes(q)) return false;}
    return true;
  });
  const themes=[...new Set(shown.map(e=>e.theme))];
  themes.forEach(th=>{
    const h=document.createElement('div'); h.className="theme"; h.textContent=th; list.appendChild(h);
    shown.filter(e=>e.theme===th).sort((a,b)=>ORDER[a.loe]-ORDER[b.loe]).forEach(e=>{
      const d=document.createElement('div'); d.className="er b-"+e.loe;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p>
        <span class="tag t-${e.loe}">LOE ${e.loe}</span></div>
        <div class="meta">${e.id} - ${e.by} - ${e.date} - ${e.cat}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
  if(!shown.length) list.innerHTML='<div class="sub">No ERs match.</div>';
}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); activeFilter=p.dataset.f; renderList();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; renderList();});
renderStats(); renderList();
</script>
</body>
</html>
