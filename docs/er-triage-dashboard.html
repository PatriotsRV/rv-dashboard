<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS - Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e; --bug:#f43f5e; --data:#a78bfa; --dup:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
  .b-BUG{border-left-color:var(--bug)} .t-BUG{background:rgba(244,63,94,.18);color:var(--bug)}
  .b-DATA{border-left-color:var(--data)} .t-DATA{background:rgba(167,139,250,.18);color:var(--data)}
  .b-DUP{border-left-color:var(--dup)} .t-DUP{background:rgba(100,116,139,.22);color:#9fb2c8}
</style>
</head>
<body>
  <h1>PRVS - Enhancement Request Triage</h1>
  <div class="sub">2026-09-23 | nightly runner incremental pass (1 new ER) | vs index.html v1.507 (HEAD 76c75f5) | all 35 unreviewed ERs, grouped by function then LOE/risk | report: docs/ER_TRIAGE_2026-09-23.md</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="BUG">Bugs</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <span class="pill" data-f="DATA">Data</span>
    <span class="pill" data-f="DUP">Dup</span>
    <input id="q" placeholder="Search ERs...">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 // ---- GROUP 1: RO STATUSES & SORT ----
 {id:"44419de9",by:"Lynn",date:"08-12",loe:"S",theme:"1 - RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"New statuses: Need Estimate / Awaiting Estimate / Estimate Declined / Job Declined-Close.",
  verdict:"None of the 4 exist. Each status add hits the hardcoded UI set + BOTH CHECK constraints (repair_orders + cashiered). Confirm with Lynn whether all 4 survive or some collapse with Canceled / Closed - No Charge."},
 {id:"972af03c",by:"Lynn",date:"07-17",loe:"S",theme:"1 - RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Add status CANCELED - keep record + notes, never delete.",
  verdict:"Absent. Canonical for Canceled (eb00a68d declined into it; 611589ba folds in). Exclude from on-lot and queue counts."},
 {id:"3e746c18",by:"Lynn",date:"08-03",loe:"S",theme:"1 - RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Add status TOTALED OUT.",
  verdict:"Absent (zero totaled/totalled hits). Distinct terminal value; build together with Canceled."},
 {id:"b4db201b",by:"Lynn",date:"09-11",loe:"S",theme:"1 - RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Status NO SHOW - close with no dollar amount and no review sent.",
  verdict:"Behavior already ships via 'Closed - No Charge' (js/config.js L174; no-dollar gate js/ro-crud.js L929/L1344; review only on Delivered/Cashed Out). NO SHOW label absent. Ship with the status batch."},
 {id:"d1844e46",by:"Lynn",date:"07-16",loe:"S",theme:"1 - RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Sort board by promised date then oldest-on-lot, Shop Ops pinned top.",
  verdict:"Board sorts on one blended calculatePriority score (js/render.js L30-39); no selectable sort mode exists. Needs a sort-mode control."},
 {id:"611589ba",by:"Lynn",date:"08-24",loe:"DUP",theme:"1 - RO Statuses & Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Closed and Canceled statuses in the dropdown.",
  verdict:"DUPLICATE: Canceled = 972af03c, Closed = 44419de9 Job Declined/Close. Recommend declined with pointer once approved."},
 // ---- GROUP 2: NOTES SEPARATION & TASKS ----
 {id:"a03677e6",by:"Brandon",date:"08-07",loe:"S",theme:"2 - RO Card: Notes Separation & Task Tracking",
  desc:"Move machine lines (NOTIFICATION SENT, replies, scheduled) out of RO Status Updates.",
  verdict:"Machine audit lines write as notes type ro_status and crowd the box. CAUTION: Roland reversed a similar retarget in v1.491 - confirm target stream first. Ship with d7493a3c."},
 {id:"d7493a3c",by:"Brandon",date:"09-15",loe:"S",theme:"2 - RO Card: Notes Separation & Task Tracking",
  desc:"Remove 'NOTIFICATION SENT: Customer reply' lines from RO Status Updates.",
  verdict:"Written by process-scheduled-notifications L186-191 for the inbound_message_notify source (textly-webhook L719-737). Skip or retarget for that source. Narrow twin of a03677e6."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",loe:"L",theme:"2 - RO Card: Notes Separation & Task Tracking",
  desc:"Per-RO TO-DO list w/ daily reminder; items persist until completed.",
  verdict:"Absent: shop_tasks has no ro_id. Needs per-RO tasks table + add/complete UI + daily reminder. ece91cba (declined) is the spec input."},
 {id:"5925fc01",by:"Lynn",date:"04-09",loe:"L",theme:"2 - RO Card: Notes Separation & Task Tracking",
  desc:"Notify team on every RO update + daily digest with scraped to-dos.",
  verdict:"PARTIAL: digest half ships as send-manager-report. Remaining half overlaps the af14b3cb task tracker - design together."},
 // ---- GROUP 3: RO FIELDS ----
 {id:"154e15a3",by:"Bobby",date:"09-09",loe:"S",theme:"3 - RO Fields & Data Capture",
  desc:"Recognize and auto-format dashed phone numbers.",
  verdict:"Matching already strips non-digits (normalisePhone js/utils.js L95). Format half absent: phone inputs are bare type=tel. Shared input mask."},
 {id:"a195e4ab",by:"Brandon",date:"08-20",loe:"M",theme:"3 - RO Fields & Data Capture",
  desc:"Track checks received on an RO (multiple, with amounts/dates).",
  verdict:"Zero check/payment tracking; only single-value Customer Pay block. Needs a small payments design - decide shape with Roland."},
 {id:"98a2f2f5",by:"Lynn",date:"09-14",loe:"M",theme:"3 - RO Fields & Data Capture",
  desc:"Veteran parts-discount checkbox near name/address, always visible.",
  verdict:"No veteran/discount feature. Needs column + cashiered twin + archive_one_ro rebuild, New/Edit checkbox, always-on card chip. Ask Lynn if it must price parts."},
 // ---- GROUP 4: CARD DISPLAY ----
 {id:"929072dc",by:"Lynn",date:"09-09",loe:"S",theme:"4 - RO Card: Key Dates & Dollar Display",
  desc:"Promised + Drop dates closer to customer name, large bold text.",
  verdict:"Key-dates row (js/render.js L481-494) sits below badges/parts chips at 0.72-0.78rem. Hoist under name + enlarge. Superset of 6ff111e7."},
 {id:"6ff111e7",by:"Lynn",date:"08-27",loe:"S",theme:"4 - RO Card: Key Dates & Dollar Display",
  desc:"Drop date: bigger font and a more visible color.",
  verdict:"v1.498 recolor not enough; new size ask. Drop chip 0.72rem vs Promised 0.78rem. Ship with 929072dc."},
 {id:"5dc697e2",by:"Brandon",date:"09-15",loe:"S",theme:"4 - RO Card: Key Dates & Dollar Display",
  desc:"Restore RO dollar totals on the front of the card.",
  verdict:"Not a regression: chip (js/render.js L442-446) hidden by default Condensed preset (index.html L1636). Show in Condensed. Workaround: Tile View -> Regular."},
 {id:"5c3b14eb",by:"Brandon",date:"09-16",loe:"S",theme:"4 - RO Card: Key Dates & Dollar Display",
  desc:"Click the card dollar amount to edit it directly.",
  verdict:"Chip is a plain div. Reuse edit-field delegation. Caution: WO roll-up (work-orders.js L750-761) overwrites manual edits. Pair with 5dc697e2."},
 // ---- GROUP 5: PARTS ----
 {id:"2af47890",by:"Brandon",date:"08-25",loe:"S",theme:"5 - Parts & Inventory",
  desc:"Stamp date received when a part is clicked Received.",
  verdict:"DB trigger stamps, but markPartReceived (js/parts.js L449-478) never sets dateReceived client-side; later form save can null it. Set it client-side."},
 {id:"1e434aff",by:"Brandon",date:"08-25",loe:"S",theme:"5 - Parts & Inventory",
  desc:"Show received date in the parts status table.",
  verdict:"Manage Parts table has no receipt-date column (js/parts.js L259-267). Render dateReceived beside Received. Depends on 2af47890."},
 {id:"c15727a3",by:"Lynn",date:"09-16",loe:"S",theme:"5 - Parts & Inventory",
  desc:"Notify requester when parts status goes Received.",
  verdict:"setPartsStatus (js/parts.js L825-881) notifies on no transition. Hook notify inside it to cover all 3 received paths; needs ro.requestedByEmail."},
 {id:"8d885331",by:"Lynn",date:"04-09",loe:"S",theme:"5 - Parts & Inventory",
  desc:"Reorder the parts-entry form fields.",
  verdict:"Form unchanged; the ask is a field reorder. BLOCKED on Lynn supplying the target layout, not on effort."},
 {id:"1fe2707e",by:"Lynn",date:"09-16",loe:"M",theme:"5 - Parts & Inventory",
  desc:"Sourced-parts approval step that notifies the parts manager to order.",
  verdict:"No approved state between sourcing and ordered (CHECK L25). Migration + gated Approve action + parts_manager notify."},
 {id:"b19975d4",by:"Lynn",date:"04-09",loe:"L",theme:"5 - Parts & Inventory",
  desc:"Parts returned to supplier / warrantied by supplier.",
  verdict:"Partial infra only ('Returned' status + return-deadline input); no RMA/reason/credit flow. Merge into GH#24 Phase 2 Parts Returns."},
 {id:"14f35f95",by:"Lynn",date:"04-09",loe:"XL",theme:"5 - Parts & Inventory",
  desc:"Parts stock inventory (order 25, use 5, 20 searchable in-house).",
  verdict:"Zero inventory hits repo-wide. New subsystem: inventory table + receive/consume/adjust + search. Needs own spec + Roland go/no-go."},
 // ---- GROUP 6: WORK ORDERS ----
 {id:"2f752d40",by:"Jason",date:"07-21",loe:"S",theme:"6 - Work Orders",
  desc:"WO dollar amount auto-populates from total hours x $195 labor rate.",
  verdict:"woFormDollar and woFormEstHours are independent manual inputs; no LABOR_RATE constant. Add config constant + editable auto-fill."},
 {id:"4354157b",by:"Bobby",date:"09-14",loe:"M",theme:"6 - Work Orders",
  desc:"Add sublet line to service silo.",
  verdict:"'sublet' is zero hits. Either an outside-vendor line on the WO (service_tasks has no vendor/cost) or a 9th Sublet silo. Ask Bobby which."},
 // ---- GROUP 7: CHECK-IN ----
 {id:"6bb61db2",by:"Riley",date:"07-22",loe:"S",theme:"7 - Check-In / Time Clock",
  desc:"Compact-view clock in/out button + clocked-in indicator at login (all layouts).",
  verdict:"Compact actions row has no check-in button; no clocked-into indicator. CANONICAL spec for this theme (folds in e06d747e)."},
 {id:"e06d747e",by:"Riley",date:"04-10",loe:"S",theme:"7 - Check-In / Time Clock",
  desc:"Tech check-in float for ease of access.",
  verdict:"Underspecified; almost certainly the same ask as 6bb61db2 - fold in and build once."},
 // ---- GROUP 8: CUSTOMER MGMT ----
 {id:"0e172b2c",by:"Sofia",date:"07-16",loe:"M",theme:"8 - Customer / Account Management",
  desc:"Merge duplicate customer accounts created under different spellings.",
  verdict:"js/duplicates.js merges only same-base-RO-id groups. Needs name/phone-similarity detection + verify-then-merge."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",loe:"M",theme:"8 - Customer / Account Management",
  desc:"Archive quote-only customers/units that never moved forward.",
  verdict:"Only archive path is cashiered. Partly covered by 'Closed - No Charge' + Group 1 Canceled - decide if a soft-archive is still needed."},
 // ---- GROUP 9: RAF / E-SIGN ----
 {id:"5fec3eca",by:"Sofia",date:"07-15",loe:"S",theme:"9 - RAF / E-Signature",
  desc:"Show customer address on the emailed RAF copy.",
  verdict:"raf_copy branch of send-quote-email has no customerAddress in payload or template. Edge-fn deploy, no dashboard release."},
 {id:"0448de62",by:"Sofia",date:"06-11",loe:"L",theme:"9 - RAF / E-Signature",
  desc:"Send the authorization form remotely for e-signature.",
  verdict:"Signing is kiosk-only. Needs tokenized public signing page + delivery + signed-form storage."},
 // ---- GROUP 10: MISC UI ----
 {id:"bb1b62f6",by:"Brandon",date:"09-22",loe:"S",theme:"10 - Misc UI Quick Wins",
  desc:"NEW: days-on-lot filter for 'under N days'.",
  verdict:"Board filter is >= only (index.html #daysOnLotFilter L1247-1256, applyDaysFilter L3777; js/render.js L169-173); no max bound anywhere, Work Planner min-only too (js/planner.js L276/L790). Add max input or >=/<= toggle; reset in Clear Filters paths."},
 // ---- GROUP 11: STRATEGIC ----
 {id:"ed1b873e",by:"Roland",date:"06-07",loe:"XL",theme:"11 - Strategic / Needs Roland",
  desc:"Replace per-seat Google-email auth (~$500/mo) with database auth.",
  verdict:"Auth is Google-token end-to-end (js/auth.js + One Tap + signInWithIdToken; kiosk same path). Swap touches auth, RLS identity, kiosk. Dedicated design session."},
 {id:"47428f75",by:"Lynn",date:"08-03",loe:"S",theme:"11 - Strategic / Needs Roland",
  desc:"'Update vacation/sick/personal calendar' - underspecified.",
  verdict:"time-off.html already has all three types, calendar, stats, edit, partial-day windows. ASK LYNN what is wrong or wanted."}
];

const order = [...new Set(ERS.map(e=>e.theme))];
const counts = {BUG:0,S:0,M:0,L:0,XL:0,DATA:0,DUP:0};
ERS.forEach(e=>counts[e.loe]++);
document.getElementById('stats').innerHTML =
  `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Unreviewed ERs</div></div>
   <div class="stat"><div class="n" style="color:var(--bug)">${counts.BUG}</div><div class="l">Bugs</div></div>
   <div class="stat"><div class="n" style="color:var(--s)">${counts.S}</div><div class="l">Small</div></div>
   <div class="stat"><div class="n" style="color:var(--m)">${counts.M}</div><div class="l">Medium</div></div>
   <div class="stat"><div class="n" style="color:var(--l)">${counts.L}</div><div class="l">Large</div></div>
   <div class="stat"><div class="n" style="color:var(--xl)">${counts.XL}</div><div class="l">XL</div></div>
   <div class="stat"><div class="n" style="color:var(--data)">${counts.DATA+counts.DUP}</div><div class="l">Data / Dup</div></div>`;

let filter='all', q='';
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  order.forEach(theme=>{
    const items=ERS.filter(e=>e.theme===theme)
      .filter(e=>filter==='all'||e.loe===filter)
      .filter(e=>!q||JSON.stringify(e).toLowerCase().includes(q));
    if(!items.length) return;
    const h=document.createElement('div'); h.className='theme'; h.textContent=theme; list.appendChild(h);
    items.forEach(e=>{
      const d=document.createElement('div'); d.className=`er b-${e.loe}`;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p><span class="tag t-${e.loe}">${e.loe}</span></div>
        <div class="meta">${e.id} | ${e.by} | 2026-${e.date}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
}
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); filter=p.dataset.f; render();
});
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();render();};
render();
</script>
</body>
</html>
