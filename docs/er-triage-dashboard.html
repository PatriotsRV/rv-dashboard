<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS — Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e; --bug:#f43f5e; --data:#a78bfa; --dup:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
  .b-BUG{border-left-color:var(--bug)} .t-BUG{background:rgba(244,63,94,.18);color:var(--bug)}
  .b-DATA{border-left-color:var(--data)} .t-DATA{background:rgba(167,139,250,.18);color:var(--data)}
  .b-DUP{border-left-color:var(--dup)} .t-DUP{background:rgba(100,116,139,.22);color:#9fb2c8}
</style>
</head>
<body>
  <h1>PRVS — Enhancement Request Triage</h1>
  <div class="sub">2026-08-29 | nightly runner, incremental pass (1 new ER) | vs index.html v1.502 + messages v1.24 (HEAD 505e22b) | all 30 unreviewed ERs, grouped by function then LOE/risk | ZERO open bugs | report: docs/ER_TRIAGE_2026-08-29.md</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="BUG">Bugs</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <span class="pill" data-f="DATA">Data</span>
    <span class="pill" data-f="DUP">Dup</span>
    <input id="q" placeholder="Search ERs…">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 // ---- GROUP 0: BUGS ---- none open. 225a2535 / d94a418a / 5ca724ff / d4d0eeba shipped v1.497; 09084bc5 shipped v1.494.
 // ---- GROUP 1: RO STATUSES & SORT ----
 {id:"44419de9",by:"Lynn",date:"08-12",loe:"S",theme:"1 - RO Statuses and Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"New statuses: Need Estimate / Awaiting Estimate / Estimate Declined / Job Declined-Close.",
  verdict:"None of the 4 exist; canonical set is js/config.js STATUS_PROGRESS_MAP L151-164. Each add hits ~9 hardcoded UI spots (index.html select L7038-7051, filter btns L1085-1096, render.js statusColorMap L727-739, ALL_STATUSES L741-745) PLUS both DB CHECKs or saves throw 23514. Overlaps 972af03c - confirm scope with Lynn."},
 {id:"972af03c",by:"Lynn",date:"07-17",loe:"S",theme:"1 - RO Statuses and Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Add status CANCELED - keep record + notes, never delete.",
  verdict:"Absent: STATUS_PROGRESS_MAP L151-171 ends at Delivered/Cashed Out; the only 'cancelled' hits are the scheduled_notifications and review_requests CHECKs. Add status + color/priority maps, exclude from on-lot and queue counts. Canonical for eb00a68d and half of 611589ba."},
 {id:"3e746c18",by:"Lynn",date:"08-03",loe:"S",theme:"1 - RO Statuses and Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Add status TOTALED OUT.",
  verdict:"Absent: case-insensitive grep for totaled/totalled across js/config.js and js/render.js returns zero hits. Distinct terminal value from Canceled, but ONE build should add both and exclude both from the queue / on-lot counts (js/render.js L656-658, L718-721)."},
 {id:"d1844e46",by:"Lynn",date:"07-16",loe:"S",theme:"1 - RO Statuses and Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Sort board by promised date then oldest-on-lot, Shop Ops pinned top.",
  verdict:"Board sorts on one blended calculatePriority score (js/render.js L30-39, shop pin L35-37); grep for sortBy/sortSelect/sortMode finds nothing. Needs a selectable strict sort mode with the shop pin preserved. Related to 1aeb3f58, which delivered only the promised-date chip."},
 {id:"611589ba",by:"Lynn",date:"08-24",loe:"DUP",theme:"1 - RO Statuses and Board Sort - ship as ONE batch (both DB CHECK twins! S172 lesson)",
  desc:"Need a status of Closed and Canceled in the drop-down.",
  verdict:"DUPLICATE - both halves are already open ERs: CANCELED is 972af03c, Closed is 44419de9's JOB DECLINED/CLOSE. Re-verified absent (config L151-171, index.html select L7262-7281, render.js ALL_STATUSES L790-797). Adds no new work item; ships with the status batch. STILL unreviewed in the DB - recommend declined with a pointer."},
 // ---- GROUP 2: NOTES SEPARATION & TASKS ----
 {id:"a03677e6",by:"Brandon",date:"08-07",loe:"S",theme:"2 - RO Card: Notes Separation and Task Tracking",
  desc:"Move machine lines (NOTIFICATION SENT, replies, scheduled) out of RO Status Updates.",
  verdict:"Machine audit lines write as notes type ro_status and crowd the box (js/render.js L553); customer_comm already renders separately (L563). Sources: process-scheduled-notifications L187/L215, index.html L3116/L3154, js/ro-crud.js L302/L344/L379/L571/L582, js/parts.js L654/L855. CAUTION: Roland reversed this retarget for lead notes in v1.491 - confirm scope."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",loe:"L",theme:"2 - RO Card: Notes Separation and Task Tracking",
  desc:"Per-RO TO-DO list w/ daily reminder; items persist until completed.",
  verdict:"Absent: js/shop-tasks.js has no ro_id and no reminder column; greps for ro_tasks / customer_task / task_tracker across js, index.html and supabase return zero hits. Needs a per-RO tasks table + add/complete UI + daily open-task reminder. ece91cba supplies the spec (bulleted, anyone adds/checks, notate who and when)."},
 {id:"5925fc01",by:"Lynn",date:"04-09",loe:"L",theme:"2 - RO Card: Notes Separation and Task Tracking",
  desc:"Notify team on every RO update + daily digest with scraped to-dos.",
  verdict:"PARTIAL: the daily in-progress digest half ships as supabase/functions/send-manager-report, and single-event notifies exist (service_added_notify js/work-orders.js L293; urgent_update_notify js/ro-crud.js L374). Still absent: notify-on-every-update and to-do scraping. Anchor of this theme; design with af14b3cb."},
 // ---- GROUP 3: RO FIELDS & CARD READABILITY ----
 {id:"a195e4ab",by:"Brandon",date:"08-20",loe:"M",theme:"3 - RO Fields and Card Readability",
  desc:"Track checks received on an RO (multiple, with amounts/dates).",
  verdict:"Zero check tracking: grep check_number / checkNumber / payments = 0 hits. Only capture is the one-value hybrid-RO-only Customer Pay block (index.html L7203-7246 / L7782-7804), method Check but no check number, one amount + datePaid, saved flat into insurance_data JSONB and never on the card. Needs a per-RO checks table + add/list UI + cashiered mirror."},
 {id:"6ff111e7",by:"Lynn",date:"08-27",loe:"S",theme:"3 - RO Fields and Card Readability",
  desc:"Enlarge and re-color the drop date on the RO card - too small and too hard to see.",
  verdict:"Prefer needed over done: fa35e3df already recolored the Drop chip #0a84ff -> #5cadff in v1.498, but Lynn filed this 5 days AFTER that shipped and adds a NEW size ask. At HEAD 505e22b js/render.js L468 still renders Drop at 0.72rem/700, smallest of the three key dates, vs Promised L469 at 0.78rem/800. Render/CSS only."},
 // ---- GROUP 4: MESSAGES POLISH ----
 {id:"472ccadb",by:"Andrew",date:"08-28",loe:"S",theme:"4 - Messages UX Polish - one messages-v1.25 batch",
  desc:"NEW - Drag a thumbnail into a conversation to send it (e.g. the aerial parking view).",
  verdict:"NEWLY TRIAGED. Confirmed absent at HEAD 505e22b (messages.html v1.24): the composer has only a hidden file input plus paperclip click (js/messaging.js msgAttach L347, initComposerExtras L491-494) and _handleAttachPick reads ev.target.files (L422); a repo-wide grep for dragover / dragenter / drop / dataTransfer.files hits only js/work-list.js L430 and js/work-orders.js L485 row-reorder. Small: a drop zone handing e.dataTransfer.files to the existing upload path (compression, 5MB MMS cap, 5-attachment cap and video-as-link split all come free). ASK ANDREW whether the thumbnail is an OS file or an in-app RO photo - the in-app variant needs draggable thumbnails plus a URL-reuse path and is M, not S."},
 {id:"ca0f7ed9",by:"Brandon",date:"08-03",loe:"S",theme:"4 - Messages UX Polish - one messages-v1.25 batch",
  desc:"Auto-populate lead info from the dashboard when the customer already exists.",
  verdict:"renderLeadInfo (messages.html L1389) reads ONLY the conversation's own columns (c.rv, c.service_type), so an existing dashboard customer shows 'No RV or service type captured yet'. selectConversation already computes phone-matched live ROs as linked for renderContactInfo but calls renderLeadInfo(c) without them (L1744). Pass linked, fall back to RO rv."},
 {id:"9aab7550",by:"Brandon",date:"07-21",loe:"S",theme:"4 - Messages UX Polish - one messages-v1.25 batch",
  desc:"Make unread conversations much more visible.",
  verdict:"Still partial on messages.html v1.24. S166 added a MANUAL 'Mark unread' button (markConversationUnread L1980), but the visual treatment is unchanged: a single 8px gold .unread-dot (CSS L469) applied only when last_direction is inbound AND status is open (L1313, rendered L1319), with no row-level highlight. Add a bold/tinted unread row."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",loe:"S",theme:"4 - Messages UX Polish - one messages-v1.25 batch",
  desc:"Clear (x) button in the conversation search.",
  verdict:"Absent: convoSearch (messages.html L604) is a plain text input with no clear affordance, reset only programmatically (L1151, L1170). Add a clear button that empties the search and re-runs the filter."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",loe:"S",theme:"4 - Messages UX Polish - one messages-v1.25 batch",
  desc:"Remove the redundant 'Added to every send' signature preview.",
  verdict:"Still present on desktop: js/messaging.js refreshSignaturePreview (L369) writes it into #msgSigPreview (element L350, set L374); messages.html hides it only inside the mobile max-width media query (L565), so desktop and the RO-card composer still show it. Remove or collapse behind a toggle in all viewports; the signature keeps sending."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",loe:"S",theme:"4 - Messages UX Polish - one messages-v1.25 batch",
  desc:"Rescale conversation-list text for readability.",
  verdict:"Absent: fixed rem font sizes with no user text-size control - grep for font-scale / fontScale / textSize across js, html and css returns zero hits. Add a persisted font-scale control for the conversation list."},
 // ---- GROUP 5: PARTS ----
 {id:"2af47890",by:"Brandon",date:"08-25",loe:"S",theme:"5 - Parts and Inventory",
  desc:"Clicking Received on a part should stamp the received date automatically.",
  verdict:"Prefer needed over done. DB half ships: trigger trg_stamp_date_received (stamp_date_received_on_parts.sql L33-36) stamps date_received on the transition into Received. Client half missing: js/parts.js markPartReceived (L449-478) sets part.status only, never part.dateReceived, so a later savePartForm edit resends date_received null (L539) and the trigger will not restamp (OLD.status already Received) - wiping the date."},
 {id:"1e434aff",by:"Brandon",date:"08-25",loe:"S",theme:"5 - Parts and Inventory",
  desc:"Show the received date on the parts status page.",
  verdict:"Absent: the Manage Parts table has no receipt-date column - headers are Part Name / Part # / Supplier / Status / Qty / Wholesale / Retail / Quick / Actions (js/parts.js L259-267) and renderPartsRows (L121-145) prints no p.dateReceived; the value is only editable in the collapsed Add/Edit Part form (pf_dateReceived L242). DEPENDS on 2af47890 landing the stamp first."},
 {id:"8d885331",by:"Lynn",date:"04-09",loe:"S",theme:"5 - Parts and Inventory",
  desc:"Reorder the parts-entry form fields.",
  verdict:"Form exists and is unchanged (js/parts.js pf_supplier L181, pf_partName L190, pf_serviceSilo L208, pf_returnDeadline L226). The ask is only a field reorder, quick once Lynn supplies the target layout or a mockup. BLOCKED on detail, not on effort."},
 {id:"b19975d4",by:"Lynn",date:"04-09",loe:"L",theme:"5 - Parts and Inventory",
  desc:"Parts returned to supplier / warrantied by supplier.",
  verdict:"Partial infra only: js/config.js PART_STATUSES (L200) includes 'Returned' and js/parts.js has a Return Deadline input (L226), but grep for rma / return_reason / supplier_credit across js and supabase returns zero hits - no RMA number, return reason, supplier credit or reverse-direction flow. Equals GH#24 Shop Ops Phase 2. Canonical for declined duplicate 86bbaf50."},
 {id:"14f35f95",by:"Lynn",date:"04-09",loe:"XL",theme:"5 - Parts and Inventory",
  desc:"Parts stock inventory (order 25, use 5, 20 searchable in-house).",
  verdict:"Absent: word-boundary grep for inventory / on_hand / in_stock / stock_qty across js, supabase/migrations and supabase/functions returns zero hits. Parts remain per-RO line items only (js/parts.js). New subsystem: inventory table, receive/consume/adjust flows, a searchable priced stock view, links from the parts-request path. Largest item on the board."},
 // ---- GROUP 6: WORK ORDERS ----
 {id:"2f752d40",by:"Jason",date:"07-21",loe:"S",theme:"6 - Work Orders",
  desc:"WO dollar amount auto-populates from total hours x $195 labor rate.",
  verdict:"Absent: js/work-orders.js has independent manual inputs woFormDollar (L360) and woFormEstHours (L365), read separately on save (L649-650), and grep for LABOR_RATE / laborRate / labor_rate in the module returns zero hits (js/insurance.js laborRate L212 is the per-claim INSURANCE rate). Auto-populate dollar_value = effective hours x $195/hr, respecting the dollarLocked gate (L324)."},
 // ---- GROUP 7: CHECK-IN ----
 {id:"6bb61db2",by:"Riley",date:"07-22",loe:"S",theme:"7 - Check-In / Time Clock",
  desc:"Compact-view clock in/out button + clocked-in indicator at login (all layouts).",
  verdict:"Absent: js/render.js compact-col-actions (L228-235) has edit / parts / WO / notify / message / schedule but no check-in-out button, and grep for 'clocked in' / 'clocked into' / activeTimeLog across index.html, js/render.js and js/time-tracking.js returns nothing. CANONICAL spec for this theme (folds in e06d747e)."},
 {id:"e06d747e",by:"Riley",date:"04-10",loe:"S",theme:"7 - Check-In / Time Clock",
  desc:"Tech check-in float for ease of access.",
  verdict:"Absent: no floating or sticky tech check-in control in index.html or checkin.html, and the compact actions row offers no check-in button. Underspecified - almost certainly the same ask as 6bb61db2. Fold in and build once."},
 // ---- GROUP 8: CUSTOMER MGMT ----
 {id:"0e172b2c",by:"Sofia",date:"07-16",loe:"M",theme:"8 - Customer / Account Management",
  desc:"Merge duplicate customer accounts created under different spellings.",
  verdict:"Partial: js/duplicates.js has an RO-level merge/delete engine (getBaseROId L35, findDuplicateGroups L40, executeDupeMerge) but it groups strictly on the PRVS-XXXX-XXXX base RO id (regex L36, keying L44), so two ROs under different spellings of the same customer are never detected. Needs name/phone account dedup plus a verify-which-is-correct merge step. The one-off cleanup was 3f254929 (applied)."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",loe:"M",theme:"8 - Customer / Account Management",
  desc:"Archive quote-only customers/units that never moved forward.",
  verdict:"Absent: the only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase L662); case-insensitive grep for archived / abandoned in js/render.js and js/config.js returns zero hits. Needs a soft-archive flag, a board filter and an un-archive path. Largely solved by Group 1's Canceled status - decide whether the status alone is enough first."},
 // ---- GROUP 9: RAF / E-SIGN ----
 {id:"5fec3eca",by:"Sofia",date:"07-15",loe:"S",theme:"9 - RAF / E-Signature",
  desc:"Show customer address on the emailed RAF copy.",
  verdict:"Absent: the raf_copy branch of supabase/functions/send-quote-email (L387) destructures to / cc / customerName / roId / signedDate / rv / services / workType / phone / customerType / serviceDesc / warrantyDesc / promisedDate / signatureDataUrl with no customerAddress; the address appears only in the lead_staff_notify branch. Add customerAddress to the payload and both templates. Edge-fn deploy, no release."},
 {id:"0448de62",by:"Sofia",date:"06-11",loe:"L",theme:"9 - RAF / E-Signature",
  desc:"Send the authorization form remotely for e-signature.",
  verdict:"Absent: signing is kiosk-only (customer-checkin.html on-device signature pad) and the raf_copy branch (L386) only emails a copy after signing; grep for signing_token / remote_sign / signature_request / signing_link across js, supabase and the HTML pages returns nothing. Needs a tokenized public signing page, a delivery path and signed-form storage. Pairs with the S166 short-link machinery."},
 // ---- GROUP 11: STRATEGIC ----
 {id:"ed1b873e",by:"Roland",date:"06-07",loe:"XL",theme:"11 - Strategic / Needs Roland",
  desc:"Replace per-seat Google-email auth (~$500/mo) with database auth.",
  verdict:"Still Google-based: js/auth.js imports GOOGLE_CONFIG from js/config.js (L69), initialises gapi with it (L203-204) and signs in via google.accounts One Tap plus signInWithIdToken; the kiosk uses the same path. Swapping to Supabase password / magic-link or shared role accounts drops roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Dedicated design session."},
 {id:"47428f75",by:"Lynn",date:"08-03",loe:"S",theme:"11 - Strategic / Needs Roland",
  desc:"'Update vacation/sick/personal calendar' - underspecified.",
  verdict:"UNDERSPECIFIED - no stated defect or target. time-off.html already has all three types, a color-coded month calendar, stats tiles, per-row Edit (L752 / editRequest, ER ee50d11c) and exact partial-day windows (modalStartTime L368, modalEndTime L372). Filed Needed not Done because the ask maps to no gap without Lynn's detail; if it restates ee50d11c it is already delivered. ASK LYNN."}
];

const order = [...new Set(ERS.map(e=>e.theme))];
const counts = {BUG:0,S:0,M:0,L:0,XL:0,DATA:0,DUP:0};
ERS.forEach(e=>counts[e.loe]++);
document.getElementById('stats').innerHTML =
  `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Unreviewed ERs</div></div>
   <div class="stat"><div class="n" style="color:var(--bug)">${counts.BUG}</div><div class="l">Bugs</div></div>
   <div class="stat"><div class="n" style="color:var(--s)">${counts.S}</div><div class="l">Small</div></div>
   <div class="stat"><div class="n" style="color:var(--m)">${counts.M}</div><div class="l">Medium</div></div>
   <div class="stat"><div class="n" style="color:var(--l)">${counts.L}</div><div class="l">Large</div></div>
   <div class="stat"><div class="n" style="color:var(--xl)">${counts.XL}</div><div class="l">XL</div></div>
   <div class="stat"><div class="n" style="color:var(--data)">${counts.DATA+counts.DUP}</div><div class="l">Data / Dup</div></div>`;

let filter='all', q='';
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  order.forEach(theme=>{
    const items=ERS.filter(e=>e.theme===theme)
      .filter(e=>filter==='all'||e.loe===filter)
      .filter(e=>!q||JSON.stringify(e).toLowerCase().includes(q));
    if(!items.length) return;
    const h=document.createElement('div'); h.className='theme'; h.textContent=theme; list.appendChild(h);
    items.forEach(e=>{
      const d=document.createElement('div'); d.className=`er b-${e.loe}`;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p><span class="tag t-${e.loe}">${e.loe}</span></div>
        <div class="meta">${e.id} · ${e.by} · 2026-${e.date}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
}
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); filter=p.dataset.f; render();
});
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();render();};
render();
</script>
</body>
</html>
