<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS — Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
</style>
</head>
<body>
  <h1>PRVS — Enhancement Request Triage</h1>
  <div class="sub">2026-07-26 | nightly headless runner (Phase 2a) | full re-pass vs index.html v1.483 | 24 open ERs = 21 Needed + 2 Bugs (still present, listed first) + 1 Data fix | 83 of 84 rows re-triaged | report: docs/ER_TRIAGE_2026-07-26.md</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <input id="q" placeholder="Search ERs…">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 {id:"9031e101",by:"Riley Scott",date:"07-21",cat:"Work List",loe:"S",theme:"BUGS - still present, fix first",
  desc:"BUG: tapping a unit in the Work List on iPhone does not take you to the right unit.",
  verdict:"Still present in v1.483, severity small (mobile navigation, no data risk). js/work-list.js L328 calls scrollToROInBoard (index.html L4079), which only scans already-rendered .ro-card[data-ro-index] / .ro-card-compact[data-ro-index] nodes and matches on ro._supabaseId. If the RO is filtered off the board it falls through to a 'RO not visible' toast with a Clear Filters action instead of navigating. Same root cause as d4d0eeba - fix both as one patch: clear filters, re-render, then scroll to the tapped RO."},
 {id:"d4d0eeba",by:"Brandon Dillon",date:"07-22",cat:"Navigation",loe:"S",theme:"BUGS - still present, fix first",
  desc:"BUG: tracking is broken when clicking an RO in my list, or an RO link in Messages.",
  verdict:"Still present in v1.483, severity small (navigation, no data risk), two paths. Work-list path is the same root cause as 9031e101. Messages path: the ro-chip link is index.html?ro=&lt;ro_id&gt; and js/qr.js handleDeepLink (L198) returns SILENTLY when the RO is not in currentFilteredData (L207) or has no rendered card (L210), so the chip just looks broken. Fix both: clear filters, re-render, then scroll and highlight. Inside the Phase 2b auto-fix rails."},
 {id:"3f254929",by:"Sofia Pedroza",date:"07-16",cat:"Data fix",loe:"S",theme:"DATA FIX - SQL for Roland, nothing was run",
  desc:"Correct spelling is Steve Huebert, not Hubert; delete the wrong account.",
  verdict:"Data correction, no code change. Inspect first: SELECT id,ro_id,customer_name,status FROM repair_orders WHERE customer_name ILIKE '%ubert%'; then, once the wrong id is confirmed by eye: UPDATE repair_orders SET deleted_at=now() WHERE id='&lt;wrong-id&gt;'; This runner executed nothing. The account-merge FEATURE Sofia also asks for is the separate ER 0e172b2c (Needed/M)."},
 {id:"0448de62",by:"Sofia Pedroza",date:"06-11",cat:"Auth form",loe:"L",theme:"Messaging & e-sign",
  desc:"Send an authorization form remotely for e-signature.",
  verdict:"Confirmed still absent in v1.483: signing is kiosk-only (customer-checkin.html on-device signature pad) and send-quote-email raf_copy only emails a copy after signing; grep for signing_token / esign / remote_sign across supabase/ and js/*.js returns nothing. Needs a tokenized public signing page + delivery + signed-form storage. Now pairs naturally with the Textly SMS channel."},
 {id:"9aab7550",by:"Brandon Dillon",date:"07-21",cat:"Messages",loe:"S",theme:"Messaging & e-sign",
  desc:"Leave a highlight so new, unchecked messages are more clearly visible.",
  verdict:"Partial: messages.html renders a gold .unread-dot per conversation (CSS L260, markup L879) but only when last_direction is inbound AND status is open (L873), and there is no row-level highlight. Small: add a stronger unread treatment (bold row / tinted background) and widen the condition so a closed-then-reopened thread also flags."},
 {id:"21fc3a9d",by:"Brandon Dillon",date:"07-21",cat:"Messages",loe:"S",theme:"Messaging & e-sign",
  desc:"Rescale the conversation list so the text is easier to read.",
  verdict:"Confirmed still absent in v1.483: messages.html uses fixed rem font sizes with no user text-size control (grep font-scale / fontScale / textSize / zoom: none). Small: add a persisted font-scale control for the conversation list."},
 {id:"f1e6e311",by:"Brandon Dillon",date:"07-21",cat:"Messages",loe:"S",theme:"Messaging & e-sign",
  desc:"Add a button to clear the name faster in the messaging search bar.",
  verdict:"Confirmed still absent in v1.483: messages.html convoSearch (L395) is a plain text input, cleared only programmatically (L788/L806). Small: add a clear (x) button that resets the search and re-runs the filter (L845 / L1597 input handler)."},
 {id:"6e9ca4dc",by:"Brandon Dillon",date:"07-21",cat:"Messages",loe:"S",theme:"Messaging & e-sign",
  desc:"Get rid of the redundant 'Added to every send' line at the bottom of every chat.",
  verdict:"Valid, still present on desktop: js/messaging.js refreshSignaturePreview (L241-246) renders 'Added to every send:' into #msgSigPreview (L222) under the composer on both surfaces. messages.html already hides it, but only under @media (max-width:760px) (L356, for space) - so desktop messages.html and the RO-card composer still show it. Small: remove it or collapse it behind a toggle in all viewports."},
 {id:"14f35f95",by:"Lynn Titel-Shepard",date:"04-09",cat:"Parts",loe:"XL",theme:"Parts & Inventory",
  desc:"In-house parts inventory: order a box of 25, use 5, remaining 20 go to searchable priced stock.",
  verdict:"Confirmed still absent in v1.483: no inventory / on_hand / in_stock / stock_qty symbol anywhere in js/*.js or supabase/migrations; parts remain per-RO line items only (js/parts.js). New subsystem: inventory table + receive/consume/adjust + searchable priced stock + parts-request links. Largest item on the board."},
 {id:"b19975d4",by:"Lynn Titel-Shepard",date:"04-09",cat:"Parts",loe:"L",theme:"Parts & Inventory",
  desc:"Track a part that needs to be returned to the supplier or warrantied by the supplier.",
  verdict:"Partial infra only, re-verified: js/config.js PART_STATUSES (L200) includes 'Returned' and js/parts.js has pf_returnDeadline, but there is no RMA number, return reason, credit tracking or reverse-direction flow anywhere in js/*.js or supabase/migrations. Equals GH#24 Shop Ops Phase 2. Canonical for the declined dup 86bbaf50."},
 {id:"8d885331",by:"Lynn Titel-Shepard",date:"04-09",cat:"Parts",loe:"S",theme:"Parts & Inventory",
  desc:"Rework the field order on the parts-entry / ordering screen.",
  verdict:"Parts-entry form exists and is unchanged (js/parts.js pf_supplier / pf_partName / pf_qty / pf_status / pf_serviceSilo etc., L181-235); the ask is only to reorder those fields. Quick once Lynn supplies the target layout or a mockup. BLOCKED on detail, not on effort."},
 {id:"0e172b2c",by:"Sofia Pedroza",date:"07-16",cat:"RO fields",loe:"M",theme:"RO fields/status",
  desc:"Merge duplicate customer accounts after asking the customer which record is correct.",
  verdict:"Partial, re-verified: js/duplicates.js has an RO-level merge/delete engine (getBaseROId L35 / findDuplicateGroups L40 / openDuplicateManager L51 / executeDupeMerge) but it groups by base RO id, not customer identity, so a misspelled-name second RO is never detected. Needs name/phone account dedup plus a verify-which-is-correct merge step. The one-off data cleanup for this case is 3f254929."},
 {id:"5fbfa299",by:"Brandon Dillon",date:"06-30",cat:"RO fields",loe:"M",theme:"RO fields/status",
  desc:"Archive customers or units that were only quoted and never moved forward.",
  verdict:"Confirmed still absent in v1.483: the only archive path is the cashiered one (js/ro-crud.js archiveROInSupabase, archived_at L692 -> cashiered_child_archives); there is no archived/abandoned flag, status or board filter for quoted-but-never-progressed units. Needs a soft-archive flag + a board filter + an un-archive path. Pairs with 972af03c."},
 {id:"972af03c",by:"Lynn Titel-Shepard",date:"07-17",cat:"RO status",loe:"S",theme:"RO fields/status",
  desc:"Add status CANCELED - keep the record, do not delete it, so the notes survive.",
  verdict:"Confirmed still absent in v1.483: no Canceled/Cancelled RO status - js/config.js STATUS_PROGRESS_MAP and js/render.js ALL_STATUSES both end at Delivered/Cashed Out. The only 'cancelled' hits (js/ro-crud.js L291/L516, index.html L2815/L3011) are scheduled_notifications rows, not RO status. Small: add the status + color/priority maps, exclude it from on-lot and queue counts, keep the record for notes. Pairs with 5fbfa299."},
 {id:"5925fc01",by:"Lynn Titel-Shepard",date:"04-09",cat:"Notif/Digest",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Notify the right team on every RO update; daily list of in-progress jobs with to-dos scraped from status notes.",
  verdict:"Partial, re-verified v1.483: the daily in-progress digest is served by supabase/functions/send-manager-report and single-event notifies exist (service_added_notify, urgent_update_notify), but there is still no notify-on-every-RO-update and no to-do scraping from status notes. Anchor of the Notifications/Task-Tracking initiative."},
 {id:"af14b3cb",by:"Lynn Titel-Shepard",date:"05-21",cat:"Task-Tracking",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Per-customer task tracker with a daily reminder; each task stays on the list until marked complete.",
  verdict:"Confirmed still absent in v1.483: js/shop-tasks.js is a non-customer shop checklist with no ro_id / customer link and no reminder column, and no per-RO tasks table exists in supabase/migrations (grep ro_tasks / customer_task / task_tracker: none). Needs a per-RO tasks table + add/complete UI + a daily open-task reminder. Pairs with 5925fc01."},
 {id:"5fec3eca",by:"Sofia Pedroza",date:"07-15",cat:"Email content",loe:"S",theme:"Notifications & Task-Tracking",
  desc:"Show the customer's address on the emailed copy of the authorization form.",
  verdict:"Confirmed still absent in v1.483: the raf_copy branch of supabase/functions/send-quote-email destructures to/cc/customerName/roId/signedDate/rv/services/workType/phone/customerType/serviceDesc/warrantyDesc/promisedDate/signatureDataUrl at L387 - no customerAddress; the address is emitted only by the lead_staff_notify branch (L549/674/748). Small: add customerAddress to the raf_copy payload plus its HTML and text templates."},
 {id:"d1844e46",by:"Lynn Titel-Shepard",date:"07-16",cat:"Board sort",loe:"S",theme:"Board view & navigation",
  desc:"Sort the dash by promised date then oldest on lot, keeping PRVS shop operations pinned to the top.",
  verdict:"Confirmed still absent in v1.483: the board sorts on one blended calculatePriority score (js/render.js L33) with the shop-ops pin at L35-37, but there is no selectable strict promised-date-then-oldest-on-lot sort (grep sortBy / sortSelect / sortMode: none). Small: add the strict sort option while keeping the shop pin."},
 {id:"29654af7",by:"Lynn Titel-Shepard",date:"07-06",cat:"Navigation",loe:"S",theme:"Board view & navigation",
  desc:"A button that takes you back to the top of the page / the search bar after scrolling.",
  verdict:"Confirmed still absent in v1.483: no window.scrollTo, back-to-top or backToTop control in index.html or js/*.js - only targeted scrollIntoView calls. Small: a scroll-triggered back-to-top / jump-to-search button, ideally also in the sidebar layout (css/sidebar-layout.css)."},
 {id:"d432863a",by:"Brandon Dillon",date:"07-21",cat:"Branding",loe:"S",theme:"Board view & navigation",
  desc:"Make the browser tab icon the Patriots logo so the tab stands out.",
  verdict:"Confirmed still absent in v1.483: no favicon, rel=icon or apple-touch-icon in any of the 13 *.html files, so every tab shows the generic browser icon. Small: add a Patriots-logo favicon + apple-touch-icon to each page head."},
 {id:"e06d747e",by:"Riley Scott",date:"04-10",cat:"Time Clock",loe:"S",theme:"Time clock",
  desc:"Tech check-in 'float' for ease of access.",
  verdict:"Confirmed still absent in v1.483: no floating or sticky tech check-in control in index.html or checkin.html, and js/render.js compact-col-actions (L228-235) offers edit/parts/WO/notify/message/schedule only - no check-in button. Underspecified: scope the page and behavior with the submitter. Pairs with 6bb61db2, which specifies most of it."},
 {id:"6bb61db2",by:"Riley Scott",date:"07-22",cat:"Time Clock",loe:"S",theme:"Time clock",
  desc:"Check-in/out button on the compact view, plus a live reminder of which unit you are clocked into at login.",
  verdict:"Confirmed still absent in v1.483: js/render.js compact-col-actions (L228-235) has edit / parts / WO / notify / message / schedule but no check-in-out button, and no persistent 'clocked into X' indicator exists in index.html or js/*.js. Small: add a compact check-in/out action plus a login-time active time_log banner across views. Pairs with e06d747e."},
 {id:"2f752d40",by:"Jason Rubin",date:"07-21",cat:"Work Orders",loe:"S",theme:"Work Orders",
  desc:"Auto-populate the work-order dollar amount from total hours x the posted $195/hr labor rate.",
  verdict:"Confirmed still absent in v1.483: js/work-orders.js has independent manual inputs woFormDollar (L360) and woFormEstHours (L365), read separately on save (L649-650), with no labor-rate arithmetic anywhere (no LABOR_RATE / 195 constant). Small: auto-populate dollar_value = effective hours x $195/hr (task est_hours rollup when present, else WO-level), with an editable override and respect for the existing dollarLocked readonly gate."},
 {id:"ed1b873e",by:"Roland Shepard Jr",date:"06-07",cat:"Auth/Cost",loe:"XL",theme:"Auth & cost",
  desc:"Replace Google-email auth (~$25/mo per seat, nearing $500/mo; most staff never use the email) with database-specific auth.",
  verdict:"Confirmed still Google-based in v1.483: js/auth.js imports GOOGLE_CONFIG from js/config.js and signs in via google.accounts One Tap + signInWithIdToken (GROUP D, L449+); the check-in kiosk too. Swapping to Supabase password/magic-link or shared role accounts would drop roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Roland wants to scope this together."},
];

const ORDER={XL:0,L:1,M:2,S:3};
let activeFilter="all", query="";

function renderStats(){
  const c={XL:0,L:0,M:0,S:0};
  ERS.forEach(e=>c[e.loe]++);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Open ERs (all Needed)</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--xl)">${c.XL}</div><div class="l">XL — new subsystem</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--l)">${c.L}</div><div class="l">L — multi-session</div></div>`+
    `<div class="stat"><div class="n" style="color:#7fb0ff">${c.M}</div><div class="l">M — ½–1 session</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--s)">${c.S}</div><div class="l">S — under 2h*</div></div>`;
}
function renderList(){
  const list=document.getElementById('list'); list.innerHTML="";
  const q=query.toLowerCase();
  const shown=ERS.filter(e=>{
    if(activeFilter!=="all"&&e.loe!==activeFilter) return false;
    if(q){const blob=(e.id+e.by+e.cat+e.desc+e.verdict+e.theme).toLowerCase(); if(!blob.includes(q)) return false;}
    return true;
  });
  const themes=[...new Set(shown.map(e=>e.theme))];
  themes.forEach(th=>{
    const h=document.createElement('div'); h.className="theme"; h.textContent=th; list.appendChild(h);
    shown.filter(e=>e.theme===th).sort((a,b)=>ORDER[a.loe]-ORDER[b.loe]).forEach(e=>{
      const d=document.createElement('div'); d.className="er b-"+e.loe;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p>
        <span class="tag t-${e.loe}">LOE ${e.loe}</span></div>
        <div class="meta">${e.id} · ${e.by} · ${e.date} · ${e.cat}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
  if(!shown.length) list.innerHTML='<div class="sub">No ERs match.</div>';
}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); activeFilter=p.dataset.f; renderList();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; renderList();});
renderStats(); renderList();
</script>
</body>
</html>
