<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRVS — Enhancement Request Triage</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111c30; --panel2:#0e1626; --line:#1e2d45;
    --text:#e6edf7; --muted:#8aa0bd; --accent:#3b82f6;
    --xl:#ef4444; --l:#f59e0b; --m:#3b82f6; --s:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
  h1{font-size:1.5rem;margin:0 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:1.9rem;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:.8rem;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  input#q{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
  .theme{margin:20px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .er{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .er .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .er .desc{font-weight:600;margin:0}
  .er .meta{color:var(--muted);font-size:.76rem;margin-top:3px}
  .er .verdict{font-size:.82rem;margin-top:7px;color:#cdd9ec}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .b-XL{border-left-color:var(--xl)} .t-XL{background:rgba(239,68,68,.16);color:var(--xl)}
  .b-L{border-left-color:var(--l)} .t-L{background:rgba(245,158,11,.16);color:var(--l)}
  .b-M{border-left-color:var(--m)} .t-M{background:rgba(59,130,246,.18);color:#7fb0ff}
  .b-S{border-left-color:var(--s)} .t-S{background:rgba(34,197,94,.16);color:var(--s)}
</style>
</head>
<body>
  <h1>PRVS — Enhancement Request Triage</h1>
  <div class="sub">2026-07-25 - headless nightly runner - incremental pass vs index.html v1.481 - 24 open Needed ERs shown (plus 2 confirmed bugs + 1 data fix: see docs/ER_TRIAGE_2026-07-25.md)</div>

  <div class="cards" id="stats"></div>

  <div class="controls">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="XL">XL</span>
    <span class="pill" data-f="L">L</span>
    <span class="pill" data-f="M">M</span>
    <span class="pill" data-f="S">S</span>
    <input id="q" placeholder="Search ERs…">
  </div>

  <div id="list"></div>

<script>
const ERS = [
 {id:"d62a26e4",by:"Roland",date:"07-24",cat:"Messaging",loe:"S",theme:"Messaging & e-sign",
  desc:"Attach more than one photo/document to a customer message (today only one can be selected).",
  verdict:"Confirmed: exactly one attachment is possible - input#msgAttach (js/messaging.js L208) has no 'multiple' and accepts image/* only, _msgAttachment is a single {url,name} (L192), and send posts media_url: _msgAttachment.url (L434). The backend is already ready: textly-send v1.1 accepts an array and maps it to Textable media[] (L127-171), and inbound render already handles media_url arrays (L93). Front-end only: multi-select input + per-file chips + array payload."},
 {id:"9aab7550",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & e-sign",
  desc:"Highlight new / not-yet-checked messages more clearly in the conversation list.",
  verdict:"Partial: messages.html renders a gold unread-dot per conversation (L239/L826) but only when last_direction is inbound and status is open, and there is no row-level highlight. Small: add a stronger unread treatment (bold row / tinted background)."},
 {id:"21fc3a9d",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & e-sign",
  desc:"Rescale the conversation list text so it is easier to read.",
  verdict:"Confirmed absent: messages.html uses fixed rem font sizes (html 17.5px) with no user text-size control. Small: add a persisted font-scale / zoom for the conversation list."},
 {id:"f1e6e311",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & e-sign",
  desc:"Add a button to clear the name from the messaging search bar faster.",
  verdict:"Confirmed absent: messages.html convoSearch (L373) is a plain text input and is only cleared programmatically (L735/L753). Small: add a clear (x) button to reset the conversation search."},
 {id:"6e9ca4dc",by:"Brandon",date:"07-21",cat:"Messaging",loe:"S",theme:"Messaging & e-sign",
  desc:"Remove the redundant 'Added to every send' signature line under every chat.",
  verdict:"Valid: js/messaging.js refreshSignaturePreview (L230-235) renders a persistent 'Added to every send:' preview in #msgSigPreview (L211) under the composer, which staff find redundant. Small: remove it or collapse it behind a toggle."},
 {id:"93b00023",by:"Roland",date:"07-24",cat:"Messaging",loe:"M",theme:"Messaging & e-sign",
  desc:"A new inbound message should reopen the conversation, notify the assigned owner once, and remind them at 4:30pm if still unanswered.",
  verdict:"(a) ABSENT: the textly-webhook inbound upsert (L447-452) never sets status, so a closed conversation stays closed and drops out of the default Open filter (messages.html L800); reopen is manual only (L1284). (b) PARTIAL: assigned_inbound_notify exists (L565-621) but dedupes on a 60-minute window, not on the reopening message. (c) ABSENT: no unread / 4:30pm reminder anywhere in supabase/. Needs status=open + a reopened event on inbound, a notify keyed to the reopen, and a 16:30 unread sweep."},
 {id:"0448de62",by:"Sofia",date:"06-11",cat:"Auth form",loe:"L",theme:"Messaging & e-sign",
  desc:"Send an authorization form remotely for e-signature.",
  verdict:"Confirmed absent: signing is kiosk-only (customer-checkin.html on-device signature pad, 30 signature refs) and send-quote-email raf_copy is only a post-signing email; no tokenized signing page or token table exists in supabase/migrations. Needs a public signing page + delivery + signed-form storage."},
 {id:"8d885331",by:"Lynn",date:"04-09",cat:"Parts",loe:"S",theme:"Parts & Inventory",
  desc:"Rework the field order on the parts-entry / ordering screen (move fields around).",
  verdict:"Parts-entry form exists (js/parts.js pf_* fields, L235); the ask is only to reorder fields. Quick once Lynn supplies the target layout/mockup. BLOCKED on detail, not on effort."},
 {id:"b19975d4",by:"Lynn",date:"04-09",cat:"Parts",loe:"L",theme:"Parts & Inventory",
  desc:"Track a part that needs to be returned to the supplier or warrantied by the supplier.",
  verdict:"Partial infra only: js/config.js PART_STATUSES (L200) includes 'Returned', but there is no RMA number, return reason, credit tracking, or reverse-direction flow anywhere in js/*.js. = GH#24 Shop Ops Phase 2 (Parts Returns). Canonical for the declined dup 86bbaf50."},
 {id:"14f35f95",by:"Lynn",date:"04-09",cat:"Parts",loe:"XL",theme:"Parts & Inventory",
  desc:"In-house parts inventory: order a box of 25, use 5, remaining 20 go to stock - listed as available, priced, and searchable.",
  verdict:"Confirmed absent: no inventory/stock/on_hand symbols anywhere in js/*.js; parts are per-RO line items only (js/parts.js). New subsystem: inventory table + receive/consume/adjust flows + searchable priced stock + parts-request links. Largest item on the board."},
 {id:"5fec3eca",by:"Sofia",date:"07-15",cat:"Notif/Email",loe:"S",theme:"Notifications & Task-Tracking",
  desc:"Show the customer's address on the emailed copy of the authorization form.",
  verdict:"Confirmed absent: the raf_copy branch of send-quote-email (L386-387) does not destructure or emit customerAddress; the address appears only in the lead_staff_notify branch (L549/674/748). Small: add customerAddress to the raf_copy payload plus both the HTML and text templates."},
 {id:"af14b3cb",by:"Lynn",date:"05-21",cat:"Task-Tracking",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Per-customer task tracker with a daily reminder; each task stays on the list until marked complete.",
  verdict:"Confirmed absent: js/shop-tasks.js is a non-customer shop checklist with no ro_id/customer link or reminder column, and no per-RO tasks table exists in supabase/migrations. Needs a per-RO tasks table + add/complete UI + a daily open-task reminder. Pairs with 5925fc01."},
 {id:"5925fc01",by:"Lynn",date:"04-09",cat:"Notif/Digest",loe:"L",theme:"Notifications & Task-Tracking",
  desc:"Notify the right team on every RO update; daily comprehensive list of all in-progress jobs with to-dos scraped from status notes.",
  verdict:"Partial: the daily in-progress digest is served by send-manager-report, and single-event notifies exist (service_added_notify, urgent_update_notify), but there is no notify-on-every-RO-update and no to-do scraping from status notes. Anchor of the Notifications/Task-Tracking initiative."},
 {id:"972af03c",by:"Lynn",date:"07-17",cat:"RO status",loe:"S",theme:"RO fields/status",
  desc:"Add a Canceled status - keep the record for notes, do not delete it.",
  verdict:"Confirmed absent: no Canceled/Cancelled anywhere in js/render.js, js/config.js or js/ro-crud.js. Small: add a Canceled status plus color/priority maps, exclude it from the on-lot and queue counts, and keep the record for notes. Pairs with 5fbfa299."},
 {id:"5fbfa299",by:"Brandon",date:"06-30",cat:"RO status",loe:"M",theme:"RO fields/status",
  desc:"Archive customers/units that are only in the system because we quoted them and never moved forward.",
  verdict:"Confirmed absent: only the cashiered archive exists (js/ro-crud.js archiveROInSupabase L646); there is no archived/abandoned flag or filter for quoted-but-never-progressed units and no such status in js/render.js. Pairs with 972af03c (Canceled status)."},
 {id:"0e172b2c",by:"Sofia",date:"07-16",cat:"RO data",loe:"M",theme:"RO fields/status",
  desc:"Merge duplicate customer accounts (misspelled name created a second RO) after asking the customer which is correct.",
  verdict:"Partial: js/duplicates.js has an RO-level merge/delete engine (getBaseROId / findDuplicateGroups / openDuplicateManager / executeDupeMerge) but it groups by base RO id, not customer identity. Needs name/phone account dedup plus a verify-which-is-correct merge. The data cleanup for the live case is 3f254929."},
 {id:"d432863a",by:"Brandon",date:"07-21",cat:"UI polish",loe:"S",theme:"Dashboard UI polish",
  desc:"Make the browser tab icon the Patriots logo so the dashboard stands out among open tabs.",
  verdict:"Confirmed absent: no favicon, rel=icon or apple-touch-icon in any *.html, so every tab shows the generic browser icon. Small: add a Patriots-logo favicon + apple-touch-icon to each page head."},
 {id:"29654af7",by:"Lynn",date:"07-06",cat:"UI polish",loe:"S",theme:"Dashboard UI polish",
  desc:"Button that jumps back to the top of the page / the search bar after scrolling down.",
  verdict:"Confirmed absent: no window.scrollTo or back-to-top control in index.html or js/*.js - only targeted scrollIntoView calls. Small: a scroll-triggered back-to-top / jump-to-search button."},
 {id:"d1844e46",by:"Lynn",date:"07-16",cat:"UI polish",loe:"S",theme:"Dashboard UI polish",
  desc:"Sort the dashboard by promised date then oldest on lot, keeping PRVS Shop Operations pinned to the top.",
  verdict:"Confirmed absent: the board sorts on one blended calculatePriority score (js/render.js L29-36) and shop-ops pinning exists, but there is no selectable strict promised-date-then-oldest-on-lot sort. Small: add the strict sort option while keeping the shop pin."},
 {id:"ac394468",by:"Roland",date:"07-24",cat:"UI polish",loe:"S",theme:"Dashboard UI polish",
  desc:"Add a Messages category to Make-A-Wish - and represent every page in the ER form.",
  verdict:"Confirmed: the Make-A-Wish category select (index.html L7455-7466) has no Messages option and the ER admin filter (L7548+) matches; the genie-lamp modal exists only on index/checkin/analytics/solar/closed-ros/worklist-report, so messages.html, leads.html, time-off.html, review.html and guide.html cannot raise an ER at all. Small: add a Messages category + a messages.html page default (js/enhancement.js L41-46) and put the lamp on every page."},
 {id:"6bb61db2",by:"Riley",date:"07-22",cat:"Time Clock",loe:"S",theme:"Time clock",
  desc:"Check-in/out button on the compact view, plus a live reminder of which unit you are clocked into.",
  verdict:"Confirmed absent: js/render.js compact-col-actions (L228-235) has edit/parts/WO/notify/message/schedule but no check-in-out button, and no persistent 'clocked into X' indicator exists in index.html or js/*.js. Small: add a compact check-in/out action plus a login-time active time_log banner across views. Pairs with e06d747e."},
 {id:"e06d747e",by:"Riley",date:"04-10",cat:"Time Clock",loe:"S",theme:"Time clock",
  desc:"Tech check-in 'float' for ease of access.",
  verdict:"Confirmed absent: no floating/quick tech check-in control in index.html or checkin.html, and js/render.js compact-col-actions (L228) has no check-in button. Still underspecified - scope the page and behavior with the submitter. Pairs with 6bb61db2."},
 {id:"2f752d40",by:"Jason",date:"07-21",cat:"Work Orders",loe:"S",theme:"Work Orders",
  desc:"Auto-populate the work-order dollar amount from the total hours and the posted $195/hr labor rate.",
  verdict:"Confirmed absent: js/work-orders.js has independent manual inputs woFormDollar (L360) and woFormEstHours (L365) with no auto-calc. Small: auto-populate dollar_value = total hours x $195/hr (task est_hours rollup when present, else WO-level, per L145-148), with an editable override."},
 {id:"ed1b873e",by:"Roland",date:"06-07",cat:"Auth/Cost",loe:"XL",theme:"Auth & cost",
  desc:"Replace Google-email auth (~$25/mo each, ~$500/mo total; most staff don't use the email) with database-specific auth.",
  verdict:"Confirmed still Google-based: js/auth.js signInWithIdToken + google.accounts One Tap + js/config.js GOOGLE_CONFIG (L79); the check-in kiosk too. Swapping to Supabase password/magic-link or shared role accounts would drop roughly $500/mo but touches every page sign-in plus the email-keyed RBAC. Roland wants to scope this together."},
];

const ORDER={XL:0,L:1,M:2,S:3};
let activeFilter="all", query="";

function renderStats(){
  const c={XL:0,L:0,M:0,S:0};
  ERS.forEach(e=>c[e.loe]++);
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="n">${ERS.length}</div><div class="l">Open ERs (all Needed)</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--xl)">${c.XL}</div><div class="l">XL — new subsystem</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--l)">${c.L}</div><div class="l">L — multi-session</div></div>`+
    `<div class="stat"><div class="n" style="color:#7fb0ff">${c.M}</div><div class="l">M — ½–1 session</div></div>`+
    `<div class="stat"><div class="n" style="color:var(--s)">${c.S}</div><div class="l">S — under 2h*</div></div>`;
}
function renderList(){
  const list=document.getElementById('list'); list.innerHTML="";
  const q=query.toLowerCase();
  const shown=ERS.filter(e=>{
    if(activeFilter!=="all"&&e.loe!==activeFilter) return false;
    if(q){const blob=(e.id+e.by+e.cat+e.desc+e.verdict+e.theme).toLowerCase(); if(!blob.includes(q)) return false;}
    return true;
  });
  const themes=[...new Set(shown.map(e=>e.theme))];
  themes.forEach(th=>{
    const h=document.createElement('div'); h.className="theme"; h.textContent=th; list.appendChild(h);
    shown.filter(e=>e.theme===th).sort((a,b)=>ORDER[a.loe]-ORDER[b.loe]).forEach(e=>{
      const d=document.createElement('div'); d.className="er b-"+e.loe;
      d.innerHTML=`<div class="top"><p class="desc">${e.desc}</p>
        <span class="tag t-${e.loe}">LOE ${e.loe}</span></div>
        <div class="meta">${e.id} · ${e.by} · ${e.date} · ${e.cat}</div>
        <div class="verdict">${e.verdict}</div>`;
      list.appendChild(d);
    });
  });
  if(!shown.length) list.innerHTML='<div class="sub">No ERs match.</div>';
}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); activeFilter=p.dataset.f; renderList();
}));
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; renderList();});
renderStats(); renderList();
</script>
</body>
</html>
