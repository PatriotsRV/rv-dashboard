# prod-smoke.yml — Session 179 (2026-08-23)
#
# LAYER 3 of 3: DETECT.
#
# Roland's requirement after the v1.498 outage: "if it does happen, it's fixed
# immediately instead of me or a worker finding out the hard way."
#
# S178's post-deploy check was a curl. A curl returns HTTP 200 for a completely
# broken page, which is why v1.498's check passed while the dashboard was
# unusable. This one fetches the live page and asserts it is actually a working
# dashboard — head intact, no changelog leaking into the body, expected content
# present, version.json agreeing with the served HTML.
#
# A failure fails the workflow, which sends Roland the standard GitHub Actions
# failure email. Detection goes from "a worker tells you" to a few minutes.
#
# Schedule note: every 15 min during shop hours (11:00-01:00 UTC ~= 6am-8pm CT),
# hourly otherwise. GitHub may delay scheduled runs under load; that is fine for
# a watchdog.
#
# Session 199 (2026-10-08): second job `notifications` — the NOTIFICATION WATCHDOG.
# Two silent outages (S116: Daily Ops Health dead 4 months; S194: staff
# notifications dead 4 days) were invisible because cron.job_run_details says
# "succeeded" when net.http_post merely returns a request id. This job calls
# public.notification_watchdog() (migration notification_watchdog_s199.sql) over
# SUPABASE_DB_URL and FAILS when due `pending` rows are >2h old or any 401 hit a
# cron-called edge fn in the last 6h. Same GitHub failure email as the page check.
# Deliberately independent of every PRVS edge fn, Gmail and the queue itself.

name: Production Smoke Test

on:
  schedule:
    - cron: '*/15 11-23,0-1 * * *'
    - cron: '0 * * * *'
  push:
    branches: [main]          # immediately after every promote
  workflow_dispatch:

concurrency:
  group: prod-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Is production actually working?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install html5lib

      # GitHub Pages needs a moment to rebuild after a push to main.
      - name: Wait for Pages to rebuild
        if: github.event_name == 'push'
        run: sleep 90

      - name: Smoke test production
        run: python3 scripts/smoke_prod.py

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::PRODUCTION IS BROKEN — https://patriotsrv.github.io/rv-dashboard/"
          echo ""
          echo "The live dashboard failed a structural check. Staff are probably"
          echo "looking at a broken page right now."
          echo ""
          echo "First thing to check: the index.html header changelog comment."
          echo "A stray '-->' or an insert landing inside it closes the comment"
          echo "early and dumps ~630 lines of changelog into the page body."
          echo "That was the v1.498 outage (S179 fixed it in v1.499)."
          echo ""
          echo "Reproduce locally:  python3 scripts/check_html_structure.py"
          exit 1

  notifications:
    name: Are notifications flowing?
    if: github.event_name != 'push'      # schedule + manual only; a promote proves nothing here
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Ask the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret is NOT set - notification watchdog SKIPPED."
            exit 0
          fi
          OUT=$(psql "$SUPABASE_DB_URL" -tAX -v ON_ERROR_STOP=1 -c "select public.notification_watchdog()")
          echo "$OUT" | python3 -m json.tool
          PROBLEMS=$(echo "$OUT" | python3 -c "import sys,json; print(len(json.load(sys.stdin)['problems']))")
          if [ "$PROBLEMS" != "0" ]; then
            echo "$OUT" | python3 -c "import sys,json; [print('::error::' + p) for p in json.load(sys.stdin)['problems']]"
            echo ""
            echo "NOTIFICATIONS ARE NOT FLOWING. Triage (read-only, Supabase SQL editor):"
            echo "  select * from net._http_response where status_code=401 and created > now()-interval '6 hours';"
            echo "  select id, source, subject, scheduled_at, error_message from scheduled_notifications where status='pending' and scheduled_at < now()-interval '2 hours' order by scheduled_at;"
            echo "If 401s: a cron-called fn lost --no-verify-jwt -> bash scripts/deploy_fn.sh <fn>."
            echo "If DEFERRED rows: Gmail throttled; v1.1 retries every 15 min - check error_message."
            exit 1
          fi
